<!DOCTYPE html>
<html lang="en">
<head>

<title>Research Methodologies &amp; Ethics — Midterm Simulator</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --muted:#5d6672;
  --line:#dfe3e9; --accent:#2f5fd0; --accent-soft:#e8eefc;
  --ok:#0f7a47; --ok-soft:#e3f5ec; --bad:#b32533; --bad-soft:#fdeaec;
  --warn:#8a5a00; --warn-soft:#fdf3df;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --card:#1a1f26; --ink:#e9edf2; --muted:#9aa5b1;
    --line:#2a313a; --accent:#7aa2f7; --accent-soft:#1e2a44;
    --ok:#5fd3a0; --ok-soft:#133227; --bad:#ff8b96; --bad-soft:#3a1b20;
    --warn:#f0c674; --warn-soft:#352c16;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --card:#1a1f26; --ink:#e9edf2; --muted:#9aa5b1;
  --line:#2a313a; --accent:#7aa2f7; --accent-soft:#1e2a44;
  --ok:#5fd3a0; --ok-soft:#133227; --bad:#ff8b96; --bad-soft:#3a1b20;
  --warn:#f0c674; --warn-soft:#352c16;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:16px;
}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 18px}
.bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:4px}
.meta b{color:var(--ink)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;font-weight:700}
.qtext{font-size:17px;font-weight:600;margin:14px 0 16px;line-height:1.5}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font:inherit;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-weight:800;color:var(--muted);min-width:18px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;opacity:1}
textarea{width:100%;min-height:120px;padding:12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 20px;
  font:inherit;font-weight:650;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:7px 13px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.fb{border-radius:10px;padding:14px 16px;margin-top:16px;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.part{background:var(--warn-soft);border-color:var(--warn)}
.fb h4{margin:0 0 8px;font-size:15px}
.fb p{margin:7px 0}
.fb .lbl{font-weight:700}
ul.items{margin:8px 0 0;padding-left:20px}
ul.items li{margin:4px 0}
li.hit{color:var(--ok)}
li.miss{color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.center{text-align:center}
.score{font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.wk{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:14px 16px;margin-top:16px}
.wk h4{margin:0 0 8px;font-size:14px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink)}
.rev{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.rev .q{font-weight:600;font-size:14px}
.rev .a{font-size:13px;margin-top:5px}
.mode{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:11px;
  font:inherit;cursor:pointer;transition:.12s}
.mode:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode .mt{font-weight:700;font-size:16px;margin-bottom:3px}
.mode .mn{font-size:13px;color:var(--muted)}
.themeBtn{background:transparent;border:1.5px solid var(--line);color:var(--muted);
  border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
</style>
</head>

/* ============================================================
   QUESTION BANK — Chapter 1
   Every item is drawn strictly from the uploaded Chapter 1 slides.

const CH1 = [

/* ---------- MCQ (30) ---------- */
{t:"mcq",topic:"Applied vs. Fundamental",
 q:"A team studies human behaviour with a view to making generalisations about human behaviour. No particular organization&rsquo;s problem prompted the study. According to the chapter, this is best classified as:",
 o:["Applied research","Descriptive research","Fundamental (&lsquo;pure&rsquo; or &lsquo;basic&rsquo;) research","Analytical research"],
 a:2,
 why:"The chapter gives this precise case: &ldquo;research studies concerning human behaviour carried on with a view to make generalisations about human behaviour are also examples of <b>fundamental research</b>.&rdquo; Fundamental research is concerned with generalizations and with the formulation of a theory; gathering knowledge for knowledge&rsquo;s sake is termed &lsquo;pure&rsquo; or &lsquo;basic&rsquo; research.",
 w:["Applied research aims at a solution for an <i>immediate problem</i> facing a society or an industrial/business organization &mdash; which the stem explicitly rules out.","Descriptive research describes the state of affairs as it exists at present, through surveys and fact-finding enquiries; the aim here is generalisation, not description.","","Analytical research uses facts or information <i>already available</i> and critically evaluates them; nothing in the stem says the data already exist."]},

{t:"mcq",topic:"Objectives of research",
 q:"Which of the following is listed in the chapter as an <b>objective</b> of research (not a motivation)?",
 o:["To find out the truth which has not been discovered yet","To get intellectual joy of doing some creative work","To serve the society","To attain a high position in the social structure"],
 a:0,
 why:"The chapter gives exactly two objectives: &ldquo;to discover answers to questions through the application of scientific procedures&rdquo; and &ldquo;to find out the truth which has not been discovered yet.&rdquo;",
 w:["","Intellectual joy is listed under <b>Motivations</b> of research, not objectives.","Desire to serve the society is listed under <b>Motivations</b>.","Attaining a high position in the social structure is listed under <b>Significance</b> of research (for master&rsquo;s and PhD students)."]},

{t:"mcq",topic:"Motivations of research",
 q:"The chapter notes that &ldquo;concern over practical problems initiates research.&rdquo; This remark belongs to which motivation?",
 o:["Desire to get respectability","Desire to serve the society","Desire to get a research degree along with its consequential benefits","Desire to face the challenge in solving the unsolved problems"],
 a:3,
 why:"That exact note is attached to the motivation &ldquo;Desire to face the challenge in solving the unsolved problems, i.e., concern over practical problems initiates research.&rdquo;",
 w:["Respectability is a separate, stand-alone motivation with no such note.","Serving the society is a separate motivation; the practical-problems remark is not attached to it.","The research-degree motivation is linked to &ldquo;consequential benefits,&rdquo; not to practical problems.",""]},

{t:"mcq",topic:"Correlational research",
 q:"In the chapter&rsquo;s discussion of correlational research, a <b>variable</b> is defined as:",
 o:["A factor that the researcher deliberately manipulates","A characteristic that remains constant across groups","The outcome measure compared between two groups","Anything that can take on different values"],
 a:3,
 why:"The chapter defines it directly: &ldquo;A variable is anything that can take on different values, such as weight, time, and height.&rdquo;",
 w:["Manipulation by the researcher is not part of the chapter&rsquo;s definition; in fact descriptive research is described as having <i>no</i> control over variables.","This is the opposite of the definition &mdash; a variable takes on <i>different</i> values.","The &ldquo;one outcome measure&rdquo; wording belongs to the definition of <b>experimental</b> research, not of a variable.",""]},

{t:"mcq",topic:"Correlational research",
 q:"According to the chapter, if a correlation between two variables is strong enough, knowing about one variable allows a researcher to:",
 o:["Make a prediction about the other variable","Conclude that one variable caused the other","Reject the null hypothesis without statistical analysis","Generalize the finding to any population"],
 a:0,
 why:"The chapter&rsquo;s note states: &ldquo;If a correlation between two variables is strong enough, knowing about one variable allows a researcher to make a <b>prediction</b> about the other variable.&rdquo;",
 w:["","The chapter explicitly warns the opposite: in a correlational study, a strong relationship does <i>not</i> permit a causal conclusion.","Rejecting the null hypothesis is described as a decision made <i>with the assistance of statistics</i>, under Analyses.","Generalizability is discussed under <b>Replication</b>, not correlation strength."]},

{t:"mcq",topic:"Correlational research",
 q:"A researcher finds that GPAs <b>decrease</b> as SAT scores increase. According to the chapter, this is an example of:",
 o:["A positive correlation","No correlation","An experimental effect","A negative (inverse) correlation"],
 a:3,
 why:"The chapter uses this exact example: &ldquo;if GPAs decrease as SAT scores increase, there is a <b>negative correlation</b> between SAT scores and GPAs.&rdquo; In a negative (inverse) correlation the variables change in opposite directions.",
 w:["Positive correlation is defined as both variables changing in the <i>same</i> direction (either increase or decrease).","The variables clearly change together, just in opposite directions &mdash; that is a correlation, not its absence.","No groups are being compared and no causation is being tested, so this is not experimental research.",""]},

{t:"mcq",topic:"Scientific method &mdash; definitions",
 q:"According to the chapter, scientists define key concepts and terms in the context of their research studies by using:",
 o:["Conceptual definitions","Empirical definitions","Operational definitions","Analytical definitions"],
 a:2,
 why:"The chapter&rsquo;s Test Yourself item states that scientists define key concepts and terms in the context of their research studies by using <b>operational</b> definitions.",
 w:["&ldquo;Conceptual&rdquo; in this chapter labels a <i>type of research</i> (related to abstract ideas or theory), not a kind of definition.","&ldquo;Empirical&rdquo; names the evidence-based <i>approach</i> relying on direct observation and experimentation.","&ldquo;Analytical&rdquo; names a <i>type of research</i> that critically evaluates already-available information.",""]},

{t:"mcq",topic:"Experimental research",
 q:"The chapter defines experimental research as comparing two groups on one outcome measure in order to test a hypothesis regarding:",
 o:["Correlation","Causation","Description","Generalization"],
 a:1,
 why:"The chapter states: &ldquo;Experimental research: involves comparing two groups on one outcome measure to test some hypothesis regarding <b>causation</b>.&rdquo;",
 w:["Determining whether variables are <i>related</i> is the goal of correlational research, not experimental research.","","Description of the state of affairs as it exists at present is the purpose of <b>descriptive</b> research.","Generalization is associated with <b>fundamental</b> research and with replication, not with the definition of an experiment."]},

{t:"mcq",topic:"Scientific method &mdash; characteristics",
 q:"Which of the following is <b>NOT</b> listed in the chapter among the characteristics of the scientific method?",
 o:["Replication","Generalization","Analyses","Questions"],
 a:1,
 why:"The chapter lists eight characteristics: empirical approach, observations, questions, hypotheses, experiments, analyses, conclusions, and replication. <b>Generalization is not one of them.</b> The word appears elsewhere in the chapter &mdash; as the concern of fundamental research, and as one purpose served by replication &mdash; but it is not itself a characteristic of the scientific method.",
 w:["Replication is listed, and the chapter calls it one of the most important elements of the scientific method.","","Analyses is listed; the chapter devotes a slide to the use of statistical techniques.","Questions is listed; the chapter describes translating a research idea into an answerable question."]},

{t:"mcq",topic:"Experimental research",
 q:"In that same example, why would the two groups be treated <b>exactly the same</b> apart from the medication they receive?",
 o:["So that the researcher could isolate the effects of the medications","So that participants would not know which group they were in","So that the study could be replicated by other researchers","So that the sample would be representative of the population"],
 a:0,
 why:"The chapter states: &ldquo;Besides receiving different medications, the groups would be treated exactly the same so that the research could <b>isolate the effects</b> of the medications.&rdquo;",
 w:["","Blinding of participants is not discussed in the chapter.","Replication is defined separately as repeating the study with <i>another group of participants</i>, and is not the reason given here.","Representativeness of the sample is not the reason given in the chapter for equal treatment of groups."]},

{t:"mcq",topic:"Descriptive vs. Analytical",
 q:"Which statement best captures the <b>main characteristic</b> of descriptive research as described in the chapter?",
 o:["The researcher formulates a theory and then tests it statistically","The researcher has no control over the variables and can only report what has happened or is happening","The researcher critically evaluates information that is already available","The researcher randomly assigns participants to groups before measuring an outcome"],
 a:1,
 why:"The chapter&rsquo;s note reads: &ldquo;The main characteristic of this method is that the researcher <b>has no control over the variables</b>; he can only report what has happened or what is happening.&rdquo;",
 w:["Formulating a theory is associated with <b>fundamental</b> research, not descriptive research.","","Critically evaluating already-available material is the definition of <b>analytical</b> research.","Random assignment to groups belongs to the <b>experimental</b> research example."]},

{t:"mcq",topic:"Descriptive vs. Analytical",
 q:"A government agency runs a nationwide survey documenting the current state of household internet access. It manipulates nothing and reports what exists at present. According to the chapter, this is:",
 o:["Analytical research","Experimental research","Descriptive research","Conceptual research"],
 a:2,
 why:"Descriptive research &ldquo;includes surveys and fact-finding enquiries of different kinds,&rdquo; its major purpose being &ldquo;<b>description of the state of affairs as it exists at present</b>,&rdquo; and the researcher &ldquo;has no control over the variables.&rdquo; The chapter also states that the methods utilized in descriptive research are survey methods of all kinds, including comparative and correlational methods.",
 w:["Analytical research uses facts or information <i>already available</i> and critically evaluates them; here fresh survey data are being collected.","Experimental research compares two groups on one outcome measure to test a hypothesis regarding causation; no groups are being compared here.","","Conceptual research relates to abstract ideas or theory and is generally used by philosophers and thinkers."]},

{t:"mcq",topic:"Descriptive vs. Analytical",
 q:"A researcher gathers government statistics that were already collected and critically evaluates them to reach an assessment. According to the chapter, this is:",
 o:["Analytical research","Descriptive research","Applied research","Empirical research"],
 a:0,
 why:"The chapter defines analytical research as research in which &ldquo;the researcher has to use <b>facts or information already available</b>, and analyze these to make a critical evaluation of the material.&rdquo;",
 w:["","Descriptive research describes the state of affairs as it exists at present, typically through surveys and fact-finding enquiries.","Applied research is defined by its aim &mdash; solving an immediate problem &mdash; not by the use of pre-existing data.","Empirical research relies on <i>direct observation and experimentation</i> to acquire new knowledge, not on already-available facts."]},

{t:"mcq",topic:"Applied vs. Fundamental",
 q:"Research aimed at reaching a solution for a concrete social or business problem facing an organization is classified in the chapter as:",
 o:["Applied research","Fundamental research","Conceptual research","Pure research"],
 a:0,
 why:"The chapter defines applied research as research that &ldquo;aims at finding a solution for an <b>immediate problem</b> facing a society or an industrial/business organization.&rdquo;",
 w:["","Fundamental research is concerned with generalizations and with the formulation of a theory.","Conceptual research relates to abstract ideas or theory and is used by philosophers and thinkers.","&lsquo;Pure&rsquo; is given in the chapter as another name for <b>fundamental/basic</b> research &mdash; the opposite of applied."]},

{t:"mcq",topic:"Scientific method &mdash; sequence",
 q:"According to the chapter, <b>after articulating the hypothesis</b>, the next step in the research process involves:",
 o:["Translating the research idea into an answerable question","Analyzing the data using statistical techniques","Deciding whether the null hypothesis should be rejected","Actually conducting the experiment or research study"],
 a:3,
 why:"The chapter states: &ldquo;After articulating the hypothesis, the next step involves <b>actually conducting the experiment or research study</b>,&rdquo; and notes that a key aspect of this is measuring the phenomenon of interest in an accurate and reliable manner.",
 w:["That step comes <i>before</i> the hypothesis: the chapter places it right after getting a research idea.","Analysis comes <i>after</i> the study has been conducted and the data gathered.","That decision is made during the Analyses stage, once data exist &mdash; not immediately after the hypothesis is stated.",""]},

{t:"mcq",topic:"Quantitative vs. Qualitative",
 q:"A researcher interviews twelve managers in depth and reports recurring themes, making no attempt to summarize the findings statistically. According to the chapter, what makes this <b>qualitative</b> rather than quantitative research?",
 o:["The small number of participants involved","That it was carried out before any hypothesis was formed","That it does not attempt to quantify its results through statistical summary or analysis","That it relies on direct observation rather than experimentation"],
 a:2,
 why:"The chapter draws the line precisely here: qualitative research &ldquo;involves studies that <b>do not attempt to quantify their results through statistical summary or analysis</b>,&rdquo; typically using interviews and observations without formal measurement. Quantitative research, by contrast, is defined by formal and systematic measurement and the use of statistics.",
 w:["Sample size is not the chapter&rsquo;s criterion. The distinction rests on whether results are quantified statistically &mdash; which is why a case study of a single person counts as qualitative by its nature, not by its size.","The chapter notes qualitative research is <i>often</i> a source of hypotheses for later quantitative testing, but timing is not what defines it.","","Direct observation and experimentation define the <b>empirical approach</b>, which the chapter calls the guiding principle behind <i>all</i> research conducted in accordance with the scientific method &mdash; so it cannot be what separates qualitative from quantitative."]},

{t:"mcq",topic:"Quantitative vs. Qualitative",
 q:"The chapter describes a case study as an in-depth examination of one person, and classifies it as a form of:",
 o:["Experimental research","Qualitative research","Analytical research","Conceptual research"],
 a:1,
 why:"The chapter states: &ldquo;A case study, which is an in-depth examination of one person, is a form of <b>qualitative research</b>.&rdquo;",
 w:["Experimental research compares two groups to test causation &mdash; the opposite of examining one person in depth.","","Analytical research critically evaluates already-available facts; the chapter does not place the case study there.","Conceptual research deals with abstract ideas or theory, not with in-depth examination of a person."]},

{t:"mcq",topic:"Quantitative vs. Qualitative",
 q:"According to the chapter, qualitative research is often used as:",
 o:["A way of confirming results already obtained statistically","A replacement for statistical analysis in large samples","A source of hypotheses for later testing in quantitative research","A method for establishing causation between two variables"],
 a:2,
 why:"The chapter&rsquo;s note reads: &ldquo;Qualitative research is often used as a <b>source of hypotheses for later testing in quantitative research</b>.&rdquo;",
 w:["The chapter puts qualitative research <i>before</i> quantitative testing, as a source of hypotheses &mdash; not as a confirmation step after it.","The chapter does not present qualitative research as a replacement for statistics in large samples.","","Testing hypotheses regarding causation is the stated purpose of <b>experimental</b> research."]},

{t:"mcq",topic:"Conceptual vs. Empirical",
 q:"The chapter states that conceptual research is generally used by:",
 o:["Philosophers and thinkers, to develop new concepts or reinterpret existing ones","Social scientists, to study social relationships","Analysts and intellectuals, to generalize new theories","Business organizations, to solve immediate operational problems"],
 a:0,
 why:"The chapter states: conceptual research &ldquo;is generally used by <b>philosophers and thinkers</b> to develop new concepts or to reinterpret existing ones.&rdquo;",
 w:["","Social scientists are mentioned under the <b>significance</b> of research (studying social relationships), not as the users of conceptual research.","Analysts and intellectuals appear under <b>significance</b> of research (generalisations of new theories) &mdash; a close but different statement.","Solving an immediate organizational problem is the aim of <b>applied</b> research."]},

{t:"mcq",topic:"Conceptual vs. Empirical",
 q:"How does the chapter characterize the empirical approach, with its emphasis on direct, systematic and careful observation?",
 o:["As one optional technique among several in quantitative research","As the defining feature of qualitative research","As a method used mainly in descriptive surveys","As the guiding principle behind all research conducted in accordance with the scientific method"],
 a:3,
 why:"The chapter&rsquo;s note reads: the empirical approach &ldquo;is best thought of as the <b>guiding principle behind all research</b> conducted in accordance with the scientific method.&rdquo;",
 w:["The chapter elevates it well beyond an optional technique &mdash; it calls it the guiding principle behind <i>all</i> such research.","Qualitative research is defined by not quantifying results statistically, not by the empirical approach.","Descriptive research is associated with survey methods; the empirical approach is not restricted to it.",""]},

{t:"mcq",topic:"Significance of research",
 q:"According to the chapter, for <b>philosophers and thinkers</b>, research may mean:",
 o:["A way to attain a high position in the social structure","The outlet for new ideas and insights","The generalisations of new theories","The basis for government economic policy"],
 a:1,
 why:"The chapter states: &ldquo;For philosophers and thinkers, research may mean the <b>outlet for new ideas and insights</b>.&rdquo;",
 w:["Attaining a high position in the social structure is what research may mean for <b>master&rsquo;s and PhD students</b>.","","Generalisations of new theories is what research may mean for <b>analysts and intellectuals</b>.","Providing the basis for government policies is listed as a general significance point, not as what research means to philosophers."]},

{t:"mcq",topic:"Methods vs. Methodology",
 q:"Which description matches <b>research methodology</b> as defined in the chapter?",
 o:["A science of studying how research is done scientifically","All those methods and techniques used for the conduction of research","The methods researchers use in performing research operations","The statistical techniques used to analyze gathered data"],
 a:0,
 why:"The chapter defines research methodology as &ldquo;a way to systematically solve the research problem&hellip; a <b>science of studying how research is done scientifically</b>.&rdquo;",
 w:["","This is the chapter&rsquo;s definition of research <b>methods</b>, not methodology.","This too is part of the definition of research <b>methods</b> &mdash; the methods used in performing research operations.","Statistical techniques are discussed under <b>Analyses</b> in the scientific method, not as the definition of methodology."]},

{t:"mcq",topic:"Methods vs. Methodology",
 q:"Which term does the chapter define as referring to &ldquo;the various steps that are generally adopted by a researcher in studying his research problem <b>along with the logic behind them</b>&rdquo;?",
 o:["Research methods","The scientific method","The empirical approach","Research methodology"],
 a:3,
 why:"That phrase, including &ldquo;along with the logic behind them,&rdquo; is part of the chapter&rsquo;s definition of <b>research methodology</b>.",
 w:["Research methods are defined as the methods/techniques used in performing research operations &mdash; without the &lsquo;logic behind them&rsquo; clause.","The scientific method is presented through its eight characteristics, not with this definition.","The empirical approach is the evidence-based reliance on direct observation and experimentation.",""]},

{t:"mcq",topic:"Scientific method &mdash; Observations",
 q:"The chapter says that, in scientific research, observation refers to <b>two distinct concepts</b>. These are:",
 o:["Measuring accurately and measuring consistently","Being aware of the world around us, and making careful measurements","Describing the present state of affairs, and predicting future events","Collecting data, and evaluating data"],
 a:1,
 why:"The chapter states: &ldquo;observation refers to two distinct concepts&mdash;<b>being aware of the world around us and making careful measurements</b>.&rdquo;",
 w:["Accuracy (correct) and reliability (consistent) are the two measurement concepts &mdash; a different pair, discussed under Experiments.","","Description and prediction are two of the three general <i>goals</i> of scientific research, not the two senses of observation.","Collecting and evaluating data appear in the definition of research, not in the definition of observation."]},

{t:"mcq",topic:"Hypotheses",
 q:"The chapter defines a hypothesis as:",
 o:["An educated and testable guess about the answer to your research question","A statement of the problem that the research intends to solve","A conclusion drawn after the data have been analyzed","A prediction that has already been supported by data"],
 a:0,
 why:"The chapter states: &ldquo;Hypothesis: is simply an <b>educated and testable guess</b> about the answer to your research question&rdquo; &mdash; often described as the researcher&rsquo;s attempt to explain the phenomenon of interest.",
 w:["","Defining and redefining problems is listed as part of what research comprises, not as the definition of a hypothesis.","Conclusions come <i>after</i> analysis; the hypothesis is formulated before the study is conducted.","A hypothesis is tested and may be either supported <i>or refuted</i>; it is not already supported."]},

{t:"mcq",topic:"Hypotheses",
 q:"According to the chapter, what is a <b>key feature of all</b> hypotheses?",

/* Flat bank: every question tagged with its chapter. */
const ALL = [];
CH1.forEach(q => ALL.push(Object.assign({ch:1}, q)));
CH2.forEach(q => ALL.push(Object.assign({ch:2}, q)));

const IDX1 = ALL.map((q,i)=>q.ch===1?i:-1).filter(i=>i>=0);
const IDX2 = ALL.map((q,i)=>q.ch===2?i:-1).filter(i=>i>=0);

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function countTypes(idx){
  const c={mcq:0,tf:0,enum:0};
  idx.forEach(i=>c[ALL[i].t]++);
  return c;
}

/* ============================================================
   ENGINE
   ============================================================ */
const app = document.getElementById('app');
let S = null;

function esc(s){return String(s).replace(/&(?![a-z#]+;)/g,'&amp;').replace(/</g,'&lt;');}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}

const MODES = {
  ch1:  {label:"Chapter 1",            idx:()=>IDX1,                      all:IDX1},
  ch2:  {label:"Chapter 2",            idx:()=>IDX2,                      all:IDX2},
  both: {label:"Both chapters mixed",  idx:()=>shuffle(IDX1.concat(IDX2)), all:IDX1.concat(IDX2)}
};

function launch(mode){
  const m = MODES[mode];
  start(m.label, m.idx(), mode);
}

function start(bankName, indices, mode){
  S = {
    bankName, bank: ALL, mode: mode || (S && S.mode) || 'ch1',
    order: indices,
    pos: 0, correct: 0, wrong: 0,
    wrongIdx: [], log: [],
    submitted:false, picked:null, result:null, typed:""
  };
  render();
}

function render(){
  if(!S){ return home(); }
  if(S.pos >= S.order.length){ return report(); }
  question();
}

function home(){
  function tile(mode, title, note){
    const idx = MODES[mode].all;
    const n = idx.length;
    const c = countTypes(idx);
    const ready = n > 0 && (mode !== 'both' || (IDX1.length > 0 && IDX2.length > 0));
    const breakdown = ready
      ? `${c.mcq} multiple choice &middot; ${c.tf} true/false &middot; ${c.enum} enumeration`
      : note;
    return `<button class="mode" data-mode="${mode}" ${ready?'':'disabled'}>
        <div class="mt">${title}</div>
        <div class="mn">${ready ? `<b>${n}</b> questions &mdash; ${breakdown}` : breakdown}</div>
      </button>`;
  }

  app.innerHTML = `
  <div class="card">
    <h2 style="margin:2px 0 6px;font-size:20px">Choose a practice mode</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 18px">
      Every question is based strictly on the course chapters. Difficulty: medium to hard.
      You get instant feedback after each answer, a score, and a review of what you missed.</p>
    ${tile('ch1','Chapter 1','')}
    ${tile('ch2','Chapter 2','Not added yet')}
    ${tile('both','Both chapters &mdash; shuffled','Available once Chapter 2 is added')}
  </div>`;

  [...document.querySelectorAll('.mode')].forEach(b=>{
    if(!b.disabled) b.onclick = ()=>launch(b.dataset.mode);
  });
}

function question(){
  const q = S.bank[S.order[S.pos]];
  const n = S.pos+1, tot = S.order.length;
  const done = S.correct + S.wrong;
  const pct = done ? Math.round(S.correct/done*100) : 0;
  const typeLabel = q.t==='mcq' ? 'Multiple choice' : q.t==='tf' ? 'True / False' : 'Enumeration';

  let body = '';
  if(q.t==='mcq'){
    body = q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${o}</span></button>`).join('');
  } else if(q.t==='tf'){
    body = ['True','False'].map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i?'F':'T'}</span><span>${o}</span></button>`).join('');
  } else {
    body = `<textarea id="ta" placeholder="Type one item per line…"></textarea>
            <div class="hint">Write ${q.items.length} items, one per line. Your wording does not have to match exactly &mdash; key terms are enough.</div>`;
  }

  app.innerHTML = `
  <div class="card">
    <div class="meta">
      <span>Question <b>${n}</b> of <b>${tot}</b></span>
      <span>Correct <b style="color:var(--ok)">${S.correct}</b></span>
      <span>Incorrect <b style="color:var(--bad)">${S.wrong}</b></span>
      <span>Score <b>${pct}%</b></span>
    </div>
    <div class="bar"><i style="width:${(S.pos/tot*100)}%"></i></div>
    <span class="tag">${typeLabel}</span>
    <div class="qtext">${q.q}</div>
    <div id="body">${body}</div>
    <div id="fb"></div>
    <div class="row" id="ctrl">
      <button class="btn" id="submit">Submit answer</button>
      <button class="btn ghost small" id="quit">End &amp; see report</button>
    </div>
  </div>`;

  document.getElementById('quit').onclick = ()=>{ S.order = S.order.slice(0,S.pos); S.pos = S.order.length; render(); };

  if(q.t==='enum'){
    const ta = document.getElementById('ta'); ta.focus();
    document.getElementById('submit').onclick = ()=>gradeEnum(q, ta.value);
  } else {
    let picked = null;
    const btns = [...document.querySelectorAll('.opt')];
    btns.forEach(b=>b.onclick=()=>{ picked = +b.dataset.i; btns.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); });
    document.getElementById('submit').onclick = ()=>{
      if(picked===null){ document.getElementById('fb').innerHTML =
        `<div class="fb part"><p style="margin:0">Choose an option before submitting.</p></div>`; return; }
      gradeChoice(q, picked, btns);
    };
  }
}

function gradeChoice(q, picked, btns){
  const ans = q.t==='tf' ? (q.a ? 0 : 1) : q.a;
  const ok = picked === ans;
  btns.forEach((b,i)=>{ b.disabled = true; b.classList.remove('sel');
    if(i===ans) b.classList.add('right');
    else if(i===picked) b.classList.add('wrong'); });

  let html;
  if(ok){
    html = `<div class="fb ok"><h4>✅ Correct</h4><p>${q.why}</p></div>`;
  } else {
    const chosen = q.t==='tf' ? (picked===0?'True':'False') : `<b>${"ABCD"[picked]}</b> &mdash; ${q.o[picked]}`;
    const right  = q.t==='tf' ? (q.a?'True':'False')        : `<b>${"ABCD"[ans]}</b> &mdash; ${q.o[ans]}`;
    const wrongNote = (q.w && q.w[picked]) ? `<p><span class="lbl">Why your answer is wrong:</span> ${q.w[picked]}</p>` : '';
    html = `<div class="fb bad"><h4>❌ Incorrect</h4>
      <p><span class="lbl">You chose:</span> ${chosen}</p>
      ${wrongNote}
      <p><span class="lbl">Correct answer:</span> ${right}</p>
      <p><span class="lbl">Why it is correct:</span> ${q.why}</p></div>`;
  }
  finish(q, ok, html);
}

function gradeEnum(q, raw){
  const lines = raw.split('\n').map(l=>norm(l)).filter(l=>l.length>1);
  const hits = new Array(q.items.length).fill(false);
  lines.forEach(line=>{
    for(let i=0;i<q.items.length;i++){
      if(hits[i]) continue;
      const it = q.items[i];
      if(it.not && it.not.some(k=>line.includes(k))) continue;
      if(it.keys.some(k=>line.includes(k))){ hits[i]=true; return; }
    }
  });
  const got = hits.filter(Boolean).length, need = q.items.length;
  const ok = got === need;
  const cls = ok ? 'ok' : (got>0 ? 'part' : 'bad');
  const head = ok ? '✅ Correct &mdash; all items found'
                  : `${got>0?'⚠️':'❌'} ${got} of ${need} items matched`;
  const list = q.items.map((it,i)=>`<li class="${hits[i]?'hit':'miss'}">${hits[i]?'✔':'✘'} ${it.label}</li>`).join('');
  const html = `<div class="fb ${cls}"><h4>${head}</h4>
    <p><span class="lbl">The chapter&rsquo;s items:</span></p>
    <ul class="items">${list}</ul>
    <p style="margin-top:10px">${q.why}</p>
    ${ok?'':'<p class="hint" style="margin-top:6px">If an item you wrote was correct but not matched, use &ldquo;Count as correct&rdquo;.</p>'}
    </div>`;
  finish(q, ok, html, !ok);
}

function finish(q, ok, html, allowOverride){
  document.getElementById('fb').innerHTML = html;
  if(ok) S.correct++; else { S.wrong++; S.wrongIdx.push(S.order[S.pos]); }
  S.log.push({i:S.order[S.pos], ok, topic:q.topic});

  const last = S.pos === S.order.length-1;
  document.getElementById('ctrl').innerHTML =
    `<button class="btn" id="next">${last?'See final report':'Next question →'}</button>`
    + (allowOverride ? `<button class="btn ghost small" id="ovr">Count as correct</button>` : '')
    + `<button class="btn ghost small" id="quit2">End &amp; see report</button>`;

  document.getElementById('next').onclick = ()=>{ S.pos++; render(); };
  document.getElementById('quit2').onclick = ()=>{ S.pos++; S.order = S.order.slice(0,S.pos); render(); };
  const ovr = document.getElementById('ovr');
  if(ovr) ovr.onclick = ()=>{
    S.correct++; S.wrong--;
    S.wrongIdx = S.wrongIdx.filter(x=>x!==S.order[S.pos]);
    S.log[S.log.length-1].ok = true;
    ovr.disabled = true; ovr.textContent = 'Counted as correct';
  };
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function report(){
  const tot = S.log.length;
  const pct = tot ? Math.round(S.correct/tot*100) : 0;
  const mixed = S.mode === 'both';
  const byTopic = {};
  S.log.forEach(e=>{
    const key = mixed ? `Ch.${ALL[e.i].ch} &mdash; ${e.topic}` : e.topic;
    byTopic[key] = byTopic[key] || {n:0,bad:0};
    byTopic[key].n++; if(!e.ok) byTopic[key].bad++; });
  const weak = Object.entries(byTopic).filter(([,v])=>v.bad>0).sort((a,b)=>b[1].bad-a[1].bad);

  const rows = weak.map(([t,v])=>`<tr><td>${t}</td><td>${v.bad} of ${v.n} missed</td></tr>`).join('');
  const missed = S.wrongIdx.map(i=>{
    const q = S.bank[i];
    let right;
    if(q.t==='mcq') right = `<b>${"ABCD"[q.a]}</b> &mdash; ${q.o[q.a]}`;
    else if(q.t==='tf') right = q.a ? 'True' : 'False';
    else right = q.items.map(x=>x.label).join('; ');
    return `<div class="rev"><div class="q">${mixed?`<span class="tag" style="margin-right:7px">Ch.${q.ch}</span>`:''}${q.q}</div>
      <div class="a"><span class="lbl">Answer:</span> ${right}</div>
      <div class="a" style="color:var(--muted)">${q.why}</div></div>`;
  }).join('');

  app.innerHTML = `
  <div class="card center">
    <div class="tag">${S.bankName} &mdash; final report</div>
    <div class="score">${pct}%</div>
    <p style="color:var(--muted);margin:0 0 14px">
      Correct <b style="color:var(--ok)">${S.correct}</b> / ${tot}
      &nbsp;&middot;&nbsp; Incorrect <b style="color:var(--bad)">${S.wrong}</b> / ${tot}
    </p>
    ${weak.length ? `<div class="wk" style="text-align:left">
        <h4>Topics to review</h4>
        <table><tr><th>Topic</th><th>Missed</th></tr>${rows}</table>
      </div>` : `<div class="fb ok" style="text-align:left"><p style="margin:0">
        No incorrect answers &mdash; nothing flagged for review.</p></div>`}
    <div class="row" style="justify-content:center">
      ${S.wrongIdx.length ? `<button class="btn" id="retry">Retry my ${S.wrongIdx.length} wrong answer${S.wrongIdx.length>1?'s':''}</button>` : ''}
      <button class="btn ghost" id="again">Restart this set</button>
      <button class="btn ghost small" id="menu">Back to menu</button>
    </div>
  </div>
  ${missed ? `<div class="card" style="margin-top:14px">
      <h3 style="margin:0 0 4px;font-size:16px">Questions you missed</h3>
      ${missed}</div>` : ''}`;

  const r = document.getElementById('retry');
  if(r) r.onclick = ()=>start(S.bankName, S.wrongIdx.slice(), S.mode);
  document.getElementById('again').onclick = ()=>launch(S.mode);
  document.getElementById('menu').onclick = ()=>{ S=null; home(); };
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('theme').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

home();
</script>
</body>
</html>
