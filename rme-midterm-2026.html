: 10, "items": ["Choosing a research topic", "Literature review", "Formulating the research problem", "Development of working hypothesis", "Preparing the research design", "Collecting the data", "Analysis of data", "Generalisation and Interpretation", "Preparation of Report", "Criteria of good research"], "matchRules": [[["topic"]], [["literature"]], [["problem"]], [["hypothes", "hypothesis"]], [["design"]], [["collect", "collecting"]], [["analys", "analysis", "analyz"]], [["generali", "generalisation", "interpret", "interpretation"]], [["report"]], [["criteria", "good research"]]]}, {"chapter": 2, "set": "B", "topic": "Choosing a research topic", "pages": [4, 5, 6], "prompt": "Name the 4 sources from which, according to the chapter, researchers choose their research topics.", "explanation": "The chapter presents these four sources in turn, noting along the way that “research begets research,” because research tends to raise more questions than it answers.", "id": "B-C2-44", "type": "list", "required": 4, "items": ["The field within which the researcher works (competence gained through training and experience)", "Problem solving — the motivation to solve a particular problem", "Previous research — the results of prior research, whether their own or someone else’s", "Theory — a rich source of hypotheses that can be examined empirically"], "matchRules": [[["field", "expertise", "discipline", "training"]], [["problem solv", "solving", "solve"]], [["previous", "prior", "past research", "earlier research"]], [["theory"]]]}, {"chapter": 2, "set": "B", "topic": "Formulating the research problem", "pages": [9, 10], "prompt": "State the 3 criteria that good research problems must meet.", "explanation": "The chapter’s note lists exactly these three criteria for a good research problem.", "id": "B-C2-45", "type": "list", "required": 3, "items": ["The research problem should describe the relationship between two or more variables", "The research problem should take the form of a question", "The research problem must be capable of being tested empirically"], "matchRules": [[["relationship", "variable", "variables"]], [["question"]], [["empiric", "empirically", "tested", "testab", "test"]]]}, {"chapter": 2, "set": "B", "topic": "Working hypothesis", "pages": [12, 13], "prompt": "List the 4 approaches the chapter gives for developing working hypotheses.", "explanation": "The chapter answers the question “How does one go about developing working hypotheses?” with exactly these four approaches.", "id": "B-C2-46", "type": "list", "required": 4, "items": ["Discussions with colleagues and experts about the problem, its origin and the objectives in seeking a solution", "Examination of data and records, if available, for possible trends, peculiarities and other clues", "Review of similar studies in the area, or of studies on similar problems", "Exploratory personal investigation"], "matchRules": [[["colleague", "colleagues", "expert", "experts", "discussion", "discussions", "discuss"]], [["record", "records", "trend", "trends", "peculiar", "peculiarities", "clue", "clues", "examination of data"]], [["similar"]], [["exploratory", "personal investigation"]]]}, {"chapter": 2, "set": "B", "topic": "Research design", "pages": [18, 19], "prompt": "Name the 3 general categories into which research design falls.", "explanation": "The chapter states: “Research Design falls into one of three general categories: experimental, quasi-experimental, and nonexperimental,” and then gives the two questions that distinguish them.", "id": "B-C2-47", "type": "list", "required": 3, "items": ["Experimental (randomized or ‘true’ experimental — uses random assignment)", "Quasi-experimental (no random assignment, but multiple groups or multiple waves of measurement)", "Nonexperimental (no random assignment, and no multiple groups or waves of measurement)"], "matchRules": [[["experimental"]], [["quasi"]], [["nonexperimental", "non-experimental", "non experimental"]]]}, {"chapter": 2, "set": "B", "topic": "Collecting the data", "pages": [20], "prompt": "Mention the 5 ways of collecting the appropriate data that the chapter lists.", "explanation": "The chapter lists these five, noting that the ways of collecting data “differ considerably in context of money, costs, and time.”", "id": "B-C2-48", "type": "list", "required": 5, "items": ["Formal testing (psychological, educational, academic, intelligence)", "Interviewing", "Global ratings", "Observation", "Biological measures"], "matchRules": [[["formal test", "testing", "psychological", "educational", "intelligence"]], [["interview", "interviewing"]], [["global", "rating", "ratings"]], [["observ", "observation"]], [["biolog", "biological"]]]}, {"chapter": 2, "set": "B", "topic": "Analysis of data", "pages": [22, 23], "prompt": "List the 4 closely related operations that the analysis of data requires.", "explanation": "The chapter states that “the analysis of data requires a number of closely related operations” and lists exactly these four.", "id": "B-C2-49", "type": "list", "required": 4, "items": ["Establishment of categories", "The application of these categories to raw data through coding", "Tabulation", "Drawing statistical inferences"], "matchRules": [[["categor", "categories"]], [["coding", "code"]], [["tabulat", "tabulation"]], [["inference", "inferences", "infer", "statistic", "statistical"]]]}, {"chapter": 2, "set": "B", "topic": "Criteria of good research", "pages": [29, 30], "prompt": "Name the 4 characteristics the chapter gives when it says what good research is.", "explanation": "The chapter’s ‘Good research is:’ slide gives these four characteristics: systematic, logical, empirical and replicable.", "id": "B-C2-50", "type": "list", "required": 4, "items": ["Systematic — structured with specified steps taken in a specified sequence, in accordance with well defined rules", "Logical — guided by the rules of logical reasoning, through induction and deduction", "Empirical — related to aspects of a real situation, dealing with concrete data that provide a basis for external validity", "Replicable — allowing results to be verified by replicating the study, building a sound basis for decisions"], "matchRules": [[["systematic"]], [["logic", "logical"]], [["empiric", "empirical"]], [["replica", "replicable", "replicating"]]]}]</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('question-bank').textContent);
const byId=new Map(BANK.map(q=>[q.id,q]));
const KEY='research-midterm-v1.0';
const app=document.getElementById('app');
const letters=['A','B','C','D'];
let session=null,history=[],home=true,canStore=true;
function setTheme(theme,persist=false){document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)));if(persist)try{localStorage.setItem('research-midterm-theme',theme)}catch(e){}}
let initialTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
try{const savedTheme=localStorage.getItem('research-midterm-theme');if(['light','dark'].includes(savedTheme))initialTheme=savedTheme}catch(e){}
setTheme(initialTheme);
document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeChoice,true)));
// Conservative suggestions only: the learner confirms the matches before grading.
function normalizedWords(text){return String(text).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean)}
function editDistance(a,b){const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function closeWord(a,b){if(a===b)return true;const singular=s=>s.length>4&&s.endsWith('s')&&!s.endsWith('ss')?s.slice(0,-1):s;if(singular(a)===singular(b))return true;
  // Do not mistake a different real course term, or a negated term, for a typo.
  const distinct=['quantitative','qualitative','conceptual','empirical','applied','fundamental','descriptive','analytical','correlational','experimental'];
  if(distinct.includes(a)&&distinct.includes(b))return false;
  if(['un','non','in'].some(prefix=>a===prefix+b||b===prefix+a))return false;
  const n=Math.min(a.length,b.length);if(n<5)return false;const tolerance=n>=9?2:1;return Math.abs(a.length-b.length)<=tolerance&&editDistance(a,b)<=tolerance}
function phraseIn(words,phrase){const wanted=normalizedWords(phrase);return words.some((_,i)=>wanted.every((w,j)=>words[i+j]!==undefined&&closeWord(words[i+j],w)))}
function matchesListItem(q,index,text){
  const words=normalizedWords(text);if(!words.length)return false;
  const canonical=normalizedWords(q.items[index]);
  if(words.length===canonical.length&&words.every((w,i)=>closeWord(w,canonical[i])))return true;
  const allowed=q.id==='C1-47'&&index===0?['no','without']:q.id==='C1-41'&&index===1?['not']:[];
  if(words.some(w=>['not','no','never','without','cannot','cant','dont','doesnt','isnt','arent','non','unreliable'].includes(w)&&!allowed.includes(w)))return false;
  return (q.matchRules?.[index]||[]).length>0&&q.matchRules[index].every(group=>group.some(phrase=>phraseIn(words,phrase)));
}
function suggestListMatches(q,answers){
  // Maximum one-to-one matching: duplicates cannot earn multiple item credits.
  const edges=answers.map(s=>q.items.map((_,i)=>i).filter(i=>matchesListItem(q,i,s))),owner=Array(q.items.length).fill(-1);
  function assign(a,seen){for(const i of edges[a]){if(seen.has(i))continue;seen.add(i);if(owner[i]===-1||assign(owner[i],seen)){owner[i]=a;return true}}return false}
  answers.forEach((_,i)=>assign(i,new Set()));return owner.map((a,i)=>a<0?-1:i).filter(i=>i>=0);
}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function randomIndex(n){
  if(globalThis.crypto?.getRandomValues){let x=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(x)}while(x[0]>=limit);return x[0]%n}
  return Math.floor(Math.random()*n);
}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=randomIndex(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function prepareQueue(ids){
  const order=shuffle(ids),count=order.filter(id=>byId.get(id).type==='mcq').length;
  // Balanced positions, shuffled afresh; no repeating A/B/C/D sequence.
  const base=shuffle([0,1,2,3]);let slots=shuffle(Array.from({length:count},(_,i)=>base[i%4]));
  return order.map(id=>{const q=byId.get(id);let options=null;
    if(q.type==='mcq'){options=shuffle([1,2,3]);options.splice(slots.pop(),0,0)}
    return {id,options};
  });
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,session,history}));canStore=true}catch(e){canStore=false}storageStatus()}
function storageStatus(){document.getElementById('storage-status').textContent=canStore?'Progress is saved in this browser when storage is available':'Browser storage is unavailable; keep this tab open to retain progress'}
function validSaved(s){return s&&Array.isArray(s.queue)&&s.queue.length>0&&s.queue.every(x=>byId.has(x.id)&&(byId.get(x.id).type!=='mcq'||(Array.isArray(x.options)&&x.options.length===4&&new Set(x.options).size===4&&x.options.every(n=>[0,1,2,3].includes(n)))))&&Number.isInteger(s.index)&&s.index>=0&&s.index<=s.queue.length&&Array.isArray(s.answers)&&s.answers.every(a=>byId.has(a.id)&&typeof a.correct==='boolean')&&['question','compare','feedback','done'].includes(s.stage)}
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw?.version===1){if(validSaved(raw.session))session=raw.session;history=Array.isArray(raw.history)?raw.history.slice(-8):[]}}catch(e){canStore=false}
function current(){return byId.get(session.queue[session.index].id)}
function ref(q){return `Chapter ${q.chapter} · PDF page${q.pages.length>1?'s':''} ${q.pages.join(', ')}`}
function label(s=session){return s.retry?`Retry · ${s.baseLabel}`:s.baseLabel}
function stats(answers){const correct=answers.filter(a=>a.correct).length;return {correct,incorrect:answers.length-correct,total:answers.length,percent:answers.length?Math.round(correct/answers.length*100):0}}
function statsMarkup(answers){const t=stats(answers);return `<div class="stats"><div class="stat"><span>Correct</span><strong>${t.correct}</strong></div><div class="stat"><span>Incorrect</span><strong>${t.incorrect}</strong></div><div class="stat"><span>Score · graded answers</span><strong>${t.total?t.percent+'%':'—'}</strong></div></div>`}
function sourceMarkup(q){return `<div class="source"><strong>Source:</strong> ${esc(ref(q))}. Page numbers count from the PDF’s first page. References also cover distinctions used in feedback.</div>`}
function renderHome(){
  const pending=session&&session.stage!=='done';
  app.innerHTML=`<section class="intro"><p class="tag">200 questions · Two sets · Two chapters</p><h1>Practice with the chapters.<br>Learn from every answer.</h1><p class="muted">Two independent sets of 100 questions, written separately from the same two chapters. <strong>No question is repeated between them.</strong> Finish a set, then take the other for fresh practice.</p></section>
  ${session?`<div class="notice"><strong>${esc(label())}</strong> · ${session.answers.length}/${session.queue.length} graded <button data-action="resume" style="margin-left:12px">${pending?'Resume practice':'View last result'}</button></div>`:''}
  <h2 class="set-head">Set A <span>100 questions</span></h2><div class="modes"><button class="mode" data-action="start" data-mode="A1"><strong>Chapter 1</strong><span>Research foundations and the scientific method</span><span>50 questions · 25 MCQ / 15 T–F / 10 lists</span><span class="start">Start chapter →</span></button><button class="mode" data-action="start" data-mode="A2"><strong>Chapter 2</strong><span>Planning and designing a research study</span><span>50 questions · 25 MCQ / 15 T–F / 10 lists</span><span class="start">Start chapter →</span></button><button class="mode" data-action="start" data-mode="Aboth"><strong>Both chapters</strong><span>Set A mixed in a new random order</span><span>100 questions · 50 MCQ / 30 T–F / 20 lists</span><span class="start">Start mixed practice →</span></button></div><h2 class="set-head">Set B <span>100 different questions</span></h2><p class="muted set-note">A second, completely separate bank covering the same two chapters. Use it after Set A, or to re-test yourself without recognising answers.</p><div class="modes"><button class="mode" data-action="start" data-mode="B1"><strong>Chapter 1</strong><span>Research foundations and the scientific method</span><span>50 questions · 30 MCQ / 12 T–F / 8 lists</span><span class="start">Start chapter →</span></button><button class="mode" data-action="start" data-mode="B2"><strong>Chapter 2</strong><span>Planning and designing a research study</span><span>50 questions · 30 MCQ / 12 T–F / 8 lists</span><span class="start">Start chapter →</span></button><button class="mode" data-action="start" data-mode="Bboth"><strong>Both chapters</strong><span>Set B mixed in a new random order</span><span>100 questions · 60 MCQ / 24 T–F / 16 lists</span><span class="start">Start mixed practice →</span></button></div><h2 class="set-head">Everything <span>full exam simulation</span></h2><div class="modes"><button class="mode" data-action="start" data-mode="all"><strong>All 200 questions</strong><span>Both sets, both chapters, fully shuffled</span><span>200 questions · 110 MCQ / 54 T–F / 36 lists</span><span class="start">Start full practice →</span></button></div>
  <section class="card"><h2>How scoring works</h2><p>MCQ and True/False answers are marked immediately. For short lists, type your items first. The checker <strong>ignores capitalization and punctuation, tolerates minor spelling mistakes, and recognizes common equivalent wording</strong>. It suggests matching items for you to confirm. You can adjust the matches to accept valid paraphrases it missed; an unrecognized phrase is not automatically marked wrong.</p><p>Each question is worth one point. A list earns its point when all requested items are present; partial recall is shown but does not earn a full question point. Count each distinct item once. Explanations stay hidden until you submit.</p><p class="small">Questions and MCQ choices shuffle for every new attempt. Retry missed questions at the end. Sharing this HTML file shares the simulator, not the progress saved in your browser.</p>
  <details><summary>Sources and scope</summary><p>Only <strong>Chapter 1.pdf</strong> (31 pages) and <strong>Chapter 2_.pdf</strong> (33 pages), supplied for this course, were used. Explanations follow the chapters’ definitions and examples, including their image-based slides. Questions do not require outside reading.</p><p>The bank uses MCQs, True/False statements and short lists only. It is intended for medium-to-hard practice through distinctions, conditions and applications of the stated material. Page references appear after submission.</p></details></section>
  ${history.length?`<section class="history"><h2>Recent completed attempts</h2><ul>${history.slice().reverse().map(h=>`<li>${esc(h.label)} — ${h.correct}/${h.total} (${h.percent}%)${h.lists?' · includes self-assessed lists':''}</li>`).join('')}</ul></section>`:''}`;
}
function start(mode,ids=null){
  if(!ids&&session&&session.stage!=='done'&&!confirm('Start a new attempt? This replaces the current unfinished attempt.'))return;
  const qs=ids||BANK.filter(q=>{if(mode==='all')return true;const s=String(mode)[0],r=String(mode).slice(1);return q.set===s&&(r==='both'||q.chapter===Number(r));}).map(q=>q.id);
  const baseLabel=mode==='all'?'All 200 questions':`Set ${String(mode)[0]} · ${String(mode).slice(1)==='both'?'Both chapters':'Chapter '+String(mode).slice(1)}`;
  session={mode,baseLabel,retry:!!ids,queue:prepareQueue(qs),index:0,answers:[],stage:'question',choice:null,draft:[],checks:[],started:new Date().toISOString(),savedResult:false};
  home=false;save();render(true);
}
function renderQuestion(){
  const q=current(),row=session.queue[session.index],locked=session.stage!=='question';
  const type=q.type==='mcq'?'Multiple choice':q.type==='tf'?'True / False':`Short list · ${q.required} items`;
  let input='';
  if(q.type==='list'){
    input=`<p class="small" id="list-help">One short item per field, in any order. Capitalization and punctuation do not matter; minor spelling mistakes are tolerated. After submitting, review the suggested matches and confirm your score.</p><div class="listing">${Array.from({length:q.required},(_,i)=>`<label><span>${i+1}.</span><input aria-label="List item ${i+1}" aria-describedby="list-help" data-item="${i}" value="${esc(session.draft[i]||'')}" autocomplete="off" ${locked?'disabled':''}></label>`).join('')}</div>`;
  }else{
    const choices=q.type==='mcq'?row.options.map((n,i)=>({value:n,text:q.choices[n].text,letter:letters[i]})):[{value:true,text:'True'},{value:false,text:'False'}];
    input=choices.map(o=>`<label class="option"><input type="radio" name="answer" value="${o.value}" ${session.choice===o.value?'checked':''} ${locked?'disabled':''}>${o.letter?`<span class="letter">${o.letter}.</span>`:''}<span>${esc(o.text)}</span></label>`).join('');
  }
  app.innerHTML=`<div class="toolbar"><strong>${esc(label())}</strong><button data-action="home">Save &amp; home</button></div>
  ${statsMarkup(session.answers)}<p class="small">${session.answers.length} of ${session.queue.length} graded${session.stage==='compare'?' · This list is awaiting your assessment.':''}</p>
  <progress aria-label="Graded questions" value="${session.answers.length}" max="${session.queue.length}"></progress>
  <section class="card"><div class="question-meta"><span class="pill">Question ${session.index+1} / ${session.queue.length}</span><span class="pill">Chapter ${q.chapter}</span><span class="pill">${type}</span></div>
  <form id="answer-form"><fieldset><legend>${esc(q.prompt)}</legend>${input}</fieldset><p id="error" class="error" role="alert"></p>
  ${!locked?`<div class="actions"><button class="primary" type="submit">${q.type==='list'?'Submit list':'Submit answer'}</button><button type="button" data-action="unknown">I don’t know</button></div>`:''}</form>
  <div id="response" aria-live="polite">${session.stage==='compare'?compareMarkup(q):session.stage==='feedback'?feedbackMarkup(q,session.answers[session.index]):''}</div></section>`;
  const form=document.getElementById('answer-form');form.addEventListener('submit',e=>{e.preventDefault();submit(false)});
  app.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',()=>{session.choice=q.type==='tf'?el.value==='true':Number(el.value);save()}));
  app.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('input',()=>{session.draft[Number(el.dataset.item)]=el.value;save()}));
  bindChecks();
}
function compareMarkup(q){return `<section class="compare"><h2>Compare your list with the chapter</h2><p class="notice">${session.checks.length>=q.required?"All required items have suggested matches. Review them below.":`${session.checks.length} of ${q.required} required items recognized. Check any unmatched wording before grading.`}</p><p>Your submitted answer is locked above. Matching items are ticked for you, ignoring case and allowing minor typos. <strong>Review and adjust the suggestions</strong>: tick valid equivalents the checker missed, and untick anything you omitted or contradicted. Each distinct item counts once.</p><p class="small">${q.required<q.items.length?`Any ${q.required} of these ${q.items.length} items are sufficient. Select no more than ${q.required}.`:`All ${q.required} items are required.`} This is assisted self-assessment. Unmatched wording needs your review; it is not automatically wrong.</p>
  ${q.items.map((s,i)=>`<label class="check-item"><input type="checkbox" data-check="${i}" ${session.checks.includes(i)?'checked':''}><span>${esc(s)}</span></label>`).join('')}
  <p>${esc(q.explanation)}</p>${sourceMarkup(q)}<p id="match-count" class="small">${session.checks.length} / ${q.required} required items marked present</p><p class="error" id="compare-error" role="alert"></p>
  <div class="actions"><button class="primary" data-action="grade-list">Confirm list score</button></div></section>`}
function bindChecks(){app.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>{const i=Number(el.dataset.check);session.checks=el.checked?[...session.checks,i]:session.checks.filter(n=>n!==i);save();document.getElementById('match-count').textContent=`${session.checks.length} / ${current().required} required items marked present`}))}
function submit(unknown){
  if(session.stage!=='question')return;
  const q=current();
  if(!unknown){if(q.type==='list'&&Array.from({length:q.required},(_,i)=>session.draft[i]?.trim()).some(v=>!v)){document.getElementById('error').textContent='Fill each requested item, or use “I don’t know” to reveal the answer and record this question as incorrect.';return}
    if(q.type!=='list'&&session.choice===null){document.getElementById('error').textContent='Choose an answer before submitting.';return}}
  if(q.type==='list'&&!unknown){session.stage='compare';session.checks=suggestListMatches(q,session.draft);save();render(false);document.querySelector('.compare').scrollIntoView({block:'start'});return}
  record({id:q.id,correct:!unknown&&session.choice===q.answer,picked:session.choice,typed:[...session.draft],checks:[],skipped:unknown,selfAssessed:false});
}
function gradeList(){
  if(session.stage!=='compare')return;
  const q=current();if(session.checks.length>q.required){document.getElementById('compare-error').textContent=`Select at most ${q.required} distinct items that were in your answer.`;return}
  record({id:q.id,correct:session.checks.length===q.required,picked:null,typed:[...session.draft],checks:[...session.checks],skipped:false,selfAssessed:true});
}
function record(a){session.answers.push(a);session.stage='feedback';save();render(false);document.querySelector('.feedback').scrollIntoView({block:'nearest'})}
function answerText(q,a){if(a.skipped)return 'I don’t know';if(q.type==='mcq')return q.choices[a.picked]?.text||'';if(q.type==='tf')return a.picked?'True':'False';return a.typed.join(' / ')}
function feedbackMarkup(q,a,review=false){
  const verdict=a.correct?'correct':'incorrect';
  let body=`<p><strong>Your answer:</strong> ${esc(answerText(q,a))}</p>`;
  if(q.type==='mcq'){
    if(!a.correct&&!a.skipped)body+=`<p><strong>Why this choice is incorrect:</strong> ${esc(q.choices[a.picked].why)}</p>`;
    body+=`<p><strong>Correct answer:</strong> ${esc(q.choices[q.answer].text)}</p>`;
  }else if(q.type==='tf')body+=`<p><strong>Correct answer:</strong> ${q.answer?'True':'False'}</p>`;
  else body+=`<p><strong>${q.required<q.items.length?`Accepted answers — any ${q.required}`:'Correct items'}:</strong></p><ul class="answer-list">${q.items.map((s,i)=>`<li>${esc(s)}${a.selfAssessed?` <span class="small">(${a.checks.includes(i)?'marked present':'not marked'})</span>`:''}</li>`).join('')}</ul><p class="small">${a.selfAssessed?`${a.checks.length}/${q.required} required items marked present. Self-assessed.`:'Not attempted; recorded as incorrect.'} ${!a.correct?'Full credit requires all requested distinct items.':''}</p>`;
  body+=`<p><strong>Chapter explanation:</strong> ${esc(q.explanation)}</p><p class="small"><strong>Topic:</strong> ${esc(q.topic)}</p>${sourceMarkup(q)}`;
  if(!review)body+=`<div class="actions">${q.type==='list'&&a.selfAssessed?'<button data-action="reassess">Adjust list assessment</button>':''}<button class="primary" data-action="next">${session.index+1===session.queue.length?'See results':'Next question →'}</button></div>`;
  return `<section class="feedback ${verdict}"><h3 class="verdict ${verdict}">${a.correct?'✓ Correct':'✕ Incorrect'}${a.selfAssessed?' · self-assessed':''}</h3>${body}</section>`;
}
function next(){if(session.stage!=='feedback')return;session.index++;session.choice=null;session.draft=[];session.checks=[];
  if(session.index===session.queue.length){session.stage='done';archiveResult()}else session.stage='question';save();render(true)}
function archiveResult(){if(session.savedResult)return;const t=stats(session.answers);history.push({label:label(),...t,lists:session.answers.some(a=>a.selfAssessed),date:new Date().toISOString()});history=history.slice(-8);session.savedResult=true}
function chapterSummary(c){const aa=session.answers.filter(a=>byId.get(a.id).chapter===c);if(!aa.length)return '';const t=stats(aa);return `<div class="card"><h3>Chapter ${c}${session.retry?' · retry':''}</h3><div class="score-big">${t.percent}%</div><p>${t.correct} correct / ${t.total}<br>${t.incorrect} incorrect / ${t.total}</p><span class="small">${aa.filter(a=>a.selfAssessed).length} self-assessed list questions</span></div>`}
function renderResults(){
  const t=stats(session.answers),missed=session.answers.filter(a=>!a.correct),topics=new Map();
  missed.forEach(a=>{const q=byId.get(a.id),k=`Chapter ${q.chapter} · ${q.topic}`;topics.set(k,(topics.get(k)||0)+1)});
  app.innerHTML=`<section class="intro"><p class="tag">${session.retry?'Retry complete':'Practice complete'}</p><h1>${esc(label())}</h1><p><strong>${t.correct} / ${t.total} correct · ${t.incorrect} / ${t.total} incorrect · ${t.percent}%</strong></p><p class="small">One point per question. Listing scores include your self-assessment.${session.retry?' This retry is a separate attempt; earlier completed scores remain on the home screen.':''}</p></section>
  <div class="summary-grid">${chapterSummary(1)}${chapterSummary(2)}</div>
  <div class="actions"><button class="primary" data-action="retry" ${missed.length?'':'disabled'}>Retry ${missed.length} missed question${missed.length===1?'':'s'}</button><button data-action="home">Home</button></div>
  <section class="card" style="margin-top:26px"><h2>Topics to revisit</h2>${topics.size?`<table><thead><tr><th>Topic</th><th>Missed</th></tr></thead><tbody>${[...topics].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table>`:'<p>No missed questions in this attempt.</p>'}</section>
  <section class="card"><h2>Review missed questions</h2>${missed.length?missed.map(a=>{const q=byId.get(a.id);return `<details><summary>${esc(q.id)} · ${esc(q.prompt)}</summary>${feedbackMarkup(q,a,true)}</details>`}).join(''):'<p>You answered every question correctly.</p>'}</section>`;
}
function render(top=false){if(home||!session)renderHome();else if(session.stage==='done')renderResults();else renderQuestion();storageStatus();if(top)window.scrollTo(0,0)}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){
case 'start':start(b.dataset.mode);break;
case 'home':home=true;save();render(true);break;
case 'resume':home=false;render(true);break;
case 'unknown':submit(true);break;
case 'grade-list':gradeList();break;
case 'next':next();break;
case 'reassess':{if(session.stage!=='feedback')break;const a=session.answers.pop();session.stage='compare';session.checks=[...a.checks];save();render(false);break}
case 'retry':start(session.mode,session.answers.filter(a=>!a.correct).map(a=>a.id));break;
}});
storageStatus();render();
</script>
