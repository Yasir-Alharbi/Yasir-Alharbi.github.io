<script id="question-bank" type="application/json">[{"chapter": 1, "type": "mcq", "topic": "Meaning of research", "pages": [4], "prompt": "Which account best captures the chapter’s description of research as a complete process?", "choices": [{"text": "Define a problem, formulate a hypothesis, evaluate data, and test the resulting conclusions.", "why": ""}, {"text": "Define a problem, gather data, and treat the first conclusion as the final result.", "why": "The chapter includes carefully testing conclusions after reaching them."}, {"text": "Formulate a hypothesis, reach a conclusion, and collect only data that fit it.", "why": "The chapter requires collecting, organizing and evaluating data before drawing and testing conclusions."}, {"text": "Gather information, organize it, and omit checking it against the proposed explanation.", "why": "The chapter explicitly includes checking whether conclusions fit the formulated hypothesis."}], "answer": 0, "explanation": "Research includes defining and redefining problems, formulating hypotheses, collecting and evaluating data, making deductions, and carefully testing conclusions.", "id": "C1-01", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Correlation and causation", "pages": [8, 28], "prompt": "A correlational study finds a strong relationship between age and weight. Which conclusion is supported by the chapter?", "choices": [{"text": "One variable may help predict the other, but the relationship alone does not establish causation.", "why": ""}, {"text": "Age must cause changes in weight because the relationship is strong.", "why": "The chapter explicitly prohibits inferring causation from a strong correlational finding."}, {"text": "Weight must cause changes in age because either variable can be used for prediction.", "why": "Prediction from a relationship does not establish a causal direction."}, {"text": "Neither variable can help predict the other unless an experiment has been conducted.", "why": "The chapter says a sufficiently strong correlation allows prediction about one variable from the other."}], "answer": 0, "explanation": "A sufficiently strong correlation can support prediction. Chapter 1 separately states that even a strong correlational result cannot establish that one variable caused the other.", "id": "C1-02", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Types of correlation", "pages": [9], "prompt": "Across observations, SAT scores decrease and GPAs also decrease. How does the chapter classify this pattern?", "choices": [{"text": "Positive correlation", "why": ""}, {"text": "Negative correlation", "why": "Negative correlation means the variables change in opposite directions."}, {"text": "Inverse correlation", "why": "Inverse is another name for negative correlation, which requires opposite directions."}, {"text": "No correlation because both values decrease", "why": "The chapter defines positive correlation as both variables increasing OR both decreasing."}], "answer": 0, "explanation": "Positive correlation concerns the same direction of change, not whether the values are increasing. Both decreasing fits the definition.", "id": "C1-03", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Experimental research", "pages": [10], "prompt": "In the headache-medication example, why are the two groups treated exactly the same apart from the medication they receive?", "choices": [{"text": "To isolate the effects of the medications", "why": ""}, {"text": "To make the study a description of existing conditions", "why": "The example tests a hypothesis about causation; descriptive research has a different purpose."}, {"text": "To avoid comparing the groups on the outcome", "why": "The experiment explicitly compares the two groups on headaches."}, {"text": "To ensure that both groups receive the new medication", "why": "Only the experimental group receives the new medication; the control group receives a placebo."}], "answer": 0, "explanation": "The chapter explicitly says that equal treatment apart from the medications allows the researcher to isolate their effects.", "id": "C1-04", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Experimental research", "pages": [10], "prompt": "Which arrangement reproduces the chapter’s headache-medication experiment?", "choices": [{"text": "Randomly divide participants; give the new medication to one group and a placebo to the other.", "why": ""}, {"text": "Give every participant the new medication; compare no separate group.", "why": "The example uses two groups, including a placebo control group."}, {"text": "Randomly divide participants; give both groups the new medication.", "why": "The example distinguishes new medication from placebo."}, {"text": "Give one group a placebo and change its other treatment conditions as well.", "why": "The groups are treated exactly the same apart from receiving different medications."}], "answer": 0, "explanation": "The example specifies random division into experimental and control groups, new medication versus placebo, and otherwise equal treatment.", "id": "C1-05", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Descriptive and analytical research", "pages": [10, 11, 14], "prompt": "A researcher reports the present state of affairs using a survey, without controlling the variables. Which classification best fits?", "choices": [{"text": "Descriptive research", "why": ""}, {"text": "Analytical research", "why": "The distinguishing description of analytical research is critical evaluation of already available facts or information."}, {"text": "Experimental research", "why": "The described survey does not match the chapter’s comparison of groups to test causation."}, {"text": "Conceptual research", "why": "Conceptual research concerns abstract ideas or theories and developing or reinterpreting concepts."}], "answer": 0, "explanation": "Descriptive research describes the state of affairs as it presently exists. Its researcher has no control over the variables and reports what happened or is happening.", "id": "C1-06", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Descriptive and analytical research", "pages": [10, 11, 14], "prompt": "Which activity most directly matches the chapter’s definition of analytical research?", "choices": [{"text": "Critically evaluating facts or information that are already available", "why": ""}, {"text": "Reporting the current state of affairs through a fact-finding survey", "why": "That matches the stated purpose of descriptive research."}, {"text": "Reinterpreting an abstract concept without evaluating available facts", "why": "Reinterpreting concepts matches conceptual research."}, {"text": "Comparing a new medication with a placebo under otherwise equal conditions", "why": "That is the chapter’s experimental example."}], "answer": 0, "explanation": "Analytical research uses already available facts or information and analyzes them to make a critical evaluation.", "id": "C1-07", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Applied and fundamental research", "pages": [12], "prompt": "Two studies concern human behaviour. Study X seeks an immediate solution to a business problem; Study Y seeks generalizations about human behaviour. Which pairing fits the chapter?", "choices": [{"text": "X: applied; Y: fundamental", "why": ""}, {"text": "X: fundamental; Y: applied", "why": "This reverses immediate problem-solving and the pursuit of generalizations."}, {"text": "X: fundamental; Y: fundamental", "why": "An immediate concrete business solution is the chapter’s example of applied research."}, {"text": "X: applied; Y: applied", "why": "Research aimed at generalizations about human behaviour is explicitly an example of fundamental research."}], "answer": 0, "explanation": "Applied research addresses an immediate practical problem. Fundamental research is concerned with generalizations, theory, and knowledge for its own sake.", "id": "C1-08", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Applied and fundamental research", "pages": [12], "prompt": "Which purpose makes a study of human behaviour fundamental research in the chapter’s example?", "choices": [{"text": "Developing generalizations about human behaviour", "why": ""}, {"text": "Resolving an immediate problem in a particular business", "why": "That is the chapter’s description of applied research."}, {"text": "Finding a solution to a concrete social problem", "why": "A concrete problem requiring a solution is the chapter’s applied-research example."}, {"text": "Solving an immediate difficulty faced by an industrial organization", "why": "Immediate industrial or business problem-solving falls under applied research."}], "answer": 0, "explanation": "The chapter classifies human-behaviour studies as fundamental when their purpose is to make generalizations about human behaviour.", "id": "C1-09", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Quantitative and qualitative research", "pages": [13], "prompt": "Which combination identifies quantitative research as described in the chapter?", "choices": [{"text": "Formal, systematic measurement and statistical analysis", "why": ""}, {"text": "Interviews and observations without formal measurement", "why": "These are typical features assigned to qualitative research."}, {"text": "An in-depth examination of one person without statistical summary", "why": "The chapter gives an in-depth case study of one person as a qualitative form."}, {"text": "Findings that are not quantified through statistical analysis", "why": "This is part of the chapter’s description of qualitative research."}], "answer": 0, "explanation": "Quantitative research uses statistical analyses to obtain findings, with formal and systematic measurement as a key feature.", "id": "C1-10", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Quantitative and qualitative research", "pages": [13], "prompt": "How can qualitative and quantitative research relate to each other according to the chapter?", "choices": [{"text": "Qualitative research can supply hypotheses for later quantitative testing.", "why": ""}, {"text": "Quantitative testing must occur before any qualitative hypothesis can be proposed.", "why": "The chapter explicitly gives qualitative research as a source for later quantitative testing."}, {"text": "Qualitative findings establish hypotheses that never need later testing.", "why": "The chapter describes hypotheses from qualitative research being tested later."}, {"text": "Qualitative research is defined by statistical testing of quantitative findings.", "why": "Qualitative research is described as not quantifying results through statistical summary or analysis."}], "answer": 0, "explanation": "The chapter notes that qualitative research is often a source of hypotheses for later testing in quantitative research.", "id": "C1-11", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Conceptual and empirical research", "pages": [8, 10, 14], "prompt": "A thinker reinterprets an existing abstract idea. Which approach most directly fits this activity?", "choices": [{"text": "Conceptual research", "why": ""}, {"text": "Empirical research", "why": "Empirical research is defined through direct observation and experimentation."}, {"text": "Experimental research", "why": "The activity does not describe comparing groups to test causation."}, {"text": "Correlational research", "why": "The activity does not describe determining a relationship between variables."}], "answer": 0, "explanation": "Conceptual research concerns abstract ideas or theory and is used to develop new concepts or reinterpret existing ones.", "id": "C1-12", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Methods and methodology", "pages": [17, 22, 29], "prompt": "A student explains both the steps used to study a research problem and the logic for choosing those steps. Which term best describes this account?", "choices": [{"text": "Research methodology", "why": ""}, {"text": "Research methods alone", "why": "Methods refer to the techniques used in research operations; methodology also addresses the steps and their logic."}, {"text": "Replication", "why": "Replication repeats a study with another group of participants."}, {"text": "A null hypothesis", "why": "A null hypothesis predicts no differences between the studied groups."}], "answer": 0, "explanation": "Methodology is the systematic approach to solving the research problem, including the steps adopted and the logic behind them.", "id": "C1-13", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Empirical approach", "pages": [19], "prompt": "Which basis for a scientific decision matches the chapter’s empirical approach?", "choices": [{"text": "Data derived from direct observation and experimentation", "why": ""}, {"text": "An abstract idea used without observational or experimental data", "why": "An abstract idea alone does not meet the chapter’s evidence-based definition of the empirical approach."}, {"text": "A prediction treated as a conclusion before collecting data", "why": "The empirical approach bases decisions on data, not on an untested prediction."}, {"text": "A conclusion retained regardless of observational evidence", "why": "Scientific decisions are to be based on observational and experimental data."}], "answer": 0, "explanation": "The chapter defines the empirical approach as evidence-based and says scientific decisions use data from direct observation and experimentation.", "id": "C1-14", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Observation", "pages": [14, 20, 22, 27], "prompt": "Which pair captures the two meanings of observation distinguished in the chapter?", "choices": [{"text": "Awareness of the surrounding world; careful measurement", "why": ""}, {"text": "Formulating a null hypothesis; rejecting that hypothesis", "why": "These concern hypotheses and analysis, not the two meanings of observation."}, {"text": "Collecting measurements; drawing broad conclusions from one study", "why": "Careful measurement is one meaning, but broad conclusions are not the other."}, {"text": "Developing abstract ideas; reinterpreting existing concepts", "why": "These describe conceptual research, not the chapter’s two meanings of observation."}], "answer": 0, "explanation": "Observation refers both to being aware of the world around us and to making careful measurements.", "id": "C1-15", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Answerable research questions", "pages": [21, 29], "prompt": "A researcher has an interesting idea. According to the chapter, what must happen next before pursuing it as a scientific investigation?", "choices": [{"text": "Translate the idea into an answerable research question.", "why": ""}, {"text": "Draw a conclusion about the idea before stating a question.", "why": "The chapter places formation of an answerable question after the research idea, not a conclusion."}, {"text": "Replicate the study before deciding what it asks.", "why": "Replication concerns repeating a research study; the immediate step here is forming an answerable question."}, {"text": "Keep the question unanswerable so that it remains broad.", "why": "The chapter stresses answerability and describes investigating an unanswerable question as unrewarding."}], "answer": 0, "explanation": "After obtaining a research idea, the stated next step is translating it into an answerable question.", "id": "C1-16", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Null and alternate hypotheses", "pages": [22, 29], "prompt": "A hypothesis predicts that the two groups being studied will differ. Which label does Chapter 1 give this hypothesis?", "choices": [{"text": "Alternate (experimental) hypothesis", "why": ""}, {"text": "Null hypothesis", "why": "The null hypothesis predicts no differences between the groups."}, {"text": "A conclusion already established by the data", "why": "A hypothesis is a testable guess; the prediction alone is not a data-supported conclusion."}, {"text": "Replication of a previous result", "why": "Replication means conducting the study again with another group, not naming a prediction."}], "answer": 0, "explanation": "The alternate or experimental hypothesis predicts a difference between groups; the null predicts no difference.", "id": "C1-17", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Testable predictions", "pages": [23], "prompt": "Why does the chapter’s statement about exercise reducing cholesterol qualify as a hypothesis?", "choices": [{"text": "It predicts an effect that can be tested by gathering and analyzing data.", "why": ""}, {"text": "It reports a conclusion that requires no measurements.", "why": "The chapter explicitly says the prediction can be tested using data."}, {"text": "It avoids predicting anything about the variables.", "why": "Making a prediction is a key feature of every hypothesis in the chapter."}, {"text": "It must remain accepted even if the data refute it.", "why": "The chapter states that data can support or refute a hypothesis."}], "answer": 0, "explanation": "The exercise statement makes a prediction about cholesterol levels, which can be tested through data collection and analysis.", "id": "C1-18", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Conducting experiments", "pages": [24, 25, 26], "prompt": "In the exercise-and-cholesterol study, which procedure matches the chapter’s description of conducting the study?", "choices": [{"text": "Measure cholesterol accurately and reliably, then compare the two groups.", "why": ""}, {"text": "Compare the groups without measuring the phenomenon of interest.", "why": "The chapter emphasizes accurate and reliable measurement of cholesterol."}, {"text": "Replace measurement with the original prediction about exercise.", "why": "A prediction does not replace collecting data on participants’ cholesterol levels."}, {"text": "Use consistent measurements even when they are known to be incorrect.", "why": "The chapter requires measurement that is both accurate and reliable."}], "answer": 0, "explanation": "The researcher collects cholesterol data using an accurate and reliable device and then compares the two groups.", "id": "C1-19", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Accuracy and reliability", "pages": [25, 26], "prompt": "A dart thrower repeatedly hits the same spot, but that spot is away from the bull’s eye. Which interpretation matches the chapter?", "choices": [{"text": "High reliability and low accuracy", "why": ""}, {"text": "High accuracy and low reliability", "why": "Hitting away from the bull’s eye indicates low accuracy; the repeated same spot indicates high reliability."}, {"text": "High accuracy and high reliability", "why": "Consistency establishes reliability, but being off target prevents high accuracy."}, {"text": "Low accuracy and low reliability", "why": "The repeated same spot demonstrates reliability despite low accuracy."}], "answer": 0, "explanation": "Reliability concerns consistency; accuracy concerns correctness. The chapter uses this exact distinction in the dart example.", "id": "C1-20", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Accuracy and reliability", "pages": [25, 26], "prompt": "Which observation demonstrates both accuracy and reliability in the chapter’s dart analogy?", "choices": [{"text": "The darts consistently hit the bull’s eye.", "why": ""}, {"text": "The darts consistently hit one spot away from the bull’s eye.", "why": "A consistent off-target spot demonstrates reliability but low accuracy."}, {"text": "The darts hit the bull’s eye once and then scatter elsewhere.", "why": "One correct hit does not show the consistent bull’s-eye hits required by the chapter’s combined description."}, {"text": "The darts scatter across several spots away from the bull’s eye.", "why": "This shows neither consistently hitting the same spot nor hitting the bull’s eye."}], "answer": 0, "explanation": "The chapter describes an accurate and reliable thrower as consistently throwing darts into the bull’s eye.", "id": "C1-21", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Data analysis", "pages": [6, 27], "prompt": "Which combination does the chapter say determines the statistical techniques a researcher uses?", "choices": [{"text": "Study design, type of data, and research questions", "why": ""}, {"text": "Researcher’s respectability, degree, and intellectual enjoyment", "why": "These resemble motivations for research, not the stated determinants of statistical techniques."}, {"text": "The preferred conclusion, regardless of design or data", "why": "The chapter names design, data type and questions; a preferred conclusion is not the basis."}, {"text": "Whether the study is repeated, regardless of data or questions", "why": "Replication does not replace the three stated determinants of statistical techniques."}], "answer": 0, "explanation": "The chapter lists study design, the type of data gathered, and the questions asked as the factors determining statistical techniques.", "id": "C1-22", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Data analysis", "pages": [27, 28, 29], "prompt": "Which decision is explicitly identified as a key use of statistics before drawing conclusions?", "choices": [{"text": "Whether the null hypothesis should be rejected", "why": ""}, {"text": "Whether to replace the collected data with the original prediction", "why": "The chapter analyzes collected data; it does not replace them with a prediction."}, {"text": "Whether a correlational finding automatically proves causation", "why": "The chapter explicitly says a correlational finding cannot justify that causal conclusion."}, {"text": "Whether replication can be omitted because one study is sufficient", "why": "The chapter cautions against broad conclusions from one study and stresses replication."}], "answer": 0, "explanation": "A key statistical decision is whether to reject the null hypothesis. Conclusions follow analysis and this decision.", "id": "C1-23", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Replication", "pages": [29], "prompt": "Which activity meets the chapter’s definition of replication?", "choices": [{"text": "Conducting the same study again with another group to check whether the results recur", "why": ""}, {"text": "Rewriting the original conclusions without conducting another study", "why": "Replication requires conducting the study once again."}, {"text": "Reanalyzing only the original participants’ data without a new group", "why": "The chapter specifies another group of participants."}, {"text": "Changing the research question and treating the new result as a repeat of the old study", "why": "The stated definition requires the same research study, conducted again."}], "answer": 0, "explanation": "Replication repeats the same research study with another group of participants to see whether the same results are obtained.", "id": "C1-24", "set": "A"}, {"chapter": 1, "type": "mcq", "topic": "Significance of research", "pages": [16], "prompt": "Which pairing preserves the chapter’s stated meanings of research for philosophers/thinkers and analysts/intellectuals, respectively?", "choices": [{"text": "An outlet for new ideas and insights; generalizations of new theories", "why": ""}, {"text": "Generalizations of new theories; an outlet for new ideas and insights", "why": "This reverses the chapter’s assignments to these two groups."}, {"text": "A way to attain a high social position; an outlet for new ideas and insights", "why": "The first meaning is assigned to master’s and Ph.D students; the second to philosophers and thinkers."}, {"text": "An outlet for new ideas and insights; a way to attain a high social position", "why": "The first part matches, but the chapter assigns high social position to master’s and Ph.D students, not analysts and intellectuals."}], "answer": 0, "explanation": "For philosophers and thinkers, research may provide an outlet for new ideas and insights. For analysts and intellectuals, it may mean generalizations of new theories.", "id": "C1-25", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Meaning of research", "pages": [4], "prompt": "Research, as described in the chapter, ends when a conclusion is first reached; checking whether it fits the hypothesis is outside the process.", "answer": false, "explanation": "The description explicitly includes carefully testing conclusions to determine whether they fit the formulated hypothesis. Reaching a conclusion is not the last check.", "id": "C1-26", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Types of correlation", "pages": [9], "prompt": "A positive correlation can describe two variables decreasing together.", "answer": true, "explanation": "Positive correlation means both variables change in the same direction, either increasing or decreasing.", "id": "C1-27", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Types of correlation", "pages": [9], "prompt": "If GPAs decrease as SAT scores increase, the chapter classifies the relationship as negative or inverse.", "answer": true, "explanation": "The two variables move in opposite directions, which is the chapter’s definition and example of negative (inverse) correlation.", "id": "C1-28", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Descriptive and analytical research", "pages": [11], "prompt": "The chapter includes comparative and correlational methods among methods used in descriptive research.", "answer": true, "explanation": "The descriptive-research section explicitly includes survey methods of all kinds, including comparative and correlational methods.", "id": "C1-29", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Descriptive and analytical research", "pages": [11], "prompt": "Having no control over the variables prevents a researcher from conducting descriptive research.", "answer": false, "explanation": "The chapter identifies having no control over the variables as the main characteristic of descriptive research; the researcher reports what happened or is happening.", "id": "C1-30", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Applied and fundamental research", "pages": [12], "prompt": "The chapter treats “pure” and “basic” research as terms for gathering knowledge for knowledge’s sake.", "answer": true, "explanation": "These terms appear in the fundamental-research section and refer to gathering knowledge for its own sake.", "id": "C1-31", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Quantitative and qualitative research", "pages": [13], "prompt": "The chapter presents an in-depth examination of one person as a form of qualitative research.", "answer": true, "explanation": "It defines a case study here as an in-depth examination of one person and identifies it as a qualitative form.", "id": "C1-32", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Conceptual and empirical research", "pages": [14], "prompt": "Empirical research acquires knowledge through direct observation and experimentation.", "answer": true, "explanation": "Direct observation and experimentation are the defining sources of evidence in the chapter’s empirical approach.", "id": "C1-33", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Methods and methodology", "pages": [17], "prompt": "Research methodology addresses the steps of studying a problem but excludes the logic behind those steps.", "answer": false, "explanation": "The definition explicitly includes both the steps generally adopted and the logic behind them.", "id": "C1-34", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Testable predictions", "pages": [23], "prompt": "Once a hypothesis makes a prediction, the researcher’s data can support it but cannot refute it.", "answer": false, "explanation": "The chapter says hypotheses can be either supported or refuted on the basis of gathered and analyzed data.", "id": "C1-35", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Accuracy and reliability", "pages": [25, 26], "prompt": "A consistent measurement must also be a correct measurement.", "answer": false, "explanation": "Consistency is reliability; correctness is accuracy. The off-target dart example demonstrates reliability without accuracy.", "id": "C1-36", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Conducting experiments", "pages": [24, 26], "prompt": "The chapter requires both accuracy and reliability when measuring the phenomenon of interest.", "answer": true, "explanation": "The experiment section calls for accurate and reliable measurement, and the measurement discussion says both are equally important.", "id": "C1-37", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Correlation and causation", "pages": [28], "prompt": "A strong relationship found in a correlational study is sufficient to conclude that one variable caused the other.", "answer": false, "explanation": "The chapter explicitly rejects that inference. Conclusions must be supported by the data analyses, and correlation does not establish causation.", "id": "C1-38", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Replication", "pages": [29], "prompt": "A single study is sufficient for broad conclusions because replication concerns only rewriting the report.", "answer": false, "explanation": "Replication repeats the study with another group. The chapter cautions that a single study’s result might be an aberration.", "id": "C1-39", "set": "A"}, {"chapter": 1, "type": "tf", "topic": "Significance of research", "pages": [15], "prompt": "The chapter links research to both scientific and inductive thinking and the development of logical habits of thinking and organization.", "answer": true, "explanation": "These contributions are explicitly listed in the significance-of-research section.", "id": "C1-40", "set": "A"}, {"chapter": 1, "type": "list", "topic": "Objectives of research", "pages": [5], "prompt": "List the TWO objectives of research stated in the chapter.", "items": ["Discover answers to questions through the application of scientific procedures.", "Find out truth that has not yet been discovered."], "required": 2, "explanation": "These are the two stated objectives. Researcher motivations, such as earning a degree, belong to a separate list.", "id": "C1-41", "matchRules": [[["answer questions", "answers to questions", "discover answers", "find answers"], ["scientific procedures", "scientific methods", "scientific method"]], [["undiscovered truth", "new truth", "unknown truth", "truth not yet discovered", "truth not discovered", "discover the truth", "find the truth"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Motivations for research", "pages": [6], "prompt": "List any FOUR distinct motivations for research given in the chapter.", "items": ["Obtain a research degree and its consequential benefits.", "Face the challenge of solving unsolved or practical problems.", "Gain intellectual joy from creative work.", "Serve society.", "Gain respectability."], "required": 4, "explanation": "Any four of these five motivations satisfy the question. Count solving unsolved problems and concern over practical problems as one motivation, as grouped on the slide.", "id": "C1-42", "matchRules": [[["research degree", "degree", "qualification"]], [["solve problems", "solving problems", "unsolved problems", "practical problems", "problem solving"]], [["intellectual joy", "creative work", "intellectual enjoyment", "creativity"]], [["serve society", "serving society", "service to society", "help society"]], [["respectability", "respect", "recognition"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Types of research", "pages": [7], "prompt": "List the FIVE paired comparisons under “Types of Research.” Give each pair as one item.", "items": ["Correlational versus experimental.", "Descriptive versus analytical.", "Applied versus fundamental.", "Quantitative versus qualitative.", "Conceptual versus empirical."], "required": 5, "explanation": "The chapter organizes its research-type overview into these five paired comparisons. Each requested item contains both members of the pair.", "id": "C1-43", "matchRules": [[["correlational", "correlation"], ["experimental", "experiment"]], [["descriptive"], ["analytical"]], [["applied"], ["fundamental", "basic", "pure"]], [["quantitative"], ["qualitative"]], [["conceptual"], ["empirical"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Scientific method", "pages": [18], "prompt": "List any SIX of the eight characteristics of the scientific method shown in the chapter.", "items": ["Empirical approach.", "Observations.", "Questions.", "Hypotheses.", "Experiments.", "Analyses.", "Conclusions.", "Replication."], "required": 6, "explanation": "Any six distinct entries from this eight-item list are sufficient. The slide calls them characteristics, so no ordered sequence is required here.", "id": "C1-44", "matchRules": [[["empirical"]], [["observation"]], [["questions"]], [["hypotheses"]], [["experiments"]], [["analysis"]], [["conclusions"]], [["replication"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Significance of research", "pages": [15], "prompt": "List any THREE of the four general contributions of research stated on the “Significance of Research” slide on PDF page 15.", "items": ["Encourages scientific and inductive thinking and logical habits of thinking and organization.", "Provides a basis for nearly all government policies in the economic system.", "Helps solve operational and planning problems in business and industry.", "Helps social scientists study social relationships and seek answers to social problems."], "required": 3, "explanation": "Any three of these four contributions meet the request. Individual motivations and the stakeholder-specific meanings on the next slide are separate lists.", "id": "C1-45", "matchRules": [[["scientific thinking", "inductive thinking", "logical thinking", "logical habits"]], [["government policies", "government policy", "economic policy"]], [["operational problems", "planning problems"], ["business", "industry", "industrial"]], [["social relationships", "social problems", "social relations"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Observation", "pages": [20], "prompt": "Name the TWO distinct meanings of observation identified in the chapter.", "items": ["Being aware of the world around us.", "Making careful measurements."], "required": 2, "explanation": "The chapter distinguishes awareness that can stimulate research questions from careful measurement in scientific investigation.", "id": "C1-46", "matchRules": [[["awareness of the world", "aware of the world", "awareness of surroundings", "aware of surroundings", "observing the world"]], [["careful measurement", "accurate measurement", "measuring carefully", "careful measurements"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Null and alternate hypotheses", "pages": [22], "prompt": "Name the TWO hypothesis types identified in Chapter 1 and give each prediction in a short phrase.", "items": ["Null hypothesis: no differences between the groups being studied.", "Alternate (experimental) hypothesis: a difference between the groups being studied."], "required": 2, "explanation": "Credit each item only when the hypothesis name is paired with its correct prediction. Chapter 1 states these definitions in terms of groups.", "id": "C1-47", "matchRules": [[["null"], ["no difference", "no differences", "without differences"]], [["alternate", "alternative", "experimental"], ["difference", "differences", "differ"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Data analysis", "pages": [27], "prompt": "List the THREE factors that determine the type of statistical techniques used, according to the chapter.", "items": ["The design of the study.", "The type of data being gathered.", "The questions being asked."], "required": 3, "explanation": "The analysis section explicitly names these three determinants of the statistical techniques used.", "id": "C1-48", "matchRules": [[["study design", "research design", "design of the study", "design"]], [["data type", "type of data", "types of data", "nature of data"]], [["research questions", "questions being asked", "questions asked", "questions"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Replication", "pages": [29], "prompt": "List the TWO purposes of replication stated in the final bullet of the chapter’s replication slide.", "items": ["Establish the reliability of the research study’s findings.", "Determine whether the same results can be obtained with a different group of participants (generalizability)."], "required": 2, "explanation": "These are the two purposes explicitly grouped in the slide’s final bullet. Repeating a study is the procedure, rather than a separate purpose.", "id": "C1-49", "matchRules": [[["reliability", "reliable findings", "reliable results"]], [["generalizability", "generalisability", "generalizable", "generalisable", "same results with different participants", "same results with another group", "results in different groups"]]], "set": "A"}, {"chapter": 1, "type": "list", "topic": "Goals of scientific research", "pages": [30], "prompt": "Name the THREE general goals of scientific research given in the chapter’s “Test Yourself” answer key.", "items": ["Description.", "Prediction.", "Understanding or explaining."], "required": 3, "explanation": "The image-based answer key gives description, prediction, and understanding/explaining. Understanding and explaining form one entry, not two.", "id": "C1-50", "matchRules": [[["description", "describe"]], [["prediction", "predict"]], [["understanding", "explaining", "explanation", "understand", "explain"]]], "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Choosing a research topic", "pages": [4, 5, 6], "prompt": "A researcher studies how employers could reduce employees’ work-related stress to improve productivity and satisfaction. Which source of research ideas does the chapter use this example to illustrate?", "choices": [{"text": "Problem solving", "why": ""}, {"text": "Theory", "why": "The chapter places this example under problem solving, not under theory as a source of hypotheses."}, {"text": "Previous research", "why": "The example is motivated by improving a practical situation; it does not describe a prior study raising a new question."}, {"text": "Field-specific training and experience", "why": "Training and experience explain competence within a field; the example itself illustrates motivation to solve a problem."}], "answer": 0, "explanation": "The problem-solving section gives reducing work-related stress as its example of research prompted by a situation needing improvement.", "id": "C2-01", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Choosing a research topic", "pages": [6], "prompt": "Which statement best explains the chapter’s phrase “research begets research”?", "choices": [{"text": "Research raises new questions that can become the focus of later studies.", "why": ""}, {"text": "Research eliminates the need for later questions once a result is obtained.", "why": "The phrase is explained through new questions becoming future research."}, {"text": "Research topics must be chosen without considering previous findings.", "why": "The chapter identifies previous research as a rich source of ideas."}, {"text": "Research makes theories unnecessary as sources of hypotheses.", "why": "The same slide explicitly identifies theories as a rich source of hypotheses."}], "answer": 0, "explanation": "Research tends to raise more questions than it answers; those new questions often motivate future studies.", "id": "C2-02", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Literature review", "pages": [7, 8], "prompt": "A researcher repeats a study deliberately to assess whether its findings hold more generally. Which distinction in the chapter is relevant?", "choices": [{"text": "Purposeful replication differs from unknowingly duplicating an existing study.", "why": ""}, {"text": "Any repeated study is necessarily an uninformed duplication.", "why": "The chapter explicitly distinguishes replication for robustness or generalizability from unaware duplication."}, {"text": "A literature review removes every reason to repeat a study.", "why": "The chapter recognizes deliberate replication as serving robustness or generalizability."}, {"text": "Unaware duplication and purposeful replication have the same stated purpose.", "why": "The distinction is precisely between a deliberate checking purpose and lack of knowledge of the earlier study."}], "answer": 0, "explanation": "The chapter distinguishes replication to establish robustness or generalizability from simply duplicating a study without knowing it has already been conducted.", "id": "C2-03", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Literature review", "pages": [8], "prompt": "A review establishes that previous work exists, examines what its results suggest, checks whether the research question is answered, and locates areas needing more study. Which additional review question from the chapter is still unaddressed?", "choices": [{"text": "Did earlier researchers encounter unforeseen methodological difficulties?", "why": ""}, {"text": "Have any other researchers worked in this topic area?", "why": "The review has already established that previous work exists."}, {"text": "What do the earlier studies’ results suggest?", "why": "The prompt states that the review has already examined what the results suggest."}, {"text": "In which specific areas is further research needed?", "why": "The review has already located areas needing more study."}], "answer": 0, "explanation": "The slide includes a separate question about unforeseen methodological difficulties that future researchers should know about when planning or conducting studies.", "id": "C2-04", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Formulating a research problem", "pages": [10], "prompt": "A proposed research question describes a relationship between two variables but cannot be tested empirically. What is its status under the chapter’s three criteria?", "choices": [{"text": "It fails the empirical-testability criterion despite satisfying the other two.", "why": ""}, {"text": "It satisfies all three criteria because it is written as a question.", "why": "Question form is only one criterion; empirical testability is another."}, {"text": "It fails because good problems must avoid relationships between variables.", "why": "The chapter explicitly requires a relationship between two or more variables."}, {"text": "It satisfies all three because naming two variables replaces empirical testing.", "why": "Describing variables does not satisfy the separate requirement that the problem be empirically testable."}], "answer": 0, "explanation": "The three requirements are a relationship between at least two variables, question form, and empirical testability. All three matter.", "id": "C2-05", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Conceptual and empirical literature", "pages": [10], "prompt": "A researcher reviews theories about a problem and earlier studies similar to the proposed study. How does the chapter classify these two bodies of literature?", "choices": [{"text": "Theories: conceptual literature; similar earlier studies: empirical literature", "why": ""}, {"text": "Theories: empirical literature; similar earlier studies: conceptual literature", "why": "This reverses the two definitions on the slide."}, {"text": "Both are conceptual literature because both relate to a problem", "why": "The chapter explicitly assigns similar earlier studies to empirical literature."}, {"text": "Both are empirical literature because both already exist", "why": "Conceptual literature concerns concepts and theories; prior existence does not make it empirical."}], "answer": 0, "explanation": "Conceptual literature concerns concepts and theories. Empirical literature consists of earlier studies similar to the proposed one.", "id": "C2-06", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Extensive literature survey", "pages": [11], "prompt": "After formulating a thesis research problem, which action does the chapter explicitly require?", "choices": [{"text": "Write a synopsis of the topic and submit it to a Committee or Research Board for approval.", "why": ""}, {"text": "Skip the synopsis and begin the final report’s conclusion.", "why": "The chapter explicitly requires a synopsis and approval for a thesis researcher."}, {"text": "Submit the bibliography in place of a topic synopsis.", "why": "Bibliographies are literature-survey sources; they do not replace the required synopsis."}, {"text": "Postpone writing any problem summary until after data collection.", "why": "A brief summary is to be written once the problem is formulated."}], "answer": 0, "explanation": "The chapter calls for a brief summary after formulating the problem and states that a thesis researcher must submit a topic synopsis for approval.", "id": "C2-07", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Working hypotheses", "pages": [12], "prompt": "Which account best describes the role of a working hypothesis in the chapter?", "choices": [{"text": "It limits the research area and helps indicate the data and analysis methods needed.", "why": ""}, {"text": "It fixes the final conclusion so the data cannot challenge it.", "why": "A working hypothesis is tentative and must be capable of being refuted."}, {"text": "It removes the need to decide what data to collect.", "why": "The chapter says it indicates the type of data required."}, {"text": "It must cover every possible problem instead of the particular research.", "why": "The chapter requires it to be specific and limited to the research in hand."}], "answer": 0, "explanation": "A working hypothesis guides the researcher by delimiting the area of research and indicating the types of data and analysis methods needed.", "id": "C2-08", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Falsifiability", "pages": [12], "prompt": "A hypothesis is specific to one study and makes a prediction, but it is worded so that no study result could refute it. Which evaluation follows the chapter?", "choices": [{"text": "It fails falsifiability despite being specific and predictive.", "why": ""}, {"text": "It meets the requirements because specificity is sufficient.", "why": "The chapter also requires a prediction and falsifiability; specificity alone is insufficient."}, {"text": "It meets the requirements because making a prediction is sufficient.", "why": "Prediction does not replace the separate requirement that study results could refute the hypothesis."}, {"text": "It fails because hypotheses must be broad rather than limited to one study.", "why": "The chapter actually requires a hypothesis to be specific and limited to the research in hand."}], "answer": 0, "explanation": "The chapter requires hypotheses to be specific and limited, predictive, and falsifiable. Falsifiability means being capable of refutation based on study results.", "id": "C2-09", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Working hypotheses", "pages": [13], "prompt": "Which situation is explicitly identified as one in which working hypotheses may not be needed?", "choices": [{"text": "Exploratory or formulative research that does not aim to test a hypothesis", "why": ""}, {"text": "Every study that uses an empirical approach", "why": "The exception is specifically exploratory or formulative work not aimed at hypothesis testing."}, {"text": "Every study that includes more than one variable", "why": "The chapter commonly describes hypotheses as predictions about relationships between variables."}, {"text": "Any study for which previous literature is available", "why": "The chapter places development of working hypotheses after extensive literature survey; existing literature is not the stated exception."}], "answer": 0, "explanation": "The chapter qualifies its hypothesis discussion by noting that exploratory or formulative research not aimed at testing hypotheses may not need working hypotheses.", "id": "C2-10", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Null and alternate hypotheses", "pages": [14], "prompt": "A study examines relationships among selected variables without comparing participant groups. What does its null hypothesis predict in Chapter 2?", "choices": [{"text": "No relationship between the variables being studied", "why": ""}, {"text": "A relationship between the variables being studied", "why": "That is the alternate prediction for a variable-based study."}, {"text": "A particular direction of relationship between the variables", "why": "The null prediction here is no relationship, not a specified direction."}, {"text": "A difference between groups that the study does not contain", "why": "Chapter 2 explicitly adapts the null definition to variable-only studies as no relationship."}], "answer": 0, "explanation": "For a study examining selected variables rather than groups, the null predicts no relationship; the alternate predicts a relationship.", "id": "C2-11", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Directional and nondirectional hypotheses", "pages": [15], "prompt": "A researcher predicts that two groups will differ but has no belief about how they will differ. Which classification fits?", "choices": [{"text": "Nondirectional hypothesis", "why": ""}, {"text": "Directional hypothesis", "why": "A directional hypothesis specifies how the groups are expected to differ."}, {"text": "Null hypothesis", "why": "The null predicts no difference; this researcher predicts a difference."}, {"text": "A hypothesis that cannot make any prediction", "why": "Predicting a difference is still a prediction, even when its direction is not specified."}], "answer": 0, "explanation": "Nondirectional hypotheses predict a difference without a belief about how the groups will differ.", "id": "C2-12", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Directional and nondirectional hypotheses", "pages": [15], "prompt": "Why does a prediction that one group will do “better” than another count as directional in the chapter?", "choices": [{"text": "It predicts a difference and specifies how the groups will differ.", "why": ""}, {"text": "It predicts that the groups will not differ.", "why": "A directional hypothesis predicts a difference, not no difference."}, {"text": "It predicts a difference while deliberately withholding its direction.", "why": "That describes a nondirectional hypothesis."}, {"text": "It describes a result already confirmed by the study.", "why": "The classification concerns the content of a prediction, not whether data have confirmed it."}], "answer": 0, "explanation": "Comparison terms such as greater, less, better and worse specify how groups are expected to differ, making the hypothesis directional.", "id": "C2-13", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Independent and dependent variables", "pages": [16], "prompt": "In the chapter’s study of a new psychotherapy’s effect on anxiety symptoms, which pairing follows the definitions of independent and dependent variables?", "choices": [{"text": "Independent: exposure to psychotherapy; dependent: the measure of anxiety symptoms", "why": ""}, {"text": "Independent: the measure of anxiety symptoms; dependent: exposure to psychotherapy", "why": "This reverses the manipulated factor and the measured effect."}, {"text": "Independent: both exposure and symptoms; dependent: neither", "why": "The effect measure is the dependent variable, not another manipulated factor."}, {"text": "Independent: neither; dependent: both exposure and symptoms", "why": "Exposure is manipulated or controlled and therefore serves as the independent variable."}], "answer": 0, "explanation": "The independent variable is the manipulated or controlled factor. The dependent variable measures its effect, if any; here, anxiety symptoms are the outcome being examined.", "id": "C2-14", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Variables and constants", "pages": [16, 17], "prompt": "A feature cannot vary or take different values. Which term does the chapter assign to it?", "choices": [{"text": "Constant", "why": ""}, {"text": "Variable", "why": "A variable is defined as something that can take different values."}, {"text": "Continuous variable", "why": "A continuous variable can take values along a continuum; it is not fixed."}, {"text": "Categorical variable", "why": "A categorical variable still can take specific values within a defined range; the feature in the prompt cannot vary."}], "answer": 0, "explanation": "The chapter contrasts a variable, which can take different values, with a constant, which cannot.", "id": "C2-15", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Categorical and continuous variables", "pages": [17], "prompt": "Which statement follows the chapter’s comparison of categorical and continuous variables?", "choices": [{"text": "Continuous variables can take values along a continuum, and variable type partly affects the statistical tests chosen.", "why": ""}, {"text": "Categorical variables can take any value along a continuum, while continuous variables have only fixed categories.", "why": "This reverses the chapter’s descriptions."}, {"text": "Variable type has no role in choosing statistical tests.", "why": "The chapter explicitly says test choice is partially dependent on categorical versus continuous variables."}, {"text": "Continuous variables are described as less precisely measurable than categorical variables.", "why": "The chapter states the opposite: continuous variables can be measured with greater precision."}], "answer": 0, "explanation": "Continuous variables theoretically take any value along a continuum. The chapter also states that the categorical/continuous distinction partly determines statistical test choice.", "id": "C2-16", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Classifying research designs", "pages": [18, 21], "prompt": "Using the chapter’s classification rule, a design randomly assigns participants to different conditions. How should it be classified?", "choices": [{"text": "True experimental", "why": ""}, {"text": "Quasi-experimental", "why": "In the chapter’s decision rule, quasi-experimental designs occur on the no-random-assignment branch."}, {"text": "Nonexperimental", "why": "The chapter assigns designs with random assignment to the true experimental category."}, {"text": "Unclassifiable until random selection is confirmed", "why": "The stated classification rule asks about random assignment, not random selection."}], "answer": 0, "explanation": "The first classification question is whether there is random assignment to different conditions. If yes, the design is randomized or true experimental.", "id": "C2-17", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Classifying research designs", "pages": [18], "prompt": "A study uses no random assignment but includes multiple waves of measurement. Under the chapter’s decision rule, which classification applies?", "choices": [{"text": "Quasi-experimental", "why": ""}, {"text": "True experimental", "why": "True experimental classification requires random assignment in this decision rule."}, {"text": "Nonexperimental", "why": "Without random assignment, multiple groups OR multiple measurement waves lead to quasi-experimental classification."}, {"text": "Unclassifiable unless it also includes multiple groups", "why": "The rule uses either multiple groups or multiple waves; both are not required."}], "answer": 0, "explanation": "On the no-random-assignment branch, either multiple groups or multiple waves of measurement is enough for the chapter’s quasi-experimental classification.", "id": "C2-18", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Classifying research designs", "pages": [18], "prompt": "A design has no random assignment, no multiple groups, and no multiple waves of measurement. Under the chapter’s rule, it is:", "choices": [{"text": "Nonexperimental", "why": ""}, {"text": "True experimental", "why": "There is no random assignment, so the first experimental criterion is not met."}, {"text": "Quasi-experimental", "why": "The design lacks both multiple groups and multiple measurement waves."}, {"text": "Both true experimental and quasi-experimental", "why": "Neither branch’s stated criterion is met; the rule leads to nonexperimental."}], "answer": 0, "explanation": "The chapter classifies a design as nonexperimental when it has neither random assignment nor multiple groups or measurement waves.", "id": "C2-19", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Random selection and assignment", "pages": [21], "prompt": "Every member of the population has an equal chance of being recruited. After recruitment, every participant has an equal chance of entering either study group. Which sequence names these procedures?", "choices": [{"text": "Random selection, then random assignment", "why": ""}, {"text": "Random assignment, then random selection", "why": "Selection concerns recruitment from the population; assignment concerns placement into groups."}, {"text": "Random selection in both stages", "why": "The second stage assigns already selected participants to groups."}, {"text": "Random assignment in both stages", "why": "The first stage chooses participants from the population rather than allocating them to groups."}], "answer": 0, "explanation": "Random selection concerns equal recruitment probability from the population. Random assignment concerns equal allocation probability among the study’s groups.", "id": "C2-20", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Coding and tabulation", "pages": [8, 22, 23, 24, 25], "prompt": "A researcher transforms data categories into symbols that can be counted, then places classified data into tables. Which terms describe these operations in order?", "choices": [{"text": "Coding, then tabulation", "why": ""}, {"text": "Tabulation, then coding", "why": "This reverses symbol transformation and table construction."}, {"text": "Interpretation, then replication", "why": "Interpretation explains findings using theory; replication repeats a study. Neither names these data operations."}, {"text": "Hypothesis testing, then generalization", "why": "These are not the definitions of symbol transformation and placing data into tables."}], "answer": 0, "explanation": "Coding transforms categories into symbols that can be tabulated and counted. Tabulation puts classified data into tables.", "id": "C2-21", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Analysis and significance testing", "pages": [23], "prompt": "During analysis, which relationships or differences does the chapter say should be subjected to significance tests before drawing conclusions?", "choices": [{"text": "Those supporting or conflicting with original or new hypotheses", "why": ""}, {"text": "Only those supporting the original hypothesis", "why": "The chapter includes conflicting findings and new hypotheses as well."}, {"text": "Only those conflicting with the original hypothesis", "why": "Supporting findings and new hypotheses are also included."}, {"text": "Only those supporting a new hypothesis", "why": "The statement also includes original hypotheses and conflicting relationships or differences."}], "answer": 0, "explanation": "The chapter explicitly includes relationships or differences that support OR conflict with original OR new hypotheses.", "id": "C2-22", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Generalization and interpretation", "pages": [21, 23, 25], "prompt": "A researcher began without a hypothesis and now explains the findings on the basis of a theory. What does the chapter call this?", "choices": [{"text": "Interpretation", "why": ""}, {"text": "Random assignment", "why": "Random assignment allocates participants to study groups."}, {"text": "Tabulation", "why": "Tabulation arranges classified data in tables."}, {"text": "Generalization through repeated hypothesis confirmation", "why": "That is the other route described on the slide; this prompt specifically describes explaining findings using a theory."}], "answer": 0, "explanation": "The chapter calls explaining findings on the basis of a theory, when no initial hypothesis was used, interpretation.", "id": "C2-23", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Preparing the report", "pages": [27, 28], "prompt": "Where should a report state its research objective, methodology, scope and limitations according to the chapter?", "choices": [{"text": "Introduction", "why": ""}, {"text": "Summary of findings", "why": "That section presents findings and recommendations in non-technical language."}, {"text": "Conclusion", "why": "The conclusion clearly and precisely sums up the research results."}, {"text": "Bibliography", "why": "The bibliography lists consulted books, journals, reports and other sources."}], "answer": 0, "explanation": "The introduction contains the objective and methodology, along with the scope and limitations of the study.", "id": "C2-24", "set": "A"}, {"chapter": 2, "type": "mcq", "topic": "Criteria of good research", "pages": [29], "prompt": "A researcher discovers flaws in the procedural design. Which response meets the chapter’s criteria of good research?", "choices": [{"text": "Report the flaws frankly and estimate their effects on the findings.", "why": ""}, {"text": "Omit the flaws if the findings support the original hypothesis.", "why": "The chapter requires complete frankness about flaws rather than conditional disclosure."}, {"text": "Report the flaws but avoid estimating their effects.", "why": "The criterion requires both frank reporting and estimating effects on findings."}, {"text": "Broaden the conclusions to compensate for weaknesses in the design.", "why": "Conclusions must be confined to those justified by the data; flaws must be disclosed."}], "answer": 0, "explanation": "Good research includes complete frankness about procedural-design flaws and an estimate of their effects upon the findings.", "id": "C2-25", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Choosing a research topic", "pages": [4], "prompt": "The chapter links a researcher’s field-specific competence to both training and experience.", "answer": true, "explanation": "The chapter says researchers develop competence through a combination of training and experience, typically over many years.", "id": "C2-26", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Theory and research ideas", "pages": [6], "prompt": "In the research context, the chapter treats theories as a source of hypotheses that can be examined empirically.", "answer": true, "explanation": "Theories are explicitly described as a rich source of empirically examinable hypotheses.", "id": "C2-27", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Literature review", "pages": [7, 8], "prompt": "The primary purpose of a literature review is to make the researcher familiar with work already conducted in the selected topic area.", "answer": true, "explanation": "This is the stated primary purpose. The review also addresses existing answers, findings, difficulties and areas needing further research.", "id": "C2-28", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Formulating a research problem", "pages": [9], "prompt": "The chapter recommends leaving ambiguities unresolved when moving from a broad problem statement to formulating the problem.", "answer": false, "explanation": "It says ambiguities should be resolved and the feasibility of a particular solution considered before formulating the problem.", "id": "C2-29", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Falsifiability", "pages": [12], "prompt": "In the chapter, calling a hypothesis falsifiable means that it has already been shown to be false.", "answer": false, "explanation": "Falsifiability means it is capable of being refuted by study results. It does not mean refutation has already occurred.", "id": "C2-30", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Null and alternate hypotheses", "pages": [14], "prompt": "Chapter 2 identifies the null hypothesis as the hypothesis that is tested in scientific research.", "answer": true, "explanation": "The note explicitly identifies the null as the hypothesis tested and uses rejected/not rejected as one formulation of the decision.", "id": "C2-31", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Directional and nondirectional hypotheses", "pages": [15], "prompt": "A nondirectional hypothesis predicts no difference between the groups.", "answer": false, "explanation": "It predicts that groups will differ but does not specify how. No difference is the null prediction.", "id": "C2-32", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Independent and dependent variables", "pages": [16], "prompt": "The dependent variable measures the effect, if any, of the independent variable.", "answer": true, "explanation": "This is the chapter’s definition. The independent variable is the factor manipulated or controlled.", "id": "C2-33", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Informed consent", "pages": [20], "prompt": "The chapter states that researchers must obtain informed consent in every instance, without exception.", "answer": false, "explanation": "The slide explicitly notes a few limited exceptions. It does not identify those instances, so no specific exception is assumed here.", "id": "C2-34", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Random selection and assignment", "pages": [21], "prompt": "Equal probability of entering any study group is the chapter’s definition of random selection.", "answer": false, "explanation": "That is random assignment. Random selection concerns equal probability of being chosen from the population to participate.", "id": "C2-35", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Hypothesis testing", "pages": [24], "prompt": "When no initial hypotheses were used, generalizations based on the data may become hypotheses for subsequent research.", "answer": true, "explanation": "The hypothesis-testing slide explicitly allows data-based generalizations to be stated as hypotheses for later studies.", "id": "C2-36", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Generalization and interpretation", "pages": [25], "prompt": "The chapter says repeated testing and confirmation of a hypothesis may make it possible to construct a theory.", "answer": true, "explanation": "The chapter uses the qualified wording “may be possible” when connecting repeated confirmation to generalization and theory construction.", "id": "C2-37", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Preparing the report", "pages": [27], "prompt": "The summary of findings should present findings and recommendations in technical language rather than non-technical language.", "answer": false, "explanation": "The chapter specifies non-technical language and says extensive findings should be summarized.", "id": "C2-38", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Preparing the report", "pages": [28], "prompt": "Charts and illustrations should be included whenever available, even if they do not make the information clearer.", "answer": false, "explanation": "The chapter says to use charts and illustrations only if they present the information more clearly and forcibly.", "id": "C2-39", "set": "A"}, {"chapter": 2, "type": "tf", "topic": "Induction and deduction", "pages": [30], "prompt": "The chapter defines induction as reasoning from a part to the whole, and deduction as moving from a premise to a conclusion that follows from it.", "answer": true, "explanation": "These are the definitions given under logical research. The statement preserves their direction rather than reversing them.", "id": "C2-40", "set": "A"}, {"chapter": 2, "type": "list", "topic": "Logistical and administrative planning", "pages": [2], "prompt": "List the FOUR logistical and administrative issues to consider at the start of planning, as grouped in the chapter.", "items": ["Who will pay for the research.", "Whether research staff need to be hired.", "Where and when the study will be conducted.", "What approvals are needed and from whom."], "required": 4, "explanation": "These are the four slide entries. Location and timing form one entry; approval requirements and approving parties form another.", "id": "C2-41", "matchRules": [[["funding", "financing", "who pays", "who is paying", "pay for research", "research funding"]], [["hiring staff", "hire staff", "staff recruitment", "staffing", "staff need to be hired"]], [["where", "location", "place"], ["when", "time", "timing", "schedule"]], [["approvals", "approval", "permission"], ["from whom", "who", "authority", "authorities", "approving parties"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Formulating a research problem", "pages": [10], "prompt": "List the THREE criteria for a good research problem stated in the chapter.", "items": ["Describe a relationship between two or more variables.", "Take the form of a question.", "Be capable of being tested empirically."], "required": 3, "explanation": "These are the three explicit criteria. Merely naming a broad subject does not supply the relationship, question form and testability.", "id": "C2-42", "matchRules": [[["relationship", "relationships", "relation"], ["two or more variables", "at least two variables", "2 or more variables", "two variables", "2 variables"]], [["question", "question form"]], [["empirically testable", "empirical testing", "tested empirically", "empirical testability", "empirically tested"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Developing working hypotheses", "pages": [13], "prompt": "List the FOUR approaches given for developing working hypotheses.", "items": ["Discuss the problem, its origin and solution objectives with colleagues and experts.", "Examine available data and records for trends, peculiarities and clues.", "Review similar studies or studies of similar problems.", "Conduct exploratory personal investigation."], "required": 4, "explanation": "These four approaches are explicitly listed. A short phrase identifying each approach is enough; an essay is not required.", "id": "C2-43", "matchRules": [[["discussions", "discussion", "discuss", "consult"], ["colleagues", "experts"]], [["examine data", "examination of data", "examine records", "review records", "examination of records", "data and records"]], [["similar studies", "similar research", "studies on similar problems"]], [["exploratory investigation", "personal investigation", "exploratory personal investigation"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Preparing a research design", "pages": [19], "prompt": "List any FOUR of the five considerations given for preparing a research design.", "items": ["Means of obtaining information.", "Availability and skills of the researcher and staff.", "How the chosen means of obtaining information will be organized and why they were selected.", "Time available for the research.", "Cost of the research."], "required": 4, "explanation": "Any four of the five considerations satisfy the question. The organization and justification of chosen means are grouped as one consideration.", "id": "C2-44", "matchRules": [[["means of obtaining information", "information collection methods", "data collection methods", "obtaining information"]], [["availability", "available"], ["skills", "skill"], ["researcher", "staff"]], [["organization", "organisation", "organized", "organised"], ["reasoning", "justification", "why", "rationale"]], [["time", "time available"]], [["cost", "costs", "budget", "money"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Data collection methods", "pages": [20], "prompt": "List the FIVE data-collection methods named in the chapter. Count formal testing as one method.", "items": ["Formal testing.", "Interviewing.", "Global ratings.", "Observation.", "Biological measures."], "required": 5, "explanation": "These are the five named methods. Psychological, educational, academic and intelligence testing are examples within formal testing, not four extra methods.", "id": "C2-45", "matchRules": [[["formal testing", "formal tests"]], [["interviewing", "interviews", "interview"]], [["global ratings", "global rating"]], [["observation", "observations"]], [["biological measures", "biological measurements"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Informed consent", "pages": [20], "prompt": "List the THREE types of information the chapter says potential participants receive through informed consent.", "items": ["Procedures that will be used in the study.", "Risks of participating.", "Benefits of participating."], "required": 3, "explanation": "The slide identifies procedures, risks and benefits. It mentions limited exceptions to obtaining consent but does not name them.", "id": "C2-46", "matchRules": [[["procedures"]], [["risks"]], [["benefits"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Data analysis operations", "pages": [22], "prompt": "List the FOUR closely related operations required for data analysis on the chapter’s “Analysis of Data” slide.", "items": ["Establish categories.", "Apply those categories to raw data through coding.", "Tabulate the data.", "Draw statistical inferences."], "required": 4, "explanation": "These are the four listed operations. Coding applies categories to the raw data; tabulation and statistical inference are separate entries.", "id": "C2-47", "matchRules": [[["establish categories", "establishment of categories", "categorization", "categorisation", "create categories", "classification"]], [["coding", "code data"]], [["tabulation", "tabulate"]], [["statistical inference", "statistical inferences"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Report structure", "pages": [26], "prompt": "Name the THREE major divisions of a research report’s layout in the chapter.", "items": ["Preliminary pages.", "Main text.", "End matter."], "required": 3, "explanation": "These are the report’s three major divisions. Introduction and conclusion are parts within the main text, not divisions at this level.", "id": "C2-48", "matchRules": [[["preliminary pages", "preliminaries"]], [["main text"]], [["end matter"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Preparing the report", "pages": [27], "prompt": "Name the FOUR parts of the report’s main text listed in the chapter.", "items": ["Introduction.", "Summary of findings.", "Main report.", "Conclusion."], "required": 4, "explanation": "These are the four parts explicitly listed for the main text. The bibliography and appendices belong to end matter.", "id": "C2-49", "matchRules": [[["introduction"]], [["summary of findings", "findings summary"]], [["main report"]], [["conclusion"]]], "set": "A"}, {"chapter": 2, "type": "list", "topic": "Criteria of good research", "pages": [30], "prompt": "List the FOUR characteristics following “Good research is” in the chapter.", "items": ["Systematic.", "Logical.", "Empirical.", "Replicable."], "required": 4, "explanation": "The slide lists systematic, logical, empirical and replicable. Systematic means following specified steps in a specified sequence under well-defined rules.", "id": "C2-50", "matchRules": [[["systematic"]], [["logical"]], [["empirical"]], [["replicable", "replication", "repeatable"]]], "set": "A"}, {"chapter": 1, "set": "B", "topic": "Applied vs. Fundamental", "pages": [12], "prompt": "A team studies human behaviour with a view to making generalisations about human behaviour. No particular organization’s problem prompted the study. According to the chapter, this is best classified as:", "explanation": "The chapter gives this precise case: “research studies concerning human behaviour carried on with a view to make generalisations about human behaviour are also examples of fundamental research.” Fundamental research is concerned with generalizations and with the formulation of a theory; gathering knowledge for knowledge’s sake is termed ‘pure’ or ‘basic’ research.", "id": "B-C1-01", "type": "mcq", "answer": 0, "choices": [{"text": "Fundamental (‘pure’ or ‘basic’) research", "why": ""}, {"text": "Applied research", "why": "Applied research aims at a solution for an immediate problem facing a society or an industrial/business organization — which the stem explicitly rules out."}, {"text": "Descriptive research", "why": "Descriptive research describes the state of affairs as it exists at present, through surveys and fact-finding enquiries; the aim here is generalisation, not description."}, {"text": "Analytical research", "why": "Analytical research uses facts or information already available and critically evaluates them; nothing in the stem says the data already exist."}]}, {"chapter": 1, "set": "B", "topic": "Objectives of research", "pages": [5], "prompt": "Which of the following is listed in the chapter as an objective of research (not a motivation)?", "explanation": "The chapter gives exactly two objectives: “to discover answers to questions through the application of scientific procedures” and “to find out the truth which has not been discovered yet.”", "id": "B-C1-02", "type": "mcq", "answer": 0, "choices": [{"text": "To find out the truth which has not been discovered yet", "why": ""}, {"text": "To get intellectual joy of doing some creative work", "why": "Intellectual joy is listed under Motivations of research, not objectives."}, {"text": "To serve the society", "why": "Desire to serve the society is listed under Motivations."}, {"text": "To attain a high position in the social structure", "why": "Attaining a high position in the social structure is listed under Significance of research (for master’s and PhD students)."}]}, {"chapter": 1, "set": "B", "topic": "Motivations of research", "pages": [6], "prompt": "The chapter notes that “concern over practical problems initiates research.” This remark belongs to which motivation?", "explanation": "That exact note is attached to the motivation “Desire to face the challenge in solving the unsolved problems, i.e., concern over practical problems initiates research.”", "id": "B-C1-03", "type": "mcq", "answer": 0, "choices": [{"text": "Desire to face the challenge in solving the unsolved problems", "why": ""}, {"text": "Desire to get respectability", "why": "Respectability is a separate, stand-alone motivation with no such note."}, {"text": "Desire to serve the society", "why": "Serving the society is a separate motivation; the practical-problems remark is not attached to it."}, {"text": "Desire to get a research degree along with its consequential benefits", "why": "The research-degree motivation is linked to “consequential benefits,” not to practical problems."}]}, {"chapter": 1, "set": "B", "topic": "Correlational research", "pages": [8, 9], "prompt": "In the chapter’s discussion of correlational research, a variable is defined as:", "explanation": "The chapter defines it directly: “A variable is anything that can take on different values, such as weight, time, and height.”", "id": "B-C1-04", "type": "mcq", "answer": 0, "choices": [{"text": "Anything that can take on different values", "why": ""}, {"text": "A factor that the researcher deliberately manipulates", "why": "Manipulation by the researcher is not part of the chapter’s definition; in fact descriptive research is described as having no control over variables."},
