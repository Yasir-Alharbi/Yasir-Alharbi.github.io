t have identical values", "why": "The chapter does not require equal values."}, {"text": "One variable must be experimentally manipulated", "why": "The claim concerns correlational research, which does not require this manipulation."}, {"text": "The relationship must first be called positive", "why": "The prediction statement is not restricted to positive relationships."}]}, {"chapter": 1, "set": "B", "topic": "Negative correlation", "pages": [9], "prompt": "In one dataset, X increases as Y decreases. In another, X decreases as Y increases. How are these two patterns classified?", "explanation": "Both patterns involve variables changing in opposite directions.", "id": "B-C1-06", "type": "mcq", "answer": 0, "choices": [{"text": "Both are negative correlations", "why": ""}, {"text": "The first is negative and the second positive", "why": "Reversing which variable increases does not turn opposite-direction change into same-direction change."}, {"text": "Both are positive correlations", "why": "Positive correlation requires the same direction of change."}, {"text": "Neither is a correlation because the directions differ", "why": "Opposite-direction change is precisely the negative pattern described."}]}, {"chapter": 1, "set": "B", "topic": "Test Yourself terminology", "pages": [30], "prompt": "A revision sheet needs the term used in the Test Yourself answer key for defining key concepts and terms in research. Which entry belongs there?", "explanation": "The image-based answer key supplies “operational definitions.”", "id": "B-C1-07", "type": "mcq", "answer": 0, "choices": [{"text": "Operational definitions", "why": ""}, {"text": "Research motivations", "why": "Motivations concern reasons for undertaking research, not the answer-key term."}, {"text": "Statistical conclusions", "why": "This is not the term supplied for defining key concepts and terms."}, {"text": "Research replication", "why": "Replication is not the term supplied in this answer-key item."}]}, {"chapter": 1, "set": "B", "topic": "Experimental evidence", "pages": [10], "prompt": "In the chapter’s headache experiment, which reported result supports its stated conclusion that the new medication reduces headaches?", "explanation": "The example draws this conclusion when the experimental group reports fewer headaches than the control group.", "id": "B-C1-08", "type": "mcq", "answer": 0, "choices": [{"text": "The new-medication group reports fewer headaches than the placebo group", "why": ""}, {"text": "The two groups report the same number of headaches", "why": "This does not show the reduction relative to the control described in the example."}, {"text": "The placebo group reports fewer headaches than the new-medication group", "why": "This is the reverse of the supporting result."}, {"text": "The researcher predicts fewer headaches before collecting results", "why": "A prediction is not the observed group difference needed here."}]}, {"chapter": 1, "set": "B", "topic": "Scientific-method checklist", "pages": [18], "prompt": "An editor wants a checklist containing only the eight characteristics named on the chapter’s scientific-method overview slide. Which proposed entry is absent from that particular list?", "explanation": "Generalization is not one of the eight headings on this slide; that does not imply it has no role in research.", "id": "B-C1-09", "type": "mcq", "answer": 0, "choices": [{"text": "Generalization", "why": ""}, {"text": "Observations", "why": "Observations is one of the eight named characteristics."}, {"text": "Questions", "why": "Questions is one of the eight named characteristics."}, {"text": "Replication", "why": "Replication is one of the eight named characteristics."}]}, {"chapter": 1, "set": "B", "topic": "Placebo control", "pages": [10], "prompt": "A student summarizes the headache example as “the experimental group receives medication and the control group receives nothing.” Which edit makes the summary accurate?", "explanation": "The control group receives a placebo medication containing a harmless substance.", "id": "B-C1-10", "type": "mcq", "answer": 0, "choices": [{"text": "Replace “nothing” with “a placebo containing a harmless substance”", "why": ""}, {"text": "Replace “nothing” with “the same new medication”", "why": "The chapter contrasts the new medication with a placebo."}, {"text": "Replace “control group” with “experimental group”", "why": "Changing the group label does not correct the treatment description."}, {"text": "Keep the summary because placebo means no substance is administered", "why": "The slide explicitly describes a harmless substance being administered."}]}, {"chapter": 1, "set": "B", "topic": "Scope of descriptive research", "pages": [11], "prompt": "A reviewer rejects a descriptive report solely because it reports what has happened, rather than only what is happening now. Which response best reflects the slide?", "explanation": "Although present conditions are emphasized, the slide allows the researcher to report what has happened or is happening.", "id": "B-C1-11", "type": "mcq", "answer": 0, "choices": [{"text": "That rejection is too restrictive: the slide includes reporting what has happened", "why": ""}, {"text": "The rejection is correct because past events are explicitly excluded", "why": "The slide explicitly includes what has happened."}, {"text": "Any reference to past events makes a study experimental", "why": "Time reference alone does not establish an experiment."}, {"text": "Past events make every descriptive report a theory-development study", "why": "The slide does not make that classification from time reference."}]}, {"chapter": 1, "set": "B", "topic": "Combining purpose and description", "pages": [11, 12], "prompt": "A survey describes current delivery delays so that a company can address an immediate operational problem. Which pair fits the stated descriptive task and practical purpose?", "explanation": "Descriptive research reports the present state; applied research addresses an immediate practical problem.", "id": "B-C1-12", "type": "mcq", "answer": 0, "choices": [{"text": "Descriptive and applied", "why": ""}, {"text": "Descriptive and fundamental", "why": "The purpose is an immediate company problem, not knowledge for its own sake."}, {"text": "Analytical and fundamental", "why": "Neither critical evaluation of existing information nor a fundamental purpose is specified."}, {"text": "Experimental and applied", "why": "The practical purpose fits, but no experimental comparison is described."}]}, {"chapter": 1, "set": "B", "topic": "Analytical research", "pages": [11], "prompt": "A student says that merely possessing existing facts makes a project analytical. What essential activity is missing from that justification?", "explanation": "The definition combines using already available information with analyzing it to make a critical evaluation.", "id": "B-C1-13", "type": "mcq", "answer": 0, "choices": [{"text": "Critical evaluation of the available material", "why": ""}, {"text": "Creating a new medication", "why": "The definition does not require a medication experiment."}, {"text": "Avoiding all previously available information", "why": "Analytical research explicitly uses such information."}, {"text": "Replacing evaluation with a list of facts", "why": "Listing facts alone does not supply critical evaluation."}]}, {"chapter": 1, "set": "B", "topic": "Applied research scope", "pages": [12], "prompt": "A funding panel says applied research can address business problems but never an immediate problem facing society. Which correction follows the chapter?", "explanation": "The definition includes immediate problems facing society as well as industrial or business organizations.", "id": "B-C1-14", "type": "mcq", "answer": 0, "choices": [{"text": "Immediate societal problems also fall within the stated scope", "why": ""}, {"text": "Only pure mathematics falls within applied research", "why": "Pure mathematics is given as a fundamental-research example."}, {"text": "The panel is correct because society is excluded", "why": "Society is explicitly included."}, {"text": "Applied research must avoid all immediate problems", "why": "Immediate problem solving is central to the definition."}]}, {"chapter": 1, "set": "B", "topic": "From hypothesis to study", "pages": [24, 27], "prompt": "A researcher has formulated a hypothesis but has collected no study data. Which activity belongs before statistical analysis in the sequence described?", "explanation": "The chapter proceeds from formulating a hypothesis to conducting the study and gathering data, then to analysis.", "id": "B-C1-15", "type": "mcq", "answer": 0, "choices": [{"text": "Conduct the experiment or study and gather relevant measurements", "why": ""}, {"text": "Decide the statistical result before measurements exist", "why": "The chapter bases analysis on data collected in the study."}, {"text": "Write a data-supported conclusion without conducting the study", "why": "There are no study data to support such a conclusion yet."}, {"text": "Treat the hypothesis as an observed result", "why": "A hypothesis still needs to be tested through the study."}]}, {"chapter": 1, "set": "B", "topic": "Qualitative research", "pages": [13], "prompt": "An interview study uses observations without formal measurement or statistical analysis. A reviewer calls it quantitative solely because it involves many participants. Which response is supported?", "explanation": "The slide distinguishes approaches through measurement and statistical analysis, not a participant-count threshold.", "id": "B-C1-16", "type": "mcq", "answer": 0, "choices": [{"text": "Participant count alone does not establish the quantitative features described", "why": ""}, {"text": "Every interview study must use statistical analysis", "why": "The slide describes interviews among typical qualitative methods."}, {"text": "A large participant count replaces the need for formal measurement", "why": "The chapter does not present sample size as a substitute for quantitative measurement."}, {"text": "Qualitative research is defined as exactly one participant", "why": "A case study is one example, not the definition of all qualitative research."}]}, {"chapter": 1, "set": "B", "topic": "Depth in a case study", "pages": [13], "prompt": "A student calls a brief mention of one person’s experience equivalent to the case-study example on the slide. Which feature of that example has not yet been established?", "explanation": "The example is an in-depth examination of one person; merely mentioning one person does not establish that depth.", "id": "B-C1-17", "type": "mcq", "answer": 0, "choices": [{"text": "An in-depth examination of the person", "why": ""}, {"text": "A statistical comparison of several treatment groups", "why": "That is not the feature specified for this case-study example."}, {"text": "A random division of that person into two groups", "why": "That does not reproduce the described examination of one person."}, {"text": "A requirement to replace the person with a population average", "why": "The example concerns examination of one person, not replacement by a population average."}]}, {"chapter": 1, "set": "B", "topic": "Relationship between approaches", "pages": [13], "prompt": "A methods guide rewrites “qualitative studies often generate hypotheses for later quantitative research” as “every quantitative study must be preceded by a qualitative study.” What is the best evaluation?", "explanation": "“Often” describes a common contribution, not a universal prerequisite for quantitative research.", "id": "B-C1-18", "type": "mcq", "answer": 0, "choices": [{"text": "The rewrite turns a common contribution into an unsupported requirement", "why": ""}, {"text": "The rewrite preserves exactly the original scope", "why": "A universal requirement is stronger than “often.”"}, {"text": "The rewrite is correct because qualitative research always tests every hypothesis statistically", "why": "The slide does not describe qualitative research that way."}, {"text": "The original statement means qualitative studies cannot suggest hypotheses", "why": "This reverses the contribution stated in the slide."}]}, {"chapter": 1, "set": "B", "topic": "Conceptual research", "pages": [14], "prompt": "A student allows conceptual research to reinterpret existing ideas but excludes developing new concepts. What correction is needed?", "explanation": "The slide includes both developing new concepts and reinterpreting existing ones.", "id": "B-C1-19", "type": "mcq", "answer": 0, "choices": [{"text": "Include the development of new concepts as well", "why": ""}, {"text": "Exclude both activities", "why": "Both activities are explicitly included."}, {"text": "Allow only direct medication experiments", "why": "Conceptual research is linked to abstract ideas or theory."}, {"text": "Keep the restriction because new concepts are forbidden", "why": "The slide explicitly permits developing new concepts."}]}, {"chapter": 1, "set": "B", "topic": "Empirical principle", "pages": [14], "prompt": "A researcher claims that direct, careful observation matters only to studies carrying the label “empirical research.” Which statement best corrects that reading?", "explanation": "The slide calls direct, systematic, careful observation a guiding principle of all research conducted using the scientific method.", "id": "B-C1-20", "type": "mcq", "answer": 0, "choices": [{"text": "The slide gives careful observation a broader role across scientific-method research", "why": ""}, {"text": "The slide removes observation from scientific research", "why": "It makes observation a guiding principle."}, {"text": "Only philosophers may use direct observation", "why": "No such restriction appears."}, {"text": "Naming a study empirical makes observations unnecessary", "why": "The label does not replace the evidence-based activity described."}]}, {"chapter": 1, "set": "B", "topic": "Significance for students", "pages": [16], "prompt": "Which benefit does the chapter specifically associate with master’s and PhD students, rather than with philosophers or analysts?", "explanation": "The slide associates research for these students with attaining a high position in the social structure.", "id": "B-C1-21", "type": "mcq", "answer": 0, "choices": [{"text": "A way to attain a high position in the social structure", "why": ""}, {"text": "An outlet for philosophers’ new ideas and insights", "why": "That wording is assigned to philosophers and thinkers."}, {"text": "Developing new theories through analysts’ generalizations", "why": "That wording is assigned to analysts and intellectuals."}, {"text": "A guarantee that every study solves an immediate business problem", "why": "The slide makes no such guarantee."}]}, {"chapter": 1, "set": "B", "topic": "Methods and methodology", "pages": [17], "prompt": "A proposal lists the techniques used to perform its research operations but gives no account of the logic behind its steps. What has it supplied most directly?", "explanation": "Methods are techniques used in research operations; methodology also concerns the systematic steps and their underlying logic.", "id": "B-C1-22", "type": "mcq", "answer": 0, "choices": [{"text": "An inventory of research methods", "why": ""}, {"text": "A complete account of methodology solely because techniques are named", "why": "Naming techniques does not supply the omitted logic."}, {"text": "The study’s conclusions", "why": "A technique list does not state findings or conclusions."}, {"text": "Evidence that systematic reasoning is unnecessary", "why": "The chapter explicitly includes logic in methodology."}]}, {"chapter": 1, "set": "B", "topic": "Science and scientific method", "pages": [30], "prompt": "Two revision-card headings read “methodological and systematic acquisition of new knowledge” and “the defining characteristic of scientific research.” Which pairing follows the Test Yourself answer key?", "explanation": "The image answer key identifies science for the first and the scientific method for the second.", "id": "B-C1-23", "type": "mcq", "answer": 0, "choices": [{"text": "Science; scientific method", "why": ""}, {"text": "Scientific method; science", "why": "This reverses the answer-key pairing."}, {"text": "Replication; research motivation", "why": "Neither term matches these two answer-key entries."}, {"text": "Research motivation; replication", "why": "These terms do not match either entry."}]}, {"chapter": 1, "set": "B", "topic": "Observation as a starting point", "pages": [20], "prompt": "Why does the chapter mention Newton noticing apples falling?", "explanation": "The example illustrates how awareness and observation of events can stimulate research.", "id": "B-C1-24", "type": "mcq", "answer": 0, "choices": [{"text": "To illustrate an observation that stimulated further research", "why": ""}, {"text": "To claim the observation alone completed every research stage", "why": "The example is about stimulation of research, not completion of the whole process."}, {"text": "To show that scientific measurement is unnecessary", "why": "The same slide emphasizes careful and accurate measurements."}, {"text": "To classify noticing an event as random assignment", "why": "No assignment to groups is described."}]}, {"chapter": 1, "set": "B", "topic": "Hypotheses before findings", "pages": [22, 23], "prompt": "A supervisor rejects a proposed hypothesis solely because its prediction has not yet been confirmed. Which response follows the chapter?", "explanation": "A hypothesis is an educated, testable guess; collected data can subsequently support or refute it.", "id": "B-C1-25", "type": "mcq", "answer": 0, "choices": [{"text": "Prior confirmation is not required; the prediction must be testable", "why": ""}, {"text": "A hypothesis must already be a final conclusion", "why": "The slide describes a testable guess, not a completed conclusion."}, {"text": "An unconfirmed prediction must be made untestable", "why": "Testability is required, not removed."}, {"text": "Calling a statement a hypothesis guarantees supporting data", "why": "The data may support or refute it."}]}, {"chapter": 1, "set": "B", "topic": "Forms of hypotheses", "pages": [22], "prompt": "A student requires every hypothesis to have identical wording regardless of the question or study. Which revision matches the slide?", "explanation": "The form of a hypothesis varies with the question and the type of study.", "id": "B-C1-26", "type": "mcq", "answer": 0, "choices": [{"text": "Allow the form to vary with the question and type of study", "why": ""}, {"text": "Keep identical wording because all research asks the same question", "why": "The slide explicitly allows variation with the question."}, {"text": "Remove testability whenever the wording changes", "why": "Variation in form does not remove the requirement that a hypothesis be testable."}, {"text": "Choose wording independently of the research question", "why": "The slide links the form to the question and study type."}]}, {"chapter": 1, "set": "B", "topic": "Limits of conclusions", "pages": [28], "prompt": "A report adds a conclusion about a population characteristic that its study never measured and that its data cannot support. Which chapter principle is violated?", "explanation": "Conclusions must be limited to what the collected data support.", "id": "B-C1-27", "type": "mcq", "answer": 0, "choices": [{"text": "Drawing only conclusions supported by the data", "why": ""}, {"text": "Every conclusion must repeat the hypothesis word for word", "why": "The slide does not require verbatim repetition."}, {"text": "Conclusions must be decided before analysis", "why": "The chapter places them after analysis and the null-hypothesis decision."}, {"text": "An attractive conclusion needs no evidence", "why": "This contradicts the data-support requirement."}]}, {"chapter": 1, "set": "B", "topic": "Course scope", "pages": [3], "prompt": "A student stops preparing once data have been collected, claiming that interpreting and communicating results are outside the course’s purposes. Which correction follows the course-purpose slide?", "explanation": "The course explicitly includes interpreting and disseminating research findings.", "id": "B-C1-28", "type": "mcq", "answer": 0, "choices": [{"text": "Preparation should also cover interpretation and dissemination of findings", "why": ""}, {"text": "The course excludes everything after collection", "why": "The stated purposes extend beyond collection."}, {"text": "Only the researcher’s degree benefits are included", "why": "The purpose slide addresses research knowledge and practice, not only degree benefits."}, {"text": "Interpreting results is listed only as a research pitfall", "why": "Interpretation and dissemination are named as substantive purposes."}]}, {"chapter": 1, "set": "B", "topic": "After statistical analysis", "pages": [28], "prompt": "The statistical analysis is complete and the researcher has decided whether to reject the null hypothesis. What comes next in the chapter’s account?", "explanation": "The conclusions stage follows analysis and the decision concerning the null hypothesis.", "id": "B-C1-29", "type": "mcq", "answer": 0, "choices": [{"text": "Draw conclusions that the data support", "why": ""}, {"text": "Replace the observed data with the original prediction", "why": "A prediction cannot replace the collected evidence."}, {"text": "Treat every possible conclusion as equally supported", "why": "The slide limits conclusions to those supported by data."}, {"text": "Skip conclusions because the statistical decision is the entire report", "why": "The chapter explicitly describes a subsequent conclusions stage."}]}, {"chapter": 1, "set": "B", "topic": "Two uses of reliability", "pages": [26, 29], "prompt": "One researcher checks whether measurements repeatedly land in the same place; another repeats a study with a different participant group. Which distinction best matches the chapter?", "explanation": "The measurement example concerns consistency; replication helps establish the reliability of study findings and whether results generalize.", "id": "B-C1-30", "type": "mcq", "answer": 0, "choices": [{"text": "Consistency of measurements; reliability and generalizability of study findings", "why": ""}, {"text": "Both procedures are definitions of measurement accuracy", "why": "Accuracy concerns correctness, and replication has broader purposes."}, {"text": "The second procedure proves that the measuring instrument is perfectly accurate", "why": "Repeating the study does not by itself establish perfect measurement accuracy."}, {"text": "The first procedure alone establishes generalizability to other participants", "why": "Consistent measurements alone do not perform a study with another participant group."}]}, {"chapter": 1, "set": "B", "topic": "Descriptive methods", "pages": [11], "prompt": "The chapter restricts descriptive research to surveys and excludes other fact-finding enquiries.", "explanation": "The definition includes surveys and fact-finding enquiries of different kinds.", "id": "B-C1-31", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Motivation and evidence", "pages": [6, 19], "prompt": "A researcher may be motivated by creative intellectual enjoyment while still making scientific decisions from directly observed data.", "explanation": "Creative enjoyment is a listed motivation; the empirical approach bases decisions on observation or experimentation. These address different aspects of research.", "id": "B-C1-32", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Hypothesis terminology", "pages": [22], "prompt": "A prediction of no difference between groups becomes an alternate hypothesis merely because the researcher plans to conduct an experiment.", "explanation": "The prediction of no group difference defines the null hypothesis; the study label does not change that prediction.", "id": "B-C1-33", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Measurement priorities", "pages": [26], "prompt": "When choosing measurements for a study, the chapter says accuracy deserves greater priority than reliability.", "explanation": "The slide says accuracy and reliability are equally important.", "id": "B-C1-34", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Observation and research types", "pages": [13, 14], "prompt": "Because qualitative work may use observations without formal statistical analysis, the chapter’s guiding principle of careful observation cannot apply to it.", "explanation": "Qualitative research may use observations; careful observation is described as a guiding principle of all scientific-method research.", "id": "B-C1-35", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Definition of research", "pages": [4], "prompt": "Finding something new through an unsystematic search is sufficient to meet the chapter’s definition of research as an objective and systematic search for knowledge.", "explanation": "Novelty alone does not satisfy the stated requirements of objectivity and systematic inquiry.", "id": "B-C1-36", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Fundamental research examples", "pages": [12], "prompt": "Research into natural phenomena or pure mathematics is presented among the chapter’s examples of fundamental research.", "explanation": "Both are explicitly included as examples of fundamental research.", "id": "B-C1-37", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Scientific method — characteristics", "pages": [18], "prompt": "The chapter acknowledges that some disagreement exists regarding the exact characteristics of the scientific method.", "explanation": "True. The chapter opens that slide with the hedge: “Although some disagreement exists regarding the exact characteristics of the scientific method, most agree that it is characterized by the following…” The eight characteristics are presented as a consensus, not as a settled definition.", "id": "B-C1-38", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Replication", "pages": [29], "prompt": "Planning a replication guarantees that the new participant group will produce the same results as the original study.", "explanation": "Replication investigates whether the same results can be obtained; it does not guarantee the outcome.", "id": "B-C1-39", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Scope of conceptual research", "pages": [14], "prompt": "A conceptual study can address an abstract idea even when that idea is not yet a fully developed theory.", "explanation": "The slide associates conceptual research with an abstract idea or theory and includes development of new concepts.", "id": "B-C1-40", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Answerable questions", "pages": [21], "prompt": "An interesting research idea is enough to make a study rewarding even when its research question cannot be answered.", "explanation": "The chapter warns that studying questions that cannot be answered is frustrating and unrewarding.", "id": "B-C1-41", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Policy significance", "pages": [15], "prompt": "A student’s summary saying that research has no stated role in economic-system government policies contradicts the significance slide.", "explanation": "The slide states that research provides the basis for nearly all government policies in the economic system.", "id": "B-C1-42", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Motivations of research", "pages": [6], "prompt": "Mention the 5 motivations of research listed in the chapter.", "explanation": "These are the five motivations listed on the Motivations of Research slide.", "id": "B-C1-43", "type": "list", "required": 5, "items": ["Desire to get a research degree along with its consequential benefits", "Desire to face the challenge in solving the unsolved problems (concern over practical problems)", "Desire to get intellectual joy of doing some creative work", "Desire to serve the society", "Desire to get respectability"], "matchRules": [[["degree"]], [["challenge", "unsolved", "practical problem"]], [["joy", "creative", "intellectual"]], [["serve", "societ", "society"]], [["respect", "respectability"]]]}, {"chapter": 1, "set": "B", "topic": "Types of research", "pages": [7], "prompt": "List the 5 pairs of research types presented in the chapter’s classification. (One pair per line, e.g. “X vs. Y”.)", "explanation": "The Types of Research slide lists exactly these five contrasting pairs.", "id": "B-C1-44", "type": "list", "required": 5, "items": ["Correlational vs. Experimental", "Descriptive vs. Analytical", "Applied vs. Fundamental (pure / basic)", "Quantitative vs. Qualitative", "Conceptual vs. Empirical"], "matchRules": [[["correlational", "experimental"]], [["descriptive", "analytical"]], [["applied", "fundamental", "basic", "pure"]], [["quantitative", "qualitative"]], [["conceptual", "empirical"]]]}, {"chapter": 1, "set": "B", "topic": "Scientific method — characteristics", "pages": [18], "prompt": "Name the 8 characteristics of the scientific method on which, the chapter says, most agree.", "explanation": "The chapter lists these eight characteristics and then devotes one slide to each.", "id": "B-C1-45", "type": "list", "required": 8, "items": ["Empirical approach", "Observations", "Questions", "Hypotheses", "Experiments", "Analyses", "Conclusions", "Replication"], "matchRules": [[["empirical"]], [["observ", "observations"]], [["question", "questions"]], [["hypothes", "hypotheses"]], [["experiment", "experiments"]], [["analys", "analyses", "analyz"]], [["conclusion", "conclusions"]], [["replicat", "replication"]]]}, {"chapter": 1, "set": "B", "topic": "Correlation patterns", "pages": [9], "prompt": "For each of the TWO correlation types on the slide, give its name AND the direction in which the variables change.", "explanation": "Naming a type alone is incomplete; include its direction of change.", "id": "B-C1-46", "type": "list", "required": 2, "items": ["Positive correlation: variables change in the same direction", "Negative or inverse correlation: variables change in opposite directions"], "matchRules": [[["positive"], ["same direction", "both increase", "both decrease"]], [["negative", "inverse"], ["opposite directions", "opposite direction", "one increases while the other decreases", "one decreases while the other increases"]]]}, {"chapter": 1, "set": "B", "topic": "Exercise hypothesis specification", "pages": [23], "prompt": "Reconstruct the exercise hypothesis by giving THREE details, one per line: daily exercise duration, minimum weekly frequency, and the predicted cholesterol change.", "explanation": "The example specifies 30 minutes per day, at least three days per week, and reduced cholesterol.", "id": "B-C1-47", "type": "list", "required": 3, "items": ["Exercise for 30 minutes per day", "Exercise at least three days per week", "Cholesterol levels decrease"], "matchRules": [[["30 minutes", "thirty minutes"], ["per day", "daily", "each day", "a day"]], [["at least three", "at least 3", "three or more", "3 or more", "minimum three", "minimum 3"], ["days per week", "days a week", "days weekly"]], [["cholesterol"], ["decrease", "decreased", "reduced", "reduce", "reduction", "lower", "lowered"]]]}, {"chapter": 1, "set": "B", "topic": "Working with collected data", "pages": [4], "prompt": "In the definition of research, which TWO activities accompany collecting data before deductions and conclusions? Give each activity together with what it acts on.", "explanation": "The definition lists collecting, organizing, and evaluating data before deductions and conclusions.", "id": "B-C1-48", "type": "list", "required": 2, "items": ["Organizing data", "Evaluating data"], "matchRules": [[["organizing", "organising", "organize", "organise", "organization", "organisation"], ["data"]], [["evaluating", "evaluate", "evaluation", "assessing"], ["data"]]]}, {"chapter": 1, "set": "B", "topic": "Goals of scientific research", "pages": [30], "prompt": "State the 3 general goals of scientific research.", "explanation": "The chapter’s Test Yourself answer key gives the three general goals as description, prediction, and understanding/explaining.", "id": "B-C1-49", "type": "list", "required": 3, "items": ["Description", "Prediction", "Understanding / explaining"], "matchRules": [[["descri", "description"]], [["predict", "prediction"]], [["understand", "understanding", "explain", "explaining"]]]}, {"chapter": 1, "set": "B", "topic": "Course purposes", "pages": [3], "prompt": "List any THREE of the FIVE purposes stated for this course. Include the activity and its subject, rather than a single broad word.", "explanation": "The purpose slide covers designs, process, considerations, interpretation/dissemination, and pitfalls.", "id": "B-C1-50", "type": "list", "required": 3, "items": ["Understand research designs", "Understand the basic research process", "Understand considerations in conducting research", "Interpret and disseminate research findings", "Identify common research pitfalls"], "matchRules": [[["understand", "understanding", "knowledge", "learn", "discuss", "discussing", "discussion"], ["research designs", "research design"]], [["understand", "understanding", "knowledge", "learn", "discuss", "discussing", "discussion"], ["research process"]], [["understand", "understanding", "knowledge", "learn", "discuss", "discussing", "discussion"], ["considerations"], ["research"]], [["interpret", "interpretation", "interpreting"], ["disseminate", "dissemination", "disseminating", "communicate", "communicating"], ["findings", "results"]], [["identify", "identifying", "understand", "understanding", "recognize", "recognise", "learn", "discuss", "discussing", "discussion"], ["pitfalls"], ["research"]]]}, {"chapter": 2, "set": "B", "topic": "Design decision rule", "pages": [18], "prompt": "Neither Study X nor Study Y uses random assignment. X compares multiple groups; Y uses multiple measurement waves. Under the chapter’s decision rule, how are they classified?", "explanation": "Without random assignment, either multiple groups or multiple measurement waves leads to the quasi-experimental category in this slide’s rule.", "id": "B-C2-01", "type": "mcq", "answer": 0, "choices": [{"text": "Both are quasi-experimental", "why": ""}, {"text": "Only X is quasi-experimental", "why": "The rule also includes multiple measurement waves."}, {"text": "Only Y is quasi-experimental", "why": "The rule also includes multiple groups."}, {"text": "Both are true experiments", "why": "The chapter uses random assignment to distinguish true experiments."}]}, {"chapter": 2, "set": "B", "topic": "Missing design information", "pages": [18], "prompt": "A proposal says only that it compares multiple groups. What additional information is needed to distinguish true experimental from quasi-experimental under the slide’s rule?", "explanation": "Multiple groups alone do not establish whether random assignment was used.", "id": "B-C2-02", "type": "mcq", "answer": 0, "choices": [{"text": "Whether participants are randomly assigned to groups", "why": ""}, {"text": "Whether measurement occurs in one wave or several", "why": "With multiple groups already specified, the unresolved true-versus-quasi distinction still depends on random assignment."}, {"text": "Whether there are exactly two groups or more than two", "why": "Both arrangements involve multiple groups; their number does not establish random assignment."}, {"text": "Whether the title calls the study experimental", "why": "The slide classifies by the assignment procedure, not by the title chosen by the researcher."}]}, {"chapter": 2, "set": "B", "topic": "Selection versus assignment", "pages": [21], "prompt": "Every population member had an equal chance to enter a study, but the proposal says nothing about allocation to groups. What can be concluded from that information alone?", "explanation": "The recruitment information establishes random selection, but not how participants are assigned to groups.", "id": "B-C2-03", "type": "mcq", "answer": 0, "choices": [{"text": "Random selection is described; random assignment remains unspecified", "why": ""}, {"text": "Both random selection and random assignment are established", "why": "Group allocation is not described."}, {"text": "Random assignment is established but selection is unspecified", "why": "This reverses what the information concerns."}, {"text": "Neither process is described", "why": "Equal population-member chances describe random selection."}]}, {"chapter": 2, "set": "B", "topic": "Allocation recommendation", "pages": [21, 31], "prompt": "A supervisor asks how to assign enrolled participants to groups using the method identified as most effective in the Test Yourself box. Which proposal fits both that answer and the chapter’s definition?", "explanation": "The image answer key gives random assignment; the definition gives each participant an equal chance of assignment to any group.", "id": "B-C2-04", "type": "mcq", "answer": 0, "choices": [{"text": "Use random assignment, giving each participant an equal chance of entering any group", "why": ""}, {"text": "Let each participant choose the preferred group", "why": "Preference-based choice is not the defined random assignment procedure."}, {"text": "Put all early arrivals into one group", "why": "Arrival order does not implement the stated equal-chance allocation."}, {"text": "Give every population member a chance to participate, leaving group allocation unchanged", "why": "That addresses random selection rather than the requested assignment."}]}, {"chapter": 2, "set": "B", "topic": "Independent-variable example", "pages": [16], "prompt": "A student infers from the psychotherapy example that every independent variable must always have exactly two levels. Which response is best supported by the slide?", "explanation": "The slide specifies present/absent levels for its psychotherapy example; that example does not establish a universal number of levels.", "id": "B-C2-05", "type": "mcq", "answer": 0, "choices": [{"text": "The example has two levels, but it does not establish that universal rule", "why": ""}, {"text": "The inference is established for all possible independent variables", "why": "The example alone does not support that universal claim."}, {"text": "The example actually describes three psychotherapy levels", "why": "The stated example has present and absent levels."}, {"text": "The number of levels makes psychotherapy the dependent variable", "why": "The slide identifies psychotherapy as the manipulated independent variable."}]}, {"chapter": 2, "set": "B", "topic": "Variable role versus value type", "pages": [16, 17], "prompt": "A proposal identifies a depression outcome as its dependent variable but does not say how values will be recorded. Can that label alone establish whether the recorded variable is categorical or continuous?", "explanation": "Dependent describes the outcome’s role; categorical versus continuous concerns the values it can take.", "id": "B-C2-06", "type": "mcq", "answer": 0, "choices": [{"text": "No; the recording format or possible values are still needed", "why": ""}, {"text": "Yes; every dependent variable is continuous", "why": "The slides do not equate outcome role with continuous values."}, {"text": "Yes; every dependent variable is categorical", "why": "The slides do not equate outcome role with categories."}, {"text": "Yes; dependent means that the value is constant", "why": "A dependent variable is an outcome variable, not a constant."}]}, {"chapter": 2, "set": "B", "topic": "Categorical-variable example", "pages": [17], "prompt": "In the slide’s example, a variable is recorded using the specified labels “male” and “female.” Why is that recorded variable classified as categorical?", "explanation": "The slide’s classification concerns its specified set of allowable category values.", "id": "B-C2-07", "type": "mcq", "answer": 0, "choices": [{"text": "Its recorded values are specific categories within a defined range", "why": ""}, {"text": "Its recorded values necessarily form a numerical continuum", "why": "The example uses categories, not the continuous pattern described."}, {"text": "All participants must have the same recorded value", "why": "Categorical does not mean constant."}, {"text": "Every category must be an experimental treatment", "why": "Categorical classification does not require treatment manipulation."}]}, {"chapter": 2, "set": "B", "topic": "Choosing statistical tests", "pages": [17], "prompt": "A student chooses a particular statistical test solely from the fact that a variable is continuous, claiming that no other information can matter. Which correction reflects the slide?", "explanation": "The slide says test selection is determined in part by whether variables are categorical or continuous.", "id": "B-C2-08", "type": "mcq", "answer": 0, "choices": [{"text": "Variable type is one consideration, not a complete test-selection rule", "why": ""}, {"text": "Variable type is explicitly irrelevant", "why": "The slide says it partly determines the choice."}, {"text": "The slide gives a unique test for every continuous variable", "why": "No such complete mapping is provided."}, {"text": "Continuous variables cannot be analyzed statistically", "why": "The slide discusses their role in selecting statistical tests."}]}, {"chapter": 2, "set": "B", "topic": "Nonphysical variables", "pages": [16], "prompt": "A student admits height and weight as variables but excludes attitude and IQ because they are not physical dimensions. Which response follows the slide?", "explanation": "Attitude and IQ are explicitly listed alongside height and weight as variables.", "id": "B-C2-09", "type": "mcq", "answer": 0, "choices": [{"text": "Attitude and IQ are also listed examples of variables", "why": ""}, {"text": "Only height and weight appear in the examples", "why": "The slide also names attitude and IQ."}, {"text": "Attitude and IQ must be constants in every study", "why": "They are listed as variables, not universal constants."}, {"text": "A variable must always be a directly manipulated physical quantity", "why": "The general definition is broader than manipulated physical quantities."}]}, {"chapter": 2, "set": "B", "topic": "Alternate relationship hypothesis", "pages": [14], "prompt": "A study concerns the relationship between two variables rather than a difference between groups. Which statement fits the chapter’s alternate hypothesis for this kind of study?", "explanation": "The alternate hypothesis can state a relationship between variables as well as a difference between groups.", "id": "B-C2-10", "type": "mcq", "answer": 0, "choices": [{"text": "The two variables are related", "why": ""}, {"text": "The two variables have no relationship", "why": "That is the null form for a relationship question."}, {"text": "A relationship study cannot have an alternate hypothesis", "why": "The slide explicitly includes variable relationships."}, {"text": "Both variables must have the same value for every participant", "why": "An alternate relationship hypothesis does not require identical constant values."}]}, {"chapter": 2, "set": "B", "topic": "Testing a hypothesis", "pages": [24], "prompt": "After analysis, a researcher finds that the observed facts conflict with the hypothesis being tested. Under the chapter’s account, which response is appropriate?", "explanation": "The chapter describes testing whether the facts support or contradict a hypothesis and accepting or rejecting it accordingly.", "id": "B-C2-11", "type": "mcq", "answer": 0, "choices": [{"text": "Reject the hypothesis on the basis of the contrary evidence", "why": ""}, {"text": "Accept it solely because it was written before data collection", "why": "Prior formulation does not override contrary facts."}, {"text": "Discard the facts solely to preserve the hypothesis", "why": "Testing evaluates the hypothesis against the facts."}, {"text": "Declare it untestable because a test produced contrary evidence", "why": "Obtaining contrary evidence does not make the statement untestable."}]}, {"chapter": 2, "set": "B", "topic": "Two hypothesis classifications", "pages": [14, 15], "prompt": "“The two teaching methods will produce different mean scores,” with no predicted ordering, receives which combined classification?", "explanation": "A predicted difference is alternate; leaving its direction unspecified makes it nondirectional.", "id": "B-C2-12", "type": "mcq", "answer": 0, "choices": [{"text": "Alternate and nondirectional", "why": ""}, {"text": "Null and nondirectional", "why": "The statement predicts a difference, not the null’s absence of difference."}, {"text": "Alternate and directional", "why": "It does not specify which method will score higher."}, {"text": "Null and directional", "why": "It predicts a difference but does not specify its direction."}]}, {"chapter": 2, "set": "B", "topic": "Direction is not improvement", "pages": [15], "prompt": "A researcher predicts that a new approach will produce lower scores than the existing approach. How should the hypothesis be classified on the directional/nondirectional distinction?", "explanation": "A predicted lower score specifies how groups will differ; direction need not be an improvement.", "id": "B-C2-13", "type": "mcq", "answer": 0, "choices": [{"text": "Directional, because the expected ordering is specified", "why": ""}, {"text": "Nondirectional, because the outcome is worse", "why": "“Lower” supplies a direction regardless of whether it is desirable."}, {"text": "Null, because the prediction is unfavorable", "why": "An unfavorable predicted difference is still a difference."}, {"text": "Unclassifiable, because only “higher” can express direction", "why": "The slide includes comparisons such as greater/less and better/worse."}]}, {"chapter": 2, "set": "B", "topic": "Belief and direction", "pages": [15], "prompt": "A researcher believes Group A will score higher than Group B but admits the evidence may prove otherwise. Does that uncertainty remove the direction from the hypothesis?", "explanation": "The slide defines direction through a belief about how groups differ, not certainty that the prediction will succeed.", "id": "B-C2-14", "type": "mcq", "answer": 0, "choices": [{"text": "No; the predicted higher score still specifies direction", "why": ""}, {"text": "Yes; direction requires certainty of the eventual result", "why": "The slide refers to belief, not guaranteed results."}, {"text": "Yes; any uncertainty changes a prediction into a null hypothesis", "why": "Uncertainty is not the same as predicting no difference."}, {"text": "No; because all hypotheses are directional", "why": "Nondirectional hypotheses are also explicitly described."}]}, {"chapter": 2, "set": "B", "topic": "Working hypotheses", "pages": [12], "prompt": "Before collecting data, a researcher writes a tentative assumption whose logical or empirical consequences will be tested. What has been formulated?", "explanation": "This is the definition of a working hypothesis.", "id": "B-C2-15", "type": "mcq", "answer": 0, "choices": [{"text": "A working hypothesis", "why": ""}, {"text": "An already established final finding", "why": "A tentative assumption awaiting testing is not a final finding."}, {"text": "A guarantee that the predicted result will occur", "why": "The assumption is subject to testing, not guaranteed."}, {"text": "A statement exempt from logical and empirical examination", "why": "The definition explicitly anticipates that examination."}]}, {"chapter": 2, "set": "B", "topic": "Scope of a working hypothesis", "pages": [12], "prompt": "A working hypothesis expands to cover many issues outside the current investigation. Which revision most directly follows the slide’s advice?", "explanation": "Working hypotheses should be very specific and limited to the research at hand.", "id": "B-C2-16", "type": "mcq", "answer": 0, "choices": [{"text": "Make it specific and limit it to the research at hand", "why": ""}, {"text": "Make it cover every possible research topic", "why": "That moves away from the advised limitation."}, {"text": "Remove any prediction so that nothing can be tested", "why": "The slide says hypotheses should predict and be open to testing."}, {"text": "Keep expanding its scope because working hypotheses cannot delimit research", "why": "The slide assigns them a delimiting role."}]}, {"chapter": 2, "set": "B", "topic": "From review to hypotheses", "pages": [12], "prompt": "A researcher has completed the extensive literature survey described in the chapter. What does the working-hypothesis section recommend doing now?", "explanation": "It says that after extensive literature survey the researcher should state the working hypotheses in clear terms.", "id": "B-C2-17", "type": "mcq", "answer": 0, "choices": [{"text": "State the working hypotheses clearly", "why": ""}, {"text": "Replace the hypotheses with final conclusions before collecting evidence", "why": "The recommended step is formulation, not premature conclusion."}, {"text": "Avoid expressing the assumptions until all findings are known", "why": "The section recommends stating working hypotheses at this stage."}, {"text": "Treat the literature survey itself as proof of every proposed prediction", "why": "The working hypotheses remain subject to testing."}]}, {"chapter": 2, "set": "B", "topic": "Report end matter", "pages": [28], "prompt": "A draft mixes technical appendices, a list of consulted sources, and an index into its
