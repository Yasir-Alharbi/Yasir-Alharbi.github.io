{"text": "A characteristic that remains constant across groups", "why": "This is the opposite of the definition — a variable takes on different values."}, {"text": "The outcome measure compared between two groups", "why": "The “one outcome measure” wording belongs to the definition of experimental research, not of a variable."}]}, {"chapter": 1, "set": "B", "topic": "Correlational research", "pages": [8, 9], "prompt": "According to the chapter, if a correlation between two variables is strong enough, knowing about one variable allows a researcher to:", "explanation": "The chapter’s note states: “If a correlation between two variables is strong enough, knowing about one variable allows a researcher to make a prediction about the other variable.”", "id": "B-C1-05", "type": "mcq", "answer": 0, "choices": [{"text": "Make a prediction about the other variable", "why": ""}, {"text": "Conclude that one variable caused the other", "why": "The chapter explicitly warns the opposite: in a correlational study, a strong relationship does not permit a causal conclusion."}, {"text": "Reject the null hypothesis without statistical analysis", "why": "Rejecting the null hypothesis is described as a decision made with the assistance of statistics, under Analyses."}, {"text": "Generalize the finding to any population", "why": "Generalizability is discussed under Replication, not correlation strength."}]}, {"chapter": 1, "set": "B", "topic": "Correlational research", "pages": [8, 9], "prompt": "A researcher finds that GPAs decrease as SAT scores increase. According to the chapter, this is an example of:", "explanation": "The chapter uses this exact example: “if GPAs decrease as SAT scores increase, there is a negative correlation between SAT scores and GPAs.” In a negative (inverse) correlation the variables change in opposite directions.", "id": "B-C1-06", "type": "mcq", "answer": 0, "choices": [{"text": "A negative (inverse) correlation", "why": ""}, {"text": "A positive correlation", "why": "Positive correlation is defined as both variables changing in the same direction (either increase or decrease)."}, {"text": "No correlation", "why": "The variables clearly change together, just in opposite directions — that is a correlation, not its absence."}, {"text": "An experimental effect", "why": "No groups are being compared and no causation is being tested, so this is not experimental research."}]}, {"chapter": 1, "set": "B", "topic": "Scientific method — definitions", "pages": [30], "prompt": "According to the chapter, scientists define key concepts and terms in the context of their research studies by using:", "explanation": "The chapter’s Test Yourself item states that scientists define key concepts and terms in the context of their research studies by using operational definitions.", "id": "B-C1-07", "type": "mcq", "answer": 0, "choices": [{"text": "Operational definitions", "why": ""}, {"text": "Conceptual definitions", "why": "“Conceptual” in this chapter labels a type of research (related to abstract ideas or theory), not a kind of definition."}, {"text": "Empirical definitions", "why": "“Empirical” names the evidence-based approach relying on direct observation and experimentation."}, {"text": "Analytical definitions", "why": ""}]}, {"chapter": 1, "set": "B", "topic": "Experimental research", "pages": [10], "prompt": "The chapter defines experimental research as comparing two groups on one outcome measure in order to test a hypothesis regarding:", "explanation": "The chapter states: “Experimental research: involves comparing two groups on one outcome measure to test some hypothesis regarding causation.”", "id": "B-C1-08", "type": "mcq", "answer": 0, "choices": [{"text": "Causation", "why": ""}, {"text": "Correlation", "why": "Determining whether variables are related is the goal of correlational research, not experimental research."}, {"text": "Description", "why": "Description of the state of affairs as it exists at present is the purpose of descriptive research."}, {"text": "Generalization", "why": "Generalization is associated with fundamental research and with replication, not with the definition of an experiment."}]}, {"chapter": 1, "set": "B", "topic": "Scientific method — characteristics", "pages": [18], "prompt": "Which of the following is NOT listed in the chapter among the characteristics of the scientific method?", "explanation": "The chapter lists eight characteristics: empirical approach, observations, questions, hypotheses, experiments, analyses, conclusions, and replication. Generalization is not one of them. The word appears elsewhere in the chapter — as the concern of fundamental research, and as one purpose served by replication — but it is not itself a characteristic of the scientific method.", "id": "B-C1-09", "type": "mcq", "answer": 0, "choices": [{"text": "Generalization", "why": ""}, {"text": "Replication", "why": "Replication is listed, and the chapter calls it one of the most important elements of the scientific method."}, {"text": "Analyses", "why": "Analyses is listed; the chapter devotes a slide to the use of statistical techniques."}, {"text": "Questions", "why": "Questions is listed; the chapter describes translating a research idea into an answerable question."}]}, {"chapter": 1, "set": "B", "topic": "Experimental research", "pages": [10], "prompt": "In that same example, why would the two groups be treated exactly the same apart from the medication they receive?", "explanation": "The chapter states: “Besides receiving different medications, the groups would be treated exactly the same so that the research could isolate the effects of the medications.”", "id": "B-C1-10", "type": "mcq", "answer": 0, "choices": [{"text": "So that the researcher could isolate the effects of the medications", "why": ""}, {"text": "So that participants would not know which group they were in", "why": "Blinding of participants is not discussed in the chapter."}, {"text": "So that the study could be replicated by other researchers", "why": "Replication is defined separately as repeating the study with another group of participants, and is not the reason given here."}, {"text": "So that the sample would be representative of the population", "why": "Representativeness of the sample is not the reason given in the chapter for equal treatment of groups."}]}, {"chapter": 1, "set": "B", "topic": "Descriptive vs. Analytical", "pages": [11], "prompt": "Which statement best captures the main characteristic of descriptive research as described in the chapter?", "explanation": "The chapter’s note reads: “The main characteristic of this method is that the researcher has no control over the variables; he can only report what has happened or what is happening.”", "id": "B-C1-11", "type": "mcq", "answer": 0, "choices": [{"text": "The researcher has no control over the variables and can only report what has happened or is happening", "why": ""}, {"text": "The researcher formulates a theory and then tests it statistically", "why": "Formulating a theory is associated with fundamental research, not descriptive research."}, {"text": "The researcher critically evaluates information that is already available", "why": "Critically evaluating already-available material is the definition of analytical research."}, {"text": "The researcher randomly assigns participants to groups before measuring an outcome", "why": "Random assignment to groups belongs to the experimental research example."}]}, {"chapter": 1, "set": "B", "topic": "Descriptive vs. Analytical", "pages": [11], "prompt": "A government agency runs a nationwide survey documenting the current state of household internet access. It manipulates nothing and reports what exists at present. According to the chapter, this is:", "explanation": "Descriptive research “includes surveys and fact-finding enquiries of different kinds,” its major purpose being “description of the state of affairs as it exists at present,” and the researcher “has no control over the variables.” The chapter also states that the methods utilized in descriptive research are survey methods of all kinds, including comparative and correlational methods.", "id": "B-C1-12", "type": "mcq", "answer": 0, "choices": [{"text": "Descriptive research", "why": ""}, {"text": "Analytical research", "why": "Analytical research uses facts or information already available and critically evaluates them; here fresh survey data are being collected."}, {"text": "Experimental research", "why": "Experimental research compares two groups on one outcome measure to test a hypothesis regarding causation; no groups are being compared here."}, {"text": "Conceptual research", "why": "Conceptual research relates to abstract ideas or theory and is generally used by philosophers and thinkers."}]}, {"chapter": 1, "set": "B", "topic": "Descriptive vs. Analytical", "pages": [11], "prompt": "A researcher gathers government statistics that were already collected and critically evaluates them to reach an assessment. According to the chapter, this is:", "explanation": "The chapter defines analytical research as research in which “the researcher has to use facts or information already available, and analyze these to make a critical evaluation of the material.”", "id": "B-C1-13", "type": "mcq", "answer": 0, "choices": [{"text": "Analytical research", "why": ""}, {"text": "Descriptive research", "why": "Descriptive research describes the state of affairs as it exists at present, typically through surveys and fact-finding enquiries."}, {"text": "Applied research", "why": "Applied research is defined by its aim — solving an immediate problem — not by the use of pre-existing data."}, {"text": "Empirical research", "why": "Empirical research relies on direct observation and experimentation to acquire new knowledge, not on already-available facts."}]}, {"chapter": 1, "set": "B", "topic": "Applied vs. Fundamental", "pages": [12], "prompt": "Research aimed at reaching a solution for a concrete social or business problem facing an organization is classified in the chapter as:", "explanation": "The chapter defines applied research as research that “aims at finding a solution for an immediate problem facing a society or an industrial/business organization.”", "id": "B-C1-14", "type": "mcq", "answer": 0, "choices": [{"text": "Applied research", "why": ""}, {"text": "Fundamental research", "why": "Fundamental research is concerned with generalizations and with the formulation of a theory."}, {"text": "Conceptual research", "why": "Conceptual research relates to abstract ideas or theory and is used by philosophers and thinkers."}, {"text": "Pure research", "why": "‘Pure’ is given in the chapter as another name for fundamental/basic research — the opposite of applied."}]}, {"chapter": 1, "set": "B", "topic": "Scientific method — sequence", "pages": [21, 24], "prompt": "According to the chapter, after articulating the hypothesis, the next step in the research process involves:", "explanation": "The chapter states: “After articulating the hypothesis, the next step involves actually conducting the experiment or research study,” and notes that a key aspect of this is measuring the phenomenon of interest in an accurate and reliable manner.", "id": "B-C1-15", "type": "mcq", "answer": 0, "choices": [{"text": "Actually conducting the experiment or research study", "why": ""}, {"text": "Translating the research idea into an answerable question", "why": "That step comes before the hypothesis: the chapter places it right after getting a research idea."}, {"text": "Analyzing the data using statistical techniques", "why": "Analysis comes after the study has been conducted and the data gathered."}, {"text": "Deciding whether the null hypothesis should be rejected", "why": "That decision is made during the Analyses stage, once data exist — not immediately after the hypothesis is stated."}]}, {"chapter": 1, "set": "B", "topic": "Quantitative vs. Qualitative", "pages": [13], "prompt": "A researcher interviews twelve managers in depth and reports recurring themes, making no attempt to summarize the findings statistically. According to the chapter, what makes this qualitative rather than quantitative research?", "explanation": "The chapter draws the line precisely here: qualitative research “involves studies that do not attempt to quantify their results through statistical summary or analysis,” typically using interviews and observations without formal measurement. Quantitative research, by contrast, is defined by formal and systematic measurement and the use of statistics.", "id": "B-C1-16", "type": "mcq", "answer": 0, "choices": [{"text": "That it does not attempt to quantify its results through statistical summary or analysis", "why": ""}, {"text": "The small number of participants involved", "why": "Sample size is not the chapter’s criterion. The distinction rests on whether results are quantified statistically — which is why a case study of a single person counts as qualitative by its nature, not by its size."}, {"text": "That it was carried out before any hypothesis was formed", "why": "The chapter notes qualitative research is often a source of hypotheses for later quantitative testing, but timing is not what defines it."}, {"text": "That it relies on direct observation rather than experimentation", "why": "Direct observation and experimentation define the empirical approach, which the chapter calls the guiding principle behind all research conducted in accordance with the scientific method — so it cannot be what separates qualitative from quantitative."}]}, {"chapter": 1, "set": "B", "topic": "Quantitative vs. Qualitative", "pages": [13], "prompt": "The chapter describes a case study as an in-depth examination of one person, and classifies it as a form of:", "explanation": "The chapter states: “A case study, which is an in-depth examination of one person, is a form of qualitative research.”", "id": "B-C1-17", "type": "mcq", "answer": 0, "choices": [{"text": "Qualitative research", "why": ""}, {"text": "Experimental research", "why": "Experimental research compares two groups to test causation — the opposite of examining one person in depth."}, {"text": "Analytical research", "why": "Analytical research critically evaluates already-available facts; the chapter does not place the case study there."}, {"text": "Conceptual research", "why": "Conceptual research deals with abstract ideas or theory, not with in-depth examination of a person."}]}, {"chapter": 1, "set": "B", "topic": "Quantitative vs. Qualitative", "pages": [13], "prompt": "According to the chapter, qualitative research is often used as:", "explanation": "The chapter’s note reads: “Qualitative research is often used as a source of hypotheses for later testing in quantitative research.”", "id": "B-C1-18", "type": "mcq", "answer": 0, "choices": [{"text": "A source of hypotheses for later testing in quantitative research", "why": ""}, {"text": "A way of confirming results already obtained statistically", "why": "The chapter puts qualitative research before quantitative testing, as a source of hypotheses — not as a confirmation step after it."}, {"text": "A replacement for statistical analysis in large samples", "why": "The chapter does not present qualitative research as a replacement for statistics in large samples."}, {"text": "A method for establishing causation between two variables", "why": "Testing hypotheses regarding causation is the stated purpose of experimental research."}]}, {"chapter": 1, "set": "B", "topic": "Conceptual vs. Empirical", "pages": [14], "prompt": "The chapter states that conceptual research is generally used by:", "explanation": "The chapter states: conceptual research “is generally used by philosophers and thinkers to develop new concepts or to reinterpret existing ones.”", "id": "B-C1-19", "type": "mcq", "answer": 0, "choices": [{"text": "Philosophers and thinkers, to develop new concepts or reinterpret existing ones", "why": ""}, {"text": "Social scientists, to study social relationships", "why": "Social scientists are mentioned under the significance of research (studying social relationships), not as the users of conceptual research."}, {"text": "Analysts and intellectuals, to generalize new theories", "why": "Analysts and intellectuals appear under significance of research (generalisations of new theories) — a close but different statement."}, {"text": "Business organizations, to solve immediate operational problems", "why": "Solving an immediate organizational problem is the aim of applied research."}]}, {"chapter": 1, "set": "B", "topic": "Conceptual vs. Empirical", "pages": [14], "prompt": "How does the chapter characterize the empirical approach, with its emphasis on direct, systematic and careful observation?", "explanation": "The chapter’s note reads: the empirical approach “is best thought of as the guiding principle behind all research conducted in accordance with the scientific method.”", "id": "B-C1-20", "type": "mcq", "answer": 0, "choices": [{"text": "As the guiding principle behind all research conducted in accordance with the scientific method", "why": ""}, {"text": "As one optional technique among several in quantitative research", "why": "The chapter elevates it well beyond an optional technique — it calls it the guiding principle behind all such research."}, {"text": "As the defining feature of qualitative research", "why": "Qualitative research is defined by not quantifying results statistically, not by the empirical approach."}, {"text": "As a method used mainly in descriptive surveys", "why": "Descriptive research is associated with survey methods; the empirical approach is not restricted to it."}]}, {"chapter": 1, "set": "B", "topic": "Significance of research", "pages": [15, 16], "prompt": "According to the chapter, for philosophers and thinkers, research may mean:", "explanation": "The chapter states: “For philosophers and thinkers, research may mean the outlet for new ideas and insights.”", "id": "B-C1-21", "type": "mcq", "answer": 0, "choices": [{"text": "The outlet for new ideas and insights", "why": ""}, {"text": "A way to attain a high position in the social structure", "why": "Attaining a high position in the social structure is what research may mean for master’s and PhD students."}, {"text": "The generalisations of new theories", "why": "Generalisations of new theories is what research may mean for analysts and intellectuals."}, {"text": "The basis for government economic policy", "why": "Providing the basis for government policies is listed as a general significance point, not as what research means to philosophers."}]}, {"chapter": 1, "set": "B", "topic": "Methods vs. Methodology", "pages": [17], "prompt": "Which description matches research methodology as defined in the chapter?", "explanation": "The chapter defines research methodology as “a way to systematically solve the research problem… a science of studying how research is done scientifically.”", "id": "B-C1-22", "type": "mcq", "answer": 0, "choices": [{"text": "A science of studying how research is done scientifically", "why": ""}, {"text": "All those methods and techniques used for the conduction of research", "why": "This is the chapter’s definition of research methods, not methodology."}, {"text": "The methods researchers use in performing research operations", "why": "This too is part of the definition of research methods — the methods used in performing research operations."}, {"text": "The statistical techniques used to analyze gathered data", "why": "Statistical techniques are discussed under Analyses in the scientific method, not as the definition of methodology."}]}, {"chapter": 1, "set": "B", "topic": "Methods vs. Methodology", "pages": [17], "prompt": "Which term does the chapter define as referring to “the various steps that are generally adopted by a researcher in studying his research problem along with the logic behind them”?", "explanation": "That phrase, including “along with the logic behind them,” is part of the chapter’s definition of research methodology.", "id": "B-C1-23", "type": "mcq", "answer": 0, "choices": [{"text": "Research methodology", "why": ""}, {"text": "Research methods", "why": "Research methods are defined as the methods/techniques used in performing research operations — without the ‘logic behind them’ clause."}, {"text": "The scientific method", "why": "The scientific method is presented through its eight characteristics, not with this definition."}, {"text": "The empirical approach", "why": "The empirical approach is the evidence-based reliance on direct observation and experimentation."}]}, {"chapter": 1, "set": "B", "topic": "Scientific method — Observations", "pages": [20], "prompt": "The chapter says that, in scientific research, observation refers to two distinct concepts. These are:", "explanation": "The chapter states: “observation refers to two distinct concepts—being aware of the world around us and making careful measurements.”", "id": "B-C1-24", "type": "mcq", "answer": 0, "choices": [{"text": "Being aware of the world around us, and making careful measurements", "why": ""}, {"text": "Measuring accurately and measuring consistently", "why": "Accuracy (correct) and reliability (consistent) are the two measurement concepts — a different pair, discussed under Experiments."}, {"text": "Describing the present state of affairs, and predicting future events", "why": "Description and prediction are two of the three general goals of scientific research, not the two senses of observation."}, {"text": "Collecting data, and evaluating data", "why": "Collecting and evaluating data appear in the definition of research, not in the definition of observation."}]}, {"chapter": 1, "set": "B", "topic": "Hypotheses", "pages": [22, 23], "prompt": "The chapter defines a hypothesis as:", "explanation": "The chapter states: “Hypothesis: is simply an educated and testable guess about the answer to your research question” — often described as the researcher’s attempt to explain the phenomenon of interest.", "id": "B-C1-25", "type": "mcq", "answer": 0, "choices": [{"text": "An educated and testable guess about the answer to your research question", "why": ""}, {"text": "A statement of the problem that the research intends to solve", "why": "Defining and redefining problems is listed as part of what research comprises, not as the definition of a hypothesis."}, {"text": "A conclusion drawn after the data have been analyzed", "why": "Conclusions come after analysis; the hypothesis is formulated before the study is conducted."}, {"text": "A prediction that has already been supported by data", "why": "A hypothesis is tested and may be either supported or refuted; it is not already supported."}]}, {"chapter": 1, "set": "B", "topic": "Hypotheses", "pages": [22, 23], "prompt": "According to the chapter, what is a key feature of all hypotheses?", "explanation": "The chapter states: “A key feature of all hypotheses is that each must make a prediction” about the variables being studied.", "id": "B-C1-26", "type": "mcq", "answer": 0, "choices": [{"text": "Each must make a prediction", "why": ""}, {"text": "Each must be stated in the null form", "why": "The chapter describes two types — null and alternate — so the null form is not required of all hypotheses."}, {"text": "Each must involve at least two groups", "why": "Hypotheses “can take various forms, depending on the question being asked and the type of study”; two groups are not required of all of them."}, {"text": "Each must be derived from a qualitative study", "why": "Qualitative research is often a source of hypotheses, but the chapter does not require every hypothesis to come from one."}]}, {"chapter": 1, "set": "B", "topic": "Accuracy vs. Reliability", "pages": [25, 26], "prompt": "A dart thrower throws every dart into the same spot, but that spot is not the bull’s eye. Using the chapter’s analogy, this demonstrates:", "explanation": "The chapter uses this exact case: throwing all darts in the same spot “demonstrates high reliability”, but if that spot is not the bull’s eye it “demonstrates low accuracy.” Reliability is consistency; accuracy is correctness.", "id": "B-C1-27", "type": "mcq", "answer": 0, "choices": [{"text": "High reliability but low accuracy", "why": ""}, {"text": "High accuracy but low reliability", "why": "This reverses the two terms: hitting the same spot is consistency (reliability), and missing the bull’s eye is a failure of correctness (accuracy)."}, {"text": "Low accuracy and low reliability", "why": "Hitting the same spot every time is precisely what the chapter calls high reliability, so reliability is not low here."}, {"text": "High accuracy and high reliability", "why": "Missing the bull’s eye means the measurement is not correct, so accuracy is not high."}]}, {"chapter": 1, "set": "B", "topic": "Scientific method — Analyses", "pages": [27], "prompt": "The chapter says the type of statistical techniques a researcher uses depends on:", "explanation": "The chapter states the type of statistical techniques used “depends on the design of the study, the type of data being gathered, and the questions being asked.”", "id": "B-C1-28", "type": "mcq", "answer": 0, "choices": [{"text": "The design of the study, the type of data being gathered, and the questions being asked", "why": ""}, {"text": "The number of participants and the funding available", "why": "Sample size and funding are not mentioned among the determining factors in the chapter."}, {"text": "Whether the research is applied or fundamental", "why": "The applied/fundamental distinction concerns the aim of the research, and is not given as a determinant of statistical technique."}, {"text": "Whether the hypothesis is null or alternate", "why": "The null/alternate distinction concerns what a hypothesis predicts; the decision about the null comes after the technique is chosen."}]}, {"chapter": 1, "set": "B", "topic": "Scientific method — Analyses", "pages": [27], "prompt": "According to the chapter, a key decision that researchers must make with the assistance of statistics is:", "explanation": "The chapter states: “A key decision that researchers must make with the assistance of statistics is whether the null hypothesis should be rejected.”", "id": "B-C1-29", "type": "mcq", "answer": 0, "choices": [{"text": "Whether the null hypothesis should be rejected", "why": ""}, {"text": "Which research design to adopt", "why": "The design is settled before data are gathered; the chapter instead says the design determines which statistical techniques are used."}, {"text": "Whether the study should be replicated", "why": "Replication is a separate characteristic of the scientific method, not the statistical decision named here."}, {"text": "How the results should be disseminated", "why": "Dissemination of results is mentioned among the purposes of the course, not as the statistical decision."}]}, {"chapter": 1, "set": "B", "topic": "Replication", "pages": [29], "prompt": "Which statement matches the chapter’s definition of replication?", "explanation": "The chapter defines replication as “conducting the same research study once again with another group of participants to see whether the same results are obtained,” and calls it one of the most important elements of the scientific method.", "id": "B-C1-30", "type": "mcq", "answer": 0, "choices": [{"text": "Conducting the same research study again with another group of participants to see whether the same results are obtained", "why": ""}, {"text": "Repeating the statistical analysis on the same data using a different technique", "why": "Re-analysing the same data is not what the chapter describes; replication requires a new group of participants."}, {"text": "Confirming the findings by comparing them with previously published research", "why": "Comparison with already-available published material describes analytical research, not replication."}, {"text": "Repeating the measurement on the same participants to check consistency", "why": "Checking consistency of a measurement is reliability; replication requires repeating the whole study with a different group."}]}, {"chapter": 1, "set": "B", "topic": "Descriptive vs. Analytical", "pages": [11], "prompt": "In descriptive research, the researcher is able to control the variables under study.", "explanation": "False. The chapter states the main characteristic of descriptive research is that “the researcher has no control over the variables; he can only report what has happened or what is happening.”", "id": "B-C1-31", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Correlational research", "pages": [8, 9], "prompt": "If a correlational study shows that two things are strongly related, the researcher may conclude that one of them caused the other.", "explanation": "False. The chapter gives this as its example under Conclusions: “if a researcher conducted a correlational study and the results indicated that the two things being studied were strongly related, the researcher could not conclude that one thing caused the other.” Testing causation is the role of experimental research.", "id": "B-C1-32", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Hypotheses", "pages": [22, 23], "prompt": "The alternate (or experimental) hypothesis predicts that there will be a difference between the groups.", "explanation": "True. The chapter contrasts the two: “The null hypothesis always predicts that there will be no differences between the groups being studied. By contrast, the alternate hypothesis predicts that there will be a difference between the groups.”", "id": "B-C1-33", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Accuracy vs. Reliability", "pages": [25, 26], "prompt": "According to the chapter, it is possible for a measurement to be reliable but not accurate.", "explanation": "True. The chapter states: “it is possible for the dart thrower to be reliable, but not accurate” — all darts in the same spot (consistent), but not the bull’s eye (not correct).", "id": "B-C1-34", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Conceptual vs. Empirical", "pages": [14], "prompt": "In this chapter, the empirical approach appears twice: once as one half of a research-type contrast, and once as a characteristic of the scientific method.", "explanation": "True. “Empirical” appears in the typology as Conceptual vs. Empirical, and again as the first of the eight characteristics of the scientific method. Both passages define it identically — an evidence-based approach relying on direct observation and experimentation in the acquisition of new knowledge.", "id": "B-C1-35", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Methods vs. Methodology", "pages": [17], "prompt": "The chapter treats “research methods” and “research methodology” as two names for the same thing.", "explanation": "False. The chapter distinguishes them: research methods are the methods/techniques used in performing research operations, while research methodology is a way to systematically solve the research problem — a science of studying how research is done scientifically, including the logic behind the steps.", "id": "B-C1-36", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Applied vs. Fundamental", "pages": [12], "prompt": "Applied research is mainly concerned with generalizations and with the formulation of a theory.", "explanation": "False. That is the chapter’s description of fundamental research. Applied research aims at finding a solution for an immediate problem facing a society or an industrial/business organization.", "id": "B-C1-37", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Scientific method — characteristics", "pages": [18], "prompt": "The chapter acknowledges that some disagreement exists regarding the exact characteristics of the scientific method.", "explanation": "True. The chapter opens that slide with the hedge: “Although some disagreement exists regarding the exact characteristics of the scientific method, most agree that it is characterized by the following…” The eight characteristics are presented as a consensus, not as a settled definition.", "id": "B-C1-38", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Replication", "pages": [29], "prompt": "Replication is described in the chapter as one of the most important elements of the scientific method.", "explanation": "True. The chapter says of replication: “It is one of the most important elements of the scientific method,” and warns researchers against drawing broad conclusions from a single study, whose results may be an aberration.", "id": "B-C1-39", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Descriptive vs. Analytical", "pages": [11], "prompt": "Analytical research requires the researcher to collect entirely new data through surveys and fact-finding enquiries.", "explanation": "False. In analytical research “the researcher has to use facts or information already available, and analyze these to make a critical evaluation of the material.” Surveys and fact-finding enquiries belong to descriptive research.", "id": "B-C1-40", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Hypotheses", "pages": [22, 23], "prompt": "The null hypothesis always predicts that there will be no differences between the groups being studied.", "explanation": "True. The chapter states this directly, using the word “always”: “The null hypothesis always predicts that there will be no differences between the groups being studied.”", "id": "B-C1-41", "type": "tf", "answer": true}, {"chapter": 1, "set": "B", "topic": "Descriptive vs. Analytical", "pages": [11], "prompt": "In the chapter’s classification, descriptive research and correlational methods are entirely separate, with no overlap between them.", "explanation": "False. The chapter states that “the methods of research utilized in descriptive research are survey methods of all kinds, including comparative and correlational methods.” So correlational methods sit inside the descriptive toolkit, even though Correlational vs. Experimental is listed as its own contrasting pair. The categories in this chapter are not mutually exclusive.", "id": "B-C1-42", "type": "tf", "answer": false}, {"chapter": 1, "set": "B", "topic": "Motivations of research", "pages": [6], "prompt": "Mention the 5 motivations of research listed in the chapter.", "explanation": "These are the five motivations listed on the Motivations of Research slide.", "id": "B-C1-43", "type": "list", "required": 5, "items": ["Desire to get a research degree along with its consequential benefits", "Desire to face the challenge in solving the unsolved problems (concern over practical problems)", "Desire to get intellectual joy of doing some creative work", "Desire to serve the society", "Desire to get respectability"], "matchRules": [[["degree"]], [["challenge", "unsolved", "practical problem"]], [["joy", "creative", "intellectual"]], [["serve", "societ", "society"]], [["respect", "respectability"]]]}, {"chapter": 1, "set": "B", "topic": "Types of research", "pages": [7], "prompt": "List the 5 pairs of research types presented in the chapter’s classification. (One pair per line, e.g. “X vs. Y”.)", "explanation": "The Types of Research slide lists exactly these five contrasting pairs.", "id": "B-C1-44", "type": "list", "required": 5, "items": ["Correlational vs. Experimental", "Descriptive vs. Analytical", "Applied vs. Fundamental (pure / basic)", "Quantitative vs. Qualitative", "Conceptual vs. Empirical"], "matchRules": [[["correlational", "experimental"]], [["descriptive", "analytical"]], [["applied", "fundamental", "basic", "pure"]], [["quantitative", "qualitative"]], [["conceptual", "empirical"]]]}, {"chapter": 1, "set": "B", "topic": "Scientific method — characteristics", "pages": [18], "prompt": "Name the 8 characteristics of the scientific method on which, the chapter says, most agree.", "explanation": "The chapter lists these eight characteristics and then devotes one slide to each.", "id": "B-C1-45", "type": "list", "required": 8, "items": ["Empirical approach", "Observations", "Questions", "Hypotheses", "Experiments", "Analyses", "Conclusions", "Replication"], "matchRules": [[["empirical"]], [["observ", "observations"]], [["question", "questions"]], [["hypothes", "hypotheses"]], [["experiment", "experiments"]], [["analys", "analyses", "analyz"]], [["conclusion", "conclusions"]], [["replicat", "replication"]]]}, {"chapter": 1, "set": "B", "topic": "Correlational research", "pages": [8, 9], "prompt": "State the 2 types of correlation described in the chapter.", "explanation": "The Types of Correlation slide gives positive correlation (same direction) and negative or inverse correlation (opposite directions).", "id": "B-C1-46", "type": "list", "required": 2, "items": ["Positive correlation — both variables change in the same direction", "Negative (inverse) correlation — one variable increases while the other decreases"], "matchRules": [[["positive"]], [["negative", "inverse"]]]}, {"chapter": 1, "set": "B", "topic": "Hypotheses", "pages": [22, 23], "prompt": "Name the 2 types of hypotheses the chapter says you should be familiar with.", "explanation": "The chapter names the null hypothesis and the alternate (or experimental) hypothesis.", "id": "B-C1-47", "type": "list", "required": 2, "items": ["The null hypothesis — predicts no difference between the groups", "The alternate (experimental) hypothesis — predicts a difference between the groups"], "matchRules": [[["null", "nul"]], [["alternate", "alternative", "experimental"]]]}, {"chapter": 1, "set": "B", "topic": "Replication", "pages": [29], "prompt": "Mention the 2 purposes that replication serves, according to the chapter.", "explanation": "The chapter states replication “serves several integral purposes, including establishing the reliability of the research study’s findings and determining whether the same results can be obtained with a different group of participants (generalizable).”", "id": "B-C1-48", "type": "list", "required": 2, "items": ["Establishing the reliability of the research study’s findings", "Determining whether the same results can be obtained with a different group of participants (generalizability)"], "matchRules": [[["reliab", "reliability"]], [["generaliz", "generalizability", "different group", "another group", "other group", "different participant"]]]}, {"chapter": 1, "set": "B", "topic": "Goals of scientific research", "pages": [30], "prompt": "State the 3 general goals of scientific research.", "explanation": "The chapter’s Test Yourself answer key gives the three general goals as description, prediction, and understanding/explaining.", "id": "B-C1-49", "type": "list", "required": 3, "items": ["Description", "Prediction", "Understanding / explaining"], "matchRules": [[["descri", "description"]], [["predict", "prediction"]], [["understand", "understanding", "explain", "explaining"]]]}, {"chapter": 1, "set": "B", "topic": "Significance of research", "pages": [15, 16], "prompt": "Mention the 4 points the chapter gives on the significance of research.", "explanation": "These four points are listed on the Significance of Research slide.", "id": "B-C1-50", "type": "list", "required": 4, "items": ["It inculcates scientific and inductive thinking and promotes the development of logical habits of thinking and organization", "It provides the basis for nearly all government policies in our economic system", "It has special significance in solving operational and planning problems of business and industry", "It is equally important for social scientists in studying social relationships and seeking answers to social problems"], "matchRules": [[["inductive", "logical", "habits", "thinking"]], [["government", "polic", "policies", "economic"]], [["business", "industry", "operational", "planning"]], [["social"]]]}, {"chapter": 2, "set": "B", "topic": "Research design", "pages": [18, 19], "prompt": "A research design does not use random assignment, but it does use multiple waves of measurement. According to the chapter’s classification procedure, this design is:", "explanation": "The chapter’s procedure asks first whether the design involves random assignment. If not, a second question follows: does the design use either multiple groups or multiple waves of measurement? “If the answer is yes, the design is considered quasi-experimental.”", "id": "B-C2-01", "type": "mcq", "answer": 0, "choices": [{"text": "Quasi-experimental", "why": ""}, {"text": "Nonexperimental", "why": "Nonexperimental applies only when the second question is answered no — neither multiple groups nor multiple waves of measurement."}, {"text": "A randomized (true) experimental design", "why": "A randomized or true experimental design requires random assignment, which the stem rules out."}, {"text": "Not classifiable until the number of groups is known", "why": "The second question is satisfied by multiple groups or multiple waves of measurement, so multiple waves alone settles it."}]}, {"chapter": 2, "set": "B", "topic": "Research design", "pages": [18, 19], "prompt": "According to the chapter, which question must be asked first when determining the classification of a particular research design?", "explanation": "The chapter states: “First: does the design involve random assignment to different conditions?” Only if the answer is no is a second question asked, about multiple groups or multiple waves of measurement.", "id": "B-C2-02", "type": "mcq", "answer": 0, "choices": [{"text": "Does the design involve random assignment to different conditions?", "why": ""}, {"text": "Does the design use multiple waves of measurement?", "why": "This belongs to the second question, asked only after random assignment has been ruled out."}, {"text": "Does the design use multiple groups?", "why": "Also part of the second question, not the first."}, {"text": "Is the sample randomly selected from the population of interest?", "why": "Random selection concerns how participants are drawn from the population; the classification procedure turns on random assignment."}]}, {"chapter": 2, "set": "B", "topic": "Random selection vs. assignment", "pages": [21], "prompt": "Which definition matches random selection as given in the chapter?", "explanation": "The chapter defines random selection as “choosing study participants from the population of interest in such a way that each member of the population has an equal probability of being selected to participate in the study.”", "id": "B-C2-03", "type": "mcq", "answer": 0, "choices": [{"text": "Choosing study participants from the population of interest so that each member of the population has an equal probability of being selected", "why": ""}, {"text": "Assigning study participants to groups so that each participant has an equal probability of being assigned to any group", "why": "This is the chapter’s definition of random assignment, which concerns placement into groups within the study."}, {"text": "Choosing which statistical tests to apply without regard to the researcher’s expectations", "why": "The chapter says the choice of statistical tests depends partly on whether variables are categorical or continuous — it is not a random process."}, {"text": "Choosing a research topic without being influenced by the researcher’s field of expertise", "why": "Topic choice is described as necessarily influenced by several factors, the researcher’s field among them."}]}, {"chapter": 2, "set": "B", "topic": "Random selection vs. assignment", "pages": [21], "prompt": "A researcher places each volunteer into either the treatment group or the comparison group so that every volunteer has an equal probability of ending up in either one. According to the chapter, this is:", "explanation": "Random assignment is “assigning study participants to groups within the study in such a way that each participant has an equal probability of being assigned to any of the groups.” The chapter’s Test Yourself box also calls random assignment the most effective method of assigning participants to groups.", "id": "B-C2-04", "type": "mcq", "answer": 0, "choices": [{"text": "Random assignment", "why": ""}, {"text": "Random selection", "why": "Random selection concerns drawing participants from the population into the study, not distributing them among groups once they are in it."}, {"text": "Nondirectional allocation", "why": "‘Nondirectional’ describes a type of hypothesis, not a method of allocation."}, {"text": "Quasi-experimental sampling", "why": "Random assignment is precisely what makes a design a true experiment; quasi-experimental designs are those without random assignment."}]}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "According to the chapter, the independent variable has two levels. They are:", "explanation": "The chapter states: “The independent variable is the factor that is manipulated or controlled by the researcher. It has two levels: present or absent.” In its example, one group is exposed to the psychotherapy and one group is not.", "id": "B-C2-05", "type": "mcq", "answer": 0, "choices": [{"text": "Present and absent", "why": ""}, {"text": "Categorical and continuous", "why": "Categorical and continuous are the chapter’s two kinds of variable, not the two levels of an independent variable."}, {"text": "Directional and nondirectional", "why": "Directional and nondirectional describe hypotheses."}, {"text": "High and low", "why": "The chapter specifies present or absent, not degrees of magnitude."}]}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "A researcher examines the effects of a new medication on symptoms of depression among college students. In this study, symptoms of depression are:", "explanation": "The chapter defines the dependent variable as “a measure of the effect (if any) of the independent variable,” and uses this exact example. The medication is the independent variable — the factor manipulated by the researcher.", "id": "B-C2-06", "type": "mcq", "answer": 0, "choices": [{"text": "The dependent variable, because they measure the effect of the medication", "why": ""}, {"text": "The independent variable, because they are the focus of the study", "why": "The independent variable is the factor manipulated or controlled by the researcher — here, the medication."}, {"text": "A categorical variable, because a student either is or is not depressed", "why": "The chapter illustrates categorical variables with gender (male or female); it does not present depression symptoms that way."}, {"text": "A constant, because every participant is a college student", "why": "A constant is something that cannot vary. Symptoms of depression are measured precisely because they can vary."}]}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "Which of the following does the chapter give as an example of a categorical variable?", "explanation": "The chapter states: “‘Gender’ is a categorical variable because you can either be male or female.” Categorical variables take on specific values only within a defined range of values.", "id": "B-C2-07", "type": "mcq", "answer": 0, "choices": [{"text": "Gender", "why": ""}, {"text": "Age", "why": "Age is the chapter’s lead example of a continuous variable — theoretically, someone can be any age."}, {"text": "Income", "why": "Income is named among the chapter’s continuous variables."}, {"text": "Height", "why": "Height is named among the chapter’s continuous variables."}]}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "Why does the chapter say the distinction between categorical and continuous variables matters?", "explanation": "The chapter’s note makes both points: “continuous variables can be measured with a greater degree of precision,” and “the choice of which statistical tests will be used to analyze the data is partially dependent on whether the researcher uses categorical or continuous variables.”", "id": "B-C2-08", "type": "mcq", "answer": 0, "choices": [{"text": "Because continuous variables can be measured with greater precision, and the choice of statistical tests partly depends on which type is used", "why": ""}, {"text": "Because only continuous variables may serve as dependent variables", "why": "The chapter places no such restriction on dependent variables."}, {"text": "Because categorical variables cannot be analyzed statistically", "why": "The chapter says variable type partly determines which statistical test is chosen — not that categorical variables resist analysis."}, {"text": "Because categorical variables require random assignment whereas continuous variables require random selection", "why": "Neither form of randomization is tied to variable type anywhere in the chapter."}]}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "According to the chapter, if something cannot vary or take on different values, it is referred to as:", "explanation": "The chapter states: “A variable is anything that can take on different values. By contrast, if something cannot vary, or take on different values, then it is referred to as a constant.”", "id": "B-C2-09", "type": "mcq", "answer": 0, "choices": [{"text": "A constant", "why": ""}, {"text": "A categorical variable", "why": "A categorical variable still varies — it simply takes specific values within a defined range, such as male or female."}, {"text": "A nondirectional factor", "why": "‘Nondirectional’ describes a hypothesis, not a non-varying quantity."}, {"text": "A dependent variable", "why": "A dependent variable varies: it is the measure of the effect of the independent variable."}]}, {"chapter": 2, "set": "B", "topic": "Null vs. Alternate hypotheses", "pages": [14], "prompt": "A study does not involve groups of participants; it examines only selected variables. According to the chapter, what does the null hypothesis predict in this case?", "explanation": "The chapter makes this exact qualification: “If… a particular research study does not involve groups of study participants, but instead involves only an examination of selected variables, the null hypothesis predicts that there will be no relationship between the variables being studied.”", "id": "B-C2-10", "type": "mcq", "answer": 0, "choices": [{"text": "That there will be no relationship between the variables being studied", "why": ""}, {"text": "That the study cannot proceed without at least two groups", "why": "The chapter accommodates studies without groups rather than ruling them out."}, {"text": "That there will be no difference between the groups being studied", "why": "This is the standard wording, which applies when the study does involve groups."}, {"text": "That the alternate hypothesis must be tested instead", "why": "The chapter states it is the null hypothesis that is tested, in either case."}]}, {"chapter": 2, "set": "B", "topic": "Null vs. Alternate hypotheses", "pages": [14], "prompt": "According to the chapter, which hypothesis is the one actually tested in scientific research?", "explanation": "The chapter’s note states: “In scientific research, keep in mind that it is the null hypothesis that is tested, and then the null hypothesis is either confirmed or refuted (sometimes phrased as rejected or not rejected).”", "id": "B-C2-11", "type": "mcq", "answer": 0, "choices": [{"text": "The null hypothesis, which is then confirmed or refuted", "why": ""}, {"text": "The alternate hypothesis, which is then accepted or rejected", "why": "The alternate hypothesis predicts a difference or relationship, but the chapter says it is the null that is put to the test."}, {"text": "Whichever of the two is stated in directional form", "why": "Directionality is a separate dimension of hypotheses and does not determine which one is tested."}, {"text": "Both are tested simultaneously and their results compared", "why": "The chapter describes a single hypothesis — the null — being tested."}]}, {"chapter": 2, "set": "B", "topic": "Directional vs. Nondirectional", "pages": [15], "prompt": "According to the chapter, the decision whether to use a directional or a nondirectional hypothesis is based on:", "explanation": "The chapter states the decision “is based on whether the researcher has some idea about how the groups being studied will differ.” Both types assume the groups will differ; only the directional hypothesis specifies how.", "id": "B-C2-12", "type": "mcq", "answer": 0, "choices": [{"text": "Whether the researcher has some idea about how the groups being studied will differ", "why": ""}, {"text": "Whether the study involves groups or only variables", "why": "That distinction governs how the null hypothesis is worded, not directionality."}, {"text": "Whether the researcher expects the null hypothesis to be rejected", "why": "The chapter ties directionality to the expected form of the difference, not to the anticipated outcome of the test."}, {"text": "Whether the variables being studied are categorical or continuous", "why": "Variable type affects the choice of statistical tests, not the directionality of a hypothesis."}]}, {"chapter": 2, "set": "B", "topic": "Directional vs. Nondirectional", "pages": [15], "prompt": "A hypothesis uses comparison terms such as “greater,” “less,” “better” or “worse.” According to the chapter, this makes it:", "explanation": "The chapter’s example states that with such comparison terms “it is directional because it predicts that there will be a difference between the two groups and it specifies how the two groups will differ.”", "id": "B-C2-13", "type": "mcq", "answer": 0, "choices": [{"text": "Directional, because it predicts a difference and specifies how the groups will differ", "why": ""}, {"text": "Nondirectional, because comparison terms do not identify a cause", "why": "Nondirectional hypotheses predict a difference without a belief about how the groups will differ — the opposite of what comparison terms supply."}, {"text": "Falsifiable, which other kinds of hypotheses are not", "why": "The chapter requires all hypotheses to be falsifiable, so falsifiability cannot distinguish this one."}, {"text": "A working hypothesis rather than a research hypothesis", "why": "Directional and nondirectional are presented as the second category of research hypotheses, not as an alternative to working hypotheses."}]}, {"chapter": 2, "set": "B", "topic": "Directional vs. Nondirectional", "pages": [15], "prompt": "A researcher believes two groups will differ on the outcome, but holds no belief about which group will score higher. According to the chapter, the appropriate hypothesis is:", "explanation": "The chapter states: “Researchers use nondirectional hypotheses when they believe that the groups will differ, but they do not have a belief regarding how the groups will differ.”", "id": "B-C2-14", "type": "mcq", "answer": 0, "choices": [{"text": "Nondirectional, because there is no belief regarding how the groups will differ", "why": ""}, {"text": "Directional, because a difference is predicted", "why": "A directional hypothesis requires a belief about how the groups will differ, which the stem rules out."}, {"text": "Null, because no direction is specified", "why": "The null hypothesis predicts no difference at all; here a difference is expected."}, {"text": "Alternate and directional, because two groups are involved", "why": "Predicting a difference does make it alternate rather than null — but without a belief about how, it is nondirectional."}]}, {"chapter": 2, "set": "B", "topic": "Working hypothesis", "pages": [12, 13], "prompt": "The chapter defines a working hypothesis as:", "explanation": "The chapter states: “Working hypothesis is a tentative assumption made in order to draw out and test its logical or empirical consequences.”", "id": "B-C2-15", "type": "mcq", "answer": 0, "choices": [{"text": "A tentative assumption made in order to draw out and test its logical or empirical consequences", "why": ""}, {"text": "A prediction confirmed several times over and now ready to be generalized", "why": "A hypothesis confirmed several times leads to a generalization — that is an outcome, not the definition."}, {"text": "A broad statement of the general area of interest, made before ambiguities are resolved", "why": "That describes the initial broad statement of the research problem, before ambiguities are resolved and feasibility considered."}, {"text": "A brief summary of the topic submitted to the Research Board for approval", "why": "That is the synopsis, written once the problem is formulated and submitted to a Committee or the Research Board."}]}, {"chapter": 2, "set": "B", "topic": "Working hypothesis", "pages": [12, 13], "prompt": "According to the chapter, all hypotheses must be:", "explanation": "The chapter states: “All hypotheses must be falsifiable; hypotheses must be capable of being refuted based on the results of the study.” They must also be specific, limited to the research in hand, and make a prediction.", "id": "B-C2-16", "type": "mcq", "answer": 0, "choices": [{"text": "Falsifiable — capable of being refuted on the basis of the results of the study", "why": ""}, {"text": "Directional, so that the form of the expected difference is specified", "why": "Directional and nondirectional are both legitimate; the choice depends on whether the researcher has an idea how the groups will differ."}, {"text": "Derived from a theory rather than from previous research", "why": "The chapter lists theory as one source of research ideas among several, alongside previous research, problem solving and the researcher’s field."}, {"text": "Stated in both null and alternate form before data collection begins", "why": "The chapter imposes no such requirement."}]}, {"chapter": 2, "set": "B", "topic": "Working hypothesis", "pages": [12, 13], "prompt": "The chapter notes a kind of research in which working hypotheses are not needed. Which does it name?", "explanation": "The chapter’s note reads: “There may be a problem where we do not need working hypotheses, specially in the case of exploratory or formulative researches which do not aim at testing the hypothesis.”", "id": "B-C2-17", "type": "mcq", "answer": 0, "choices": [{"text": "Exploratory or formulative research, which does not aim at testing the hypothesis", "why": ""}, {"text": "Replication studies, because the original hypothesis already exists", "why": "The chapter does not exempt replication studies from having hypotheses."}, {"text": "Nonexperimental research, because no groups are compared", "why": "Nonexperimental is a design category in the chapter, not an exemption from hypotheses."}, {"text": "Research using only continuous variables", "why": "Variable type has no bearing on whether a hypothesis is needed."}]}, {"chapter": 2, "set": "B", "topic": "Working hypothesis", "pages": [12, 13], "prompt": "According to the chapter, what is the role of the hypothesis?", "explanation": "The chapter states: “The role of the hypothesis is to guide the researcher by delimiting the area of research and to keep him on the right track. It also indicates the type of data required and the type of methods of data analysis to be used.”", "id": "B-C2-18", "type": "mcq", "answer": 0, "choices": [{"text": "To guide the researcher by delimiting the area of research, and to indicate the type of data required and the methods of analysis to be used", "why": ""}, {"text": "To summarize the findings for readers in non-technical language", "why": "That describes the Summary of findings section of the research report."}, {"text": "To ensure each member of the population has an equal probability of being selected", "why": "That is random selection."}, {"text": "To state the conceptual structure within which the research will be conducted", "why": "That is the chapter’s description of the research design."}]}, {"chapter": 2, "set": "B", "topic": "Formulating the research problem", "pages": [9, 10], "prompt": "According to the chapter, what is the first and foremost step in the research process?", "explanation": "The chapter states: “The first and foremost step in the research process is selecting and properly defining a research problem.” The researcher must find the problem and formulate it so that it becomes susceptible to research.", "id": "B-C2-19", "type": "mcq", "answer": 0, "choices": [{"text": "Selecting and properly defining a research problem", "why": ""}, {"text": "Reviewing the existing literature in the topic area", "why": "The literature review supports problem formulation, but the chapter gives the problem itself this priority."}, {"text": "Stating the working hypothesis in clear terms", "why": "The working hypothesis is stated after the extensive literature survey."}, {"text": "Deciding how the data will be collected", "why": "Data collection comes much later, after the research design has been prepared."}]}, {"chapter": 2, "set": "B", "topic": "Formulating the research problem", "pages": [9, 10], "prompt": "The chapter says that essentially two steps are involved in formulating the research problem. They are:", "explanation": "The chapter states: “Essentially two steps are involved in formulating the research problem: understanding the problem thoroughly, and rephrasing the same into meaningful terms from an analytical point of view.”", "id": "B-C2-20", "type": "mcq", "answer": 0, "choices": [{"text": "Understanding the problem thoroughly, and rephrasing it into meaningful terms from an analytical point of view", "why": ""}, {"text": "Stating the problem broadly, and then submitting a synopsis to the Research Board", "why": "The synopsis is written once the problem is already formulated, and is compulsory for a researcher writing a thesis."}, {"text": "Reviewing the conceptual literature, and then reviewing the empirical literature", "why": "The researcher must examine both types of literature, but these are not the two steps the chapter names."}, {"text": "Establishing categories, and then applying them to the raw data through coding", "why": "Those are two of the four operations in the analysis of data."}]}, {"chapter": 2, "set": "B", "topic": "Formulating the research problem", "pages": [9, 10], "prompt": "The chapter says the researcher may review two types of literature while formulating the problem. The empirical literature consists of:", "explanation": "The chapter distinguishes them: “the conceptual literature concerning the concepts and theories, and the empirical literature consisting of studies made earlier which are similar to the one proposed.”", "id": "B-C2-21", "type": "mcq", "answer": 0, "choices": [{"text": "Studies made earlier which are similar to the one proposed", "why": ""}, {"text": "Books and journal articles of any kind on the topic", "why": "Too broad: the chapter divides this literature specifically into the conceptual and the empirical."}, {"text": "Abstracting and indexing journals, and published bibliographies", "why": "These are named as the first place to go for the extensive literature survey, not as a type of literature."}, {"text": "The concepts and theories relevant to the problem", "why": "That is the conceptual literature."}]}, {"chapter": 2, "set": "B", "topic": "Literature review", "pages": [7, 8], "prompt": "The chapter distinguishes replicating a study from simply duplicating one. The difference is that:", "explanation": "The chapter’s note states there is a difference “between replicating a study for purposes of establishing the robustness or generalizability of the original findings and simply duplicating a study without having any knowledge that the same study has already been conducted.” This is one reason the literature review matters.", "id": "B-C2-22", "type": "mcq", "answer": 0, "choices": [{"text": "Replication is done to establish the robustness or generalizability of the original findings, while duplication is done without any knowledge that the same study has already been conducted", "why": ""}, {"text": "Replication uses the same participants, while duplication uses a different group", "why": "The chapter draws the distinction by purpose and awareness, not by who the participants are."}, {"text": "Replication is required before publication, while duplication is prohibited", "why": "The chapter states no such publication rule."}, {"text": "Replication applies only to experimental designs, duplication only to nonexperimental ones", "why": "The chapter ties neither term to a particular design category."}]}, {"chapter": 2, "set": "B", "topic": "Preparation of the report", "pages": [26, 27, 28], "prompt": "According to the chapter, the layout of the research report should consist of:", "explanation": "The chapter states: “The layout of the report should be; the preliminary pages; the main text, and the end matter.” The preliminary pages carry the title and date, acknowledgements and foreword, the table of contents, and lists of tables, graphs and charts.", "id": "B-C2-23", "type": "mcq", "answer": 0, "choices": [{"text": "The preliminary pages; the main text; and the end matter", "why": ""}, {"text": "The introduction; the main report; and the bibliography", "why": "Introduction and main report are parts within the main text, and the bibliography belongs to the end matter — these are not the three top-level divisions."}, {"text": "The title page; the findings; and the appendices", "why": "These items sit inside the three divisions rather than constituting them."}, {"text": "The synopsis; the analysis; and the conclusion", "why": "The synopsis is submitted at the problem-formulation stage; it is not a division of the report."}]}, {"chapter": 2, "set": "B", "topic": "Extensive literature survey", "pages": [11], "prompt": "For the extensive literature survey, which sources does the chapter name as the first place to go?", "explanation": "The chapter states: “For this purpose, the abstracting and indexing journals and published or unpublished bibliographies are the first place to go to.” Academic journals, conference proceedings, government reports and books are tapped afterwards, depending on the nature of the problem.", "id": "B-C2-24", "type": "mcq", "answer": 0, "choices": [{"text": "Abstracting and indexing journals, and published or unpublished bibliographies", "why": ""}, {"text": "Academic journals and conference proceedings", "why": "Named among the sources tapped after the first place to go."}, {"text": "Government reports and books", "why": "Also named among the sources tapped afterwards."}, {"text": "The conceptual and the empirical literature on the problem", "why": "The conceptual/empirical division belongs to the discussion of formulating the research problem."}]}, {"chapter": 2, "set": "B", "topic": "Extensive literature survey", "pages": [11], "prompt": "According to the chapter, a researcher writing a thesis must write a synopsis of the topic and submit it to:", "explanation": "The chapter states: “It is compulsory for a researcher writing a thesis to write a synopsis of the topic and submit it to a Committee or the Research Board for approval.”", "id": "B-C2-25", "type": "mcq", "answer": 0, "choices": [{"text": "A Committee or the Research Board for approval", "why": ""}, {"text": "The researcher’s own colleagues and experts in the matter", "why": "Discussion with colleagues and experts is given as the best way of understanding the problem, and as one approach to developing working hypotheses."}, {"text": "The journal in which the research is to be published", "why": "The chapter involves no journal at this stage."}, {"text": "The study participants, as part of informed consent", "why": "Informed consent concerns informing participants about procedures, risks and benefits."}]}, {"chapter": 2, "set": "B", "topic": "Research design", "pages": [18, 19], "prompt": "According to the chapter, the role of the research design is to:", "explanation": "The chapter states that the researcher must “state the conceptual structure within which research would be conducted. Its role is to provide for the collection of relevant evidence with minimal expenditure of effort, time, and money.”", "id": "B-C2-26", "type": "mcq", "answer": 0, "choices": [{"text": "Provide for the collection of relevant evidence with minimal expenditure of effort, time, and money", "why": ""}, {"text": "Guarantee that the null hypothesis will be rejected", "why": "No design can guarantee a result; the chapter says the null is tested and then confirmed or refuted."}, {"text": "Ensure that every member of the population has an equal probability of being selected", "why": "That is random selection."}, {"text": "Determine whether the findings can be generalized into a theory", "why": "Generalization is reached after a hypothesis has been tested and confirmed several times."}]}, {"chapter": 2, "set": "B", "topic": "Choosing a research topic", "pages": [4, 5, 6], "prompt": "How does the chapter define a theory?", "explanation": "The chapter states: “A theory is a description of a phenomenon that attempts to integrate all that we know about the phenomenon into a concise statement or question.” In the research context theories function as a rich source of hypotheses that can be examined empirically.", "id": "B-C2-27", "type": "mcq", "answer": 0, "choices": [{"text": "A description of a phenomenon that attempts to integrate all that we know about it into a concise statement or question", "why": ""}, {"text": "A tentative assumption made in order to test its logical or empirical consequences", "why": "That is the chapter’s definition of a working hypothesis."}, {"text": "A generalization that has been verified by replication in several different populations", "why": "The chapter does say a hypothesis confirmed several times may let the researcher construct a theory — but that is how a theory is reached, not how it is defined."}, {"text": "The conceptual structure within which the research will be conducted", "why": "That is the research design."}]}, {"chapter": 2, "set": "B", "topic": "Analysis of data", "pages": [22, 23], "prompt": "In the chapter’s account of data analysis, coding is the operation through which:", "explanation": "The chapter states: “Coding operation is usually done at this stage through which the categories of data are transformed into symbols that may be tabulated and counted.”", "id": "B-C2-28", "type": "mcq", "answer": 0, "choices": [{"text": "The categories of data are transformed into symbols that may be tabulated and counted", "why": ""}, {"text": "The classified data are put in the form of tables", "why": "That is the chapter’s definition of tabulation: the technical procedure wherein the classified data are put in the form of tables."}, {"text": "Percentages and coefficients are computed by applying statistical formulae", "why": "That is the analysis work done after tabulation."}, {"text": "Relationships or differences are subjected to tests of significance", "why": "That is the final step, undertaken to determine any conclusions."}]}, {"chapter": 2, "set": "B", "topic": "Generalization & Interpretation", "pages": [25], "prompt": "A researcher began the study with no hypothesis, and now explains the findings on the basis of a theory. According to the chapter, this is called:", "explanation": "The chapter states: “If the researcher did not have a hypothesis to begin with, he could seek to explain his findings on the basis of a theory. This is called interpretation.” Interpretation can trigger new questions, which in turn lead to further research.", "id": "B-C2-29", "type": "mcq", "answer": 0, "choices": [{"text": "Interpretation", "why": ""}, {"text": "Generalization", "why": "Generalization is reached when a hypothesis has been tested and confirmed several times, allowing a theory to be constructed."}, {"text": "Hypothesis-testing", "why": "Hypothesis-testing asks whether the facts support the hypothesis and results in accepting or rejecting it — it presupposes a hypothesis."}, {"text": "Deduction", "why": "Deduction is reasoning from a premise to a conclusion that follows from it, discussed under the criteria of good research."}]}, {"chapter": 2, "set": "B", "topic": "Criteria of good research", "pages": [29, 30], "prompt": "According to the chapter, induction is the process of reasoning:", "explanation": "The chapter states: “Induction is the process of reasoning from a part to the whole whereas deduction is the process of reasoning from some premise to a conclusion which follows from that very premise.” Both belong to the ‘Logical’ criterion of good research.", "id": "B-C2-30", "type": "mcq", "answer": 0, "choices": [{"text": "From a part to the whole", "why": ""}, {"text": "From some premise to a conclusion which follows from that premise", "why": "That is the chapter’s definition of deduction."}, {"text": "From a theory to a hypothesis that can be tested", "why": "The chapter describes theories as a source of hypotheses, but does not define induction this way."}, {"text": "From the sample to the statistical test appropriate for it", "why": "The choice of statistical test depends partly on whether variables are categorical or continuous; that is not induction."}]}, {"chapter": 2, "set": "B", "topic": "Null vs. Alternate hypotheses", "pages": [14], "prompt": "In scientific research, it is the alternate hypothesis that is tested, and it is then confirmed or refuted.", "explanation": "False. The chapter states the opposite: “it is the null hypothesis that is tested, and then the null hypothesis is either confirmed or refuted (sometimes phrased as rejected or not rejected).”", "id": "B-C2-31", "type": "tf", "answer": false}, {"chapter": 2, "set": "B", "topic": "Research design", "pages": [18, 19], "prompt": "If random assignment is used, the design is considered a randomized, or true, experimental design.", "explanation": "True. The chapter states: “If random assignment is used, it is considered to be a randomized, or true, experimental design.” Only when random assignment is absent does the second question — multiple groups or multiple waves of measurement — come into play.", "id": "B-C2-32", "type": "tf", "answer": true}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "Continuous variables can be measured with a greater degree of precision than categorical variables.", "explanation": "True. The chapter’s note states: “When compared with categorical variables, continuous variables can be measured with a greater degree of precision.”", "id": "B-C2-33", "type": "tf", "answer": true}, {"chapter": 2, "set": "B", "topic": "Collecting the data", "pages": [20], "prompt": "The chapter allows that there are a few limited instances in which researchers are not required to obtain informed consent from study participants.", "explanation": "True. The chapter describes informed consent — all potential participants being informed about the procedures and the risks and benefits of participating — and then adds the exception: “There are, however, a few limited instances in which researchers are not required to obtain informed consent from the study participants.”", "id": "B-C2-34", "type": "tf", "answer": true}, {"chapter": 2, "set": "B", "topic": "Working hypothesis", "pages": [12, 13], "prompt": "Exploratory or formulative research always requires a working hypothesis before it can begin.", "explanation": "False. The chapter states: “There may be a problem where we do not need working hypotheses, specially in the case of exploratory or formulative researches which do not aim at testing the hypothesis.”", "id": "B-C2-35", "type": "tf", "answer": false}, {"chapter": 2, "set": "B", "topic": "Variables", "pages": [16, 17], "prompt": "The independent variable is a measure of the effect, if any, of the dependent variable.", "explanation": "False. The two are reversed. The chapter states that the independent variable is the factor manipulated or controlled by the researcher, while the dependent variable “is a measure of the effect (if any) of the independent variable.”", "id": "B-C2-36", "type": "tf", "answer": false}, {"chapter": 2, "set": "B", "topic": "Literature review", "pages": [7, 8], "prompt": "According to the chapter, replicating a study and duplicating a study amount to the same thing.", "explanation": "False. The chapter explicitly separates them: replication is undertaken to establish the robustness or generalizability of the original findings, whereas duplication is repeating a study without knowing it has already been conducted. Avoiding the latter is one reason for the literature review.", "id": "B-C2-37", "type": "tf", "answer": false}, {"chapter": 2, "set": "B", "topic": "Generalization & Interpretation", "pages": [25], "prompt": "The chapter states that the real value of research lies in its ability to arrive at certain generalizations.", "explanation": "True. The chapter states: “In fact, the real value of research lies in its ability to arrive at certain generalizations.” If a hypothesis is tested and confirmed several times, the researcher may reach a generalization — that is, construct a theory.", "id": "B-C2-38", "type": "tf", "answer": true}, {"chapter": 2, "set": "B", "topic": "Formulating the research problem", "pages": [9, 10], "prompt": "A good research problem should take the form of a question.", "explanation": "True. This is the second of the three criteria the chapter gives: a good research problem should describe the relationship between two or more variables, should take the form of a question, and must be capable of being tested empirically.", "id": "B-C2-39", "type": "tf", "answer": true}, {"chapter": 2, "set": "B", "topic": "Preparation of the report", "pages": [26, 27, 28], "prompt": "The summary of findings should be reported in non-technical language.", "explanation": "True. The chapter states: “After introduction, a statement of findings and recommendations in non-technical language should be reported. If the findings are extensive, they should be summarized.”", "id": "B-C2-40", "type": "tf", "answer": true}, {"chapter": 2, "set": "B", "topic": "Random selection vs. assignment", "pages": [21], "prompt": "Random selection and random assignment both describe how participants are distributed into groups within the study.", "explanation": "False. Only random assignment concerns groups within the study. Random selection is “choosing study participants from the population of interest” so that each member of the population has an equal probability of being selected to participate at all.", "id": "B-C2-41", "type": "tf", "answer": false}, {"chapter": 2, "set": "B", "topic": "Preparation of the report", "pages": [26, 27, 28], "prompt": "Charts and illustrations should be included in the main report wherever possible, to make it more visually appealing.", "explanation": "False. The chapter sets a stricter test: “Charts and illustrations in the main report should be used only if they present the information more clearly and forcibly.” Visual appeal is not the criterion.", "id": "B-C2-42", "type": "tf", "answer": false}, {"chapter": 2, "set": "B", "topic": "Steps of the research process", "pages": [3], "prompt": "List the 10 steps of planning and designing a research study, as set out in the chapter.", "explanation": "These ten items are the contents list on the ‘Planning and Designing a Research Study’ slide, and the chapter then works through them in this order.", "id": "B-C2-43", "type": "list", "required"
