    <ul class="kp">${hits.map(h=>`<li><span class="${h.hit?'y':'n'}">${h.hit?'✓':'✗'}</span><span>${h.label}</span></li>`).join('')}</ul>
    <div class="foot">Checked without caring about capital letters, and small spelling mistakes still count. It matches key words, so read the model answer and change the mark if it got you wrong.</div>`:''}
    <div class="eyebrow">Model answer</div><div class="model">${q.answer}</div><div class="src"><b>Source</b><span>${srcText(q)}</span></div>
    <div class="eyebrow">Mark this answer</div><div class="row"><button class="btn ${suggest!==false?'primary':''}" id="got">Count as right</button><button class="btn ${suggest===false?'primary':''}" id="missed">Count as wrong</button></div></div>`;
  $('#got').onclick=()=>{record(q,true,{mine,hits:hits&&hits.map(h=>h.hit)});showWritten(run.answers[run.i])};
  $('#missed').onclick=()=>{record(q,false,{mine,hits:hits&&hits.map(h=>h.hit)});showWritten(run.answers[run.i])};
}
function showWritten(a){
  done=true;const {q}=run.qs[run.i];$('#mine').readOnly=true;
  const hits=q.keys&&a.hits?q.keys.map((k,i)=>({label:k.split('|')[0],hit:!!a.hits[i]})):null;
  $('#fb').innerHTML=`<div class="stack" style="gap:10px"><div class="verdict ${a.ok?'ok':'bad'}">Marked ${a.ok?'right':'wrong'}.</div>
    ${hits?`<ul class="kp">${hits.map(h=>`<li><span class="${h.hit?'y':'n'}">${h.hit?'✓':'✗'}</span><span>${h.label}</span></li>`).join('')}</ul>`:''}
    <div class="eyebrow">Model answer</div><div class="model">${q.answer}</div><div class="src"><b>Source</b><span>${srcText(q)}</span></div></div>`;
  armNext();
}
function record(q,ok,extra){
  run.answers[run.i]=Object.assign({id:q.id,ok},extra||{});
  const h=store.hist[q.id]||{n:0,ok:0};h.n++;if(ok)h.ok++;h.last=ok;store.hist[q.id]=h;
  run.t=Date.now();saveRun();
}
function next(){
  if(run.answers.every(Boolean))return finish();
  for(let k=run.i+1;k<run.qs.length;k++)if(!run.answers[k])return go(k);
  for(let k=0;k<run.qs.length;k++)if(!run.answers[k])return go(k);
}
function finish(){
  const ans=run.answers.filter(Boolean);const n=ans.length;const ok=ans.filter(a=>a.ok).length;const total=run.qs.length;
  if(n){store.runs.push({t:Date.now(),n,ok});store.runs=store.runs.slice(-30)}
  const missed=ans.filter(a=>!a.ok).map(a=>byId.get(a.id)).filter(Boolean);
  const byL=[1,2,3,4].map(l=>{const a=ans.filter(x=>byId.get(x.id)&&byId.get(x.id).lec===l);return {l,n:a.length,ok:a.filter(x=>x.ok).length}}).filter(x=>x.n);
  run=null;saveRun();
  app.innerHTML=`<div class="stack">
    <section class="panel stack"><span class="eyebrow">Exam finished</span>
      <h1 style="font-variant-numeric:tabular-nums">${ok} / ${n}${n?` · ${Math.round(ok/n*100)}%`:''}</h1>
      ${n<total?`<div class="muted">${total-n} question${total-n>1?'s were':' was'} not answered and ${total-n>1?'are':'is'} not counted.</div>`:''}
      ${n?`<div class="stats">${byL.map(b=>`<div class="stat"><div class="eyebrow"><span class="lec lec${b.l}">L${b.l}</span> ${LECS[b.l]}</div><b>${b.ok}/${b.n}</b><div class="bar"><span style="width:${b.ok/b.n*100}%;background:var(--l${b.l})"></span></div></div>`).join('')}</div>`:'<div class="muted">No questions were answered.</div>'}
      <div class="row"><button class="btn primary" id="home">Back to setup</button>${missed.length?`<button class="btn" id="again">Practise these ${missed.length} missed</button>`:''}</div>
    </section>
    ${missed.length?`<section class="panel stack"><h2>Review what you missed</h2>${missed.map(q=>`<div class="miss stack" style="gap:6px"><div class="row"><span class="lec lec${q.lec}">L${q.lec}</span><span class="tag">${esc(q.topic)}</span></div><div>${q.type==='tf'?'True or False: ':''}${q.q}</div>${q.type==='written'?`<div class="model">${q.answer}</div>`:q.grid?`<div><b>Answer:</b></div>${gridHtml(q,false)}<div class="model">${q.work}</div>`:`<div><b>Answer:</b> ${q.opts.find(o=>o.ok).t}</div><div class="why">${q.opts.find(o=>o.ok).why}</div>`}<div class="src"><b>Source</b><span>${srcText(q)}</span></div></div>`).join('')}</section>`:''}
  </div>`;
  $('#home').onclick=()=>{home();window.scrollTo(0,0)};
  if($('#again'))$('#again').onclick=()=>startRun(missed,true);
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!run||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  const cur=run.qs[run.i];const q=cur&&cur.q;if(!q||q.type==='written'||q.grid)return;
  if(/^[1-4]$/.test(e.key)){const k=+e.key-1;if(k<cur.opts.length){pick(k);e.preventDefault()}}
  else if(/^[a-d]$/i.test(e.key)&&q.type!=='tf'){pick('abcd'.indexOf(e.key.toLowerCase()));e.preventDefault()}
  else if(/^[tf]$/i.test(e.key)&&q.type==='tf'){pick(e.key.toLowerCase()==='t'?0:1);e.preventDefault()}
  else if(e.key==='Enter'&&(!document.activeElement||document.activeElement.tagName!=='BUTTON')){if(done)next();else if(sel!==null)submit();e.preventDefault()}
});
window.__BANK=BANK;
home();
})();
</script>
</body>
</html>
