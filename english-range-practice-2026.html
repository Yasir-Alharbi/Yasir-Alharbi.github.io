:root{--ink:#183639;--muted:#5d7274;--teal:#176c66;--paper:#f5f4ee;--line:#d6e1dc;--good:#176944;--bad:#a63330;--gold:#e6b45a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ba7414;outline-offset:4px}button{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 17px;font-weight:650;transition:background .15s}button:hover:not(:disabled){background:#e9f1ec}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover:not(:disabled){background:#125750}.danger{color:var(--bad)}header{background:#153f40;color:white;padding:18px max(24px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;letter-spacing:-.6px;font-size:22px}.brand span{font-weight:400;color:#a9d6c6}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800;color:var(--teal)}header small{color:#c0d9d2}main{max-width:1288px;margin:auto;padding:34px 24px 60px}h1{font:700 clamp(32px,5vw,56px)/1.12 Georgia,serif;letter-spacing:-1.2px;margin:12px 0 20px}h2{font-size:24px;line-height:1.3;margin:0 0 16px}h3{font-size:18px;margin:12px 0}.muted{color:var(--muted)}.lead{font-size:19px;max-width:720px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:44px;padding:30px 0}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:26px}.green{background:#e6eee5}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.metric{border-top:3px solid var(--gold);padding-top:12px}.metric strong{display:block;font:700 32px Georgia,serif}.metric span{font-size:13px;color:var(--muted)}.choice-mode{width:100%;text-align:left;display:block;margin:10px 0;padding:15px}.choice-mode[aria-pressed=true]{border:2px solid var(--teal);background:#edf5ef}.choice-mode span{display:block;font-weight:400;font-size:14px;color:var(--muted)}label{display:block;font-weight:650;margin:18px 0 6px}select{width:100%;padding:11px;border:1px solid #b4c7c1;background:white;border-radius:8px;color:var(--ink)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.notice{background:#fff4d9;border-left:4px solid var(--gold);padding:14px 18px;border-radius:6px;font-size:14px}.fine{font-size:13px;color:var(--muted)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.progress{height:7px;background:#dbe5dd;border-radius:10px;overflow:hidden;margin:12px 0 25px}.progress i{display:block;height:100%;background:var(--teal)}.exam-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}.sidebar{position:sticky;top:18px;padding:18px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:15px 0;max-height:440px;overflow-y:auto;padding:4px}.grid button{padding:6px 0;font-size:12px;border-radius:6px;position:relative}.grid button.done{background:#dfece5;border-color:#b8d2c6}.grid button.current{outline:2px solid var(--teal);outline-offset:1px;font-weight:900}.grid button.flag:after{content:'★';font-size:9px;position:absolute;top:-4px;right:0;color:#9b6812}.grid button.bad{background:#fbe4e1;border-color:#ebc0ba}.grid button.good{background:#d7eddf;border-color:#a6ccb3}.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#eaf1ec;color:#315e56;font-size:12px;font-weight:750}.question{font-size:21px;line-height:1.5;margin:18px 0 24px}.option{display:flex;gap:14px;text-align:left;width:100%;align-items:center;margin:11px 0;padding:15px;font-weight:450;line-height:1.5}.letter{border:1px solid #bdcec6;border-radius:7px;min-width:31px;text-align:center;font-size:13px;padding:3px}.option.selected{border:2px solid var(--teal);background:#edf5ef;padding:14px}.option.correct{border:2px solid var(--good);background:#edf7ef;padding:14px}.option.wrong{border:2px solid var(--bad);background:#fff0ec;padding:14px}.option:disabled{opacity:1;color:var(--ink)}.opt-text{flex:1}.status{font-size:12px;font-weight:750}.feedback{margin:22px 0;padding:20px;background:#f4f7f2;border-radius:12px}.explanation{padding:12px 0;border-top:1px solid var(--line);font-size:14px}.explanation strong{display:block;margin-bottom:3px}.good-text{color:var(--good)}.bad-text{color:var(--bad)}.passage{background:#faf9f3;border:1px solid #e3dfcb;border-radius:12px;padding:20px;margin:20px 0}.passage p{font:18px/1.85 Georgia,serif;margin:12px 0 0;white-space:pre-line}.passage summary{cursor:pointer;font-weight:750}.bottom-nav{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}.result-hero{background:#153f40;color:white;border-radius:18px;padding:30px;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr;gap:35px;align-items:center}.score{font:700 60px/1 Georgia,serif}.result-hero .muted{color:#bdd4cd}.result-hero h1{font-size:36px;margin:10px 0}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:22px 0}.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:20px 0}.scale div{padding:10px 2px;text-align:center;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px}.scale div.active{background:var(--teal);color:white}.bars .bar{margin:17px 0}.bar-head{display:flex;justify-content:space-between;font-size:14px;gap:10px}.track{height:9px;border-radius:10px;background:#e9eeea;margin-top:7px;overflow:hidden}.track i{display:block;height:100%;background:var(--teal)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px}th{font-size:12px;color:var(--muted)}.table-wrap{overflow-x:auto}.plan li{margin:13px 0}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;font-size:12px;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.timer{font-variant-numeric:tabular-nums}.timer.urgent{color:var(--bad);font-weight:800}#storage-warning{max-width:1240px;margin:16px auto}dialog{border:1px solid var(--line);border-radius:16px;max-width:470px;padding:26px;color:var(--ink)}dialog::backdrop{background:#102f3266}a{color:var(--teal)}

<script>
function applyTheme(theme){document.documentElement.dataset.theme=theme;const b=document.getElementById('theme-toggle');if(b){b.textContent=theme==='dark'?'☀ Light mode':'☾ Dark mode';b.setAttribute('aria-pressed',String(theme==='dark'));b.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode')}}
let savedTheme=null;try{savedTheme=localStorage.getItem('english-range-theme')}catch(e){}
applyTheme(savedTheme==='dark'||savedTheme==='light'?savedTheme:window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light');
document.getElementById('theme-toggle').addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem('english-range-theme',t)}catch(e){}});

const grammar = [
['By the time the auditors arrive tomorrow, we ___ the accounts.','will have reconciled','have reconciled','will reconcile','had reconciled','The future perfect describes completion before a future reference point: tomorrow’s arrival.','The present perfect connects a past action to now, not completion by a future deadline.','The simple future predicts an action but does not express the required prior completion.','The past perfect requires a past reference point, whereas the arrival is tomorrow.'],
['If the supplier had warned us earlier, we ___ facing a shortage now.','would not be','would not have been','will not be','had not been','This mixed conditional links an unreal past condition to a present result.','This would place the result in the past, but “now” makes the result present.','Will does not fit the unreal past condition.','The result clause needs would; the past perfect cannot express this present hypothetical result.'],
['Not until the final interview ___ how demanding the position would be.','did I realize','I realized','had I realize','I did realize','Fronted “not until” requires subject–auxiliary inversion: did I realize.','Normal word order is inappropriate after the fronted negative expression.','Had must be followed by a past participle, not realize.','Adding did without inversion does not satisfy the construction.'],
['The director insisted that every applicant ___ assessed against the same criteria.','be','is','was','has been','The mandative subjunctive uses the base form after a demand: insisted that ... be.','The indicative is does not express the formal demand construction targeted here.','Was would describe a past state rather than the required assessment.','Has been reports completed assessment rather than what the director requires.'],
['___ the budget constraints, the team delivered a reliable prototype.','Despite','Although','Even though','Nevertheless','Despite is a preposition followed here by the noun phrase “the budget constraints.”','Although needs a clause with a subject and verb.','Even though also requires a clause, not this noun phrase.','Nevertheless is a linking adverb and cannot introduce this noun phrase as a concession.'],
['The equipment, together with its spare parts, ___ stored in a secure room.','is','are','have been','were','The subject equipment is an uncountable singular noun; “together with” does not change agreement.','Spare parts is inside an accompanying phrase, not the grammatical subject.','Have agrees with a plural subject, but equipment is singular.','Were likewise requires a plural subject in this factual sentence.'],
['I would rather you ___ the client before changing the schedule.','consulted','consult','will consult','have consulted','Would rather + a different subject takes the past form for a present or future preference.','The base form follows would rather only when there is no separate subject: I would rather consult.','Will is not used in this preference construction.','The present perfect does not fit this construction.'],
['The policy is intended to prevent sensitive information from ___.','being disclosed','disclosing','be disclosed','having disclosed','After from, use an -ing form; information receives the action, so use being disclosed.','Disclosing is active and would make the information perform the action.','A bare infinitive cannot follow the preposition from.','Having disclosed is active and suggests that information has disclosed something.'],
['Had we known about the road closure, we ___ a different route.','would have taken','would take','had taken','will have taken','Had we known means if we had known; the past counterfactual result uses would have + participle.','Would take normally describes a present or future hypothetical result.','Had taken lacks the modal required in the result of this counterfactual.','Will have taken is future perfect, incompatible with this unreal past result.'],
['The report contains several proposals, none of ___ has yet been approved.','which','them','that','what','Which introduces a relative clause after “none of,” referring to proposals.','Them would create a comma splice here; it needs a new independent clause or conjunction.','That cannot follow a preposition in this non-defining relative clause.','What cannot refer back to an explicit antecedent such as proposals.'],
['No sooner had the presentation begun ___ the projector failed.','than','when','then','that','The fixed correlative construction is no sooner ... than.','When pairs with hardly/scarcely ... when, not no sooner.','Then is an adverb, not the required conjunction.','That does not complete this fixed construction.'],
['It is essential that the revised figures ___ before publication.','be verified','are verifying','have verified','to be verified','Essential that introduces a mandative clause; passive be verified expresses the required action.','Are verifying is active, making the figures do the checking.','Have verified is also active and lacks an object.','A that-clause needs a finite or subjunctive verb, not a to-infinitive.'],
['She denied ___ confidential documents to a competitor.','having sent','to have sent','to send','have sent','Deny takes an -ing complement; having sent emphasizes that the alleged action was earlier.','Deny does not take a to-infinitive complement.','To send is not the complement pattern used after deny.','Have sent without an -ing ending cannot serve as this verb’s complement.'],
['The more carefully the instructions are written, ___ errors users make.','the fewer','the less','fewer','the fewest','The comparative correlation is the more ... the fewer; errors is countable.','Less normally modifies uncountable quantities, not the plural errors.','The paired comparative requires the before fewer.','Fewest is superlative, not the comparative required by this correlation.'],
['You ___ have booked a taxi; I had already arranged a car for you.','need not','must not','would not','could not','Need not have + participle means an action was unnecessary; the car was already arranged.','Must not have usually expresses a negative deduction in this context, not lack of necessity.','Would not have expresses a hypothetical result or refusal, not unnecessary action.','Could not have expresses inability or impossibility, not lack of need.'],
['The candidate spoke as though she ___ the department for years, although she had joined only a week earlier.','had led','has led','will lead','is leading','As though + past perfect expresses the appearance of an earlier experience contradicted by the context.','The present perfect is inconsistent with the past narrative and imagined earlier experience.','Future leadership does not explain an impression based on years of experience.','The present continuous describes an ongoing current action rather than imagined prior experience.'],
['Only after all references have been checked ___ a final offer.','will we make','we will make','we make','we have made','Fronted only after triggers inversion in the main clause: will we make.','This has normal word order where inversion is required.','This lacks the required inversion and future meaning.','This has neither inversion nor the appropriate future reference.'],
['The software needs ___ before it can be released.','testing','to testing','tested','be tested','Need + -ing has passive meaning: needs testing means needs to be tested.','To followed by an -ing form does not fit this use of need.','A past participle alone cannot complement needs in standard formal English.','The passive infinitive would require to: needs to be tested.'],
['I regret ___ you that your application was unsuccessful.','to inform','informing yesterday','having informed already','inform','Regret to inform introduces unwelcome news that the speaker is now delivering.','This would express regret about a past act of informing and has awkward adverb placement.','This refers to an earlier notification, not the present announcement.','Regret cannot be followed by this bare infinitive.'],
['The manager had the faulty laptops ___ by an external technician.','repaired','repair','repairing','to repair','Have + object + past participle expresses arranging for someone else to do a service.','The laptops cannot perform the repair, and this form is not passive.','Repairing would make the laptops the agents of an ongoing action.','This causative pattern does not take to + infinitive after the object.'],
['Were the company to expand abroad, it ___ additional legal advice.','would need','will need','had needed','has needed','Were ... to is an inverted hypothetical conditional and takes would in the result.','Will does not match the hypothetical were ... to condition.','Past perfect does not express the hypothetical consequence.','Present perfect reports a real past need rather than a hypothetical future one.'],
['There is little prospect of the dispute ___ this week.','being resolved','resolving it','to be resolved','has been resolved','Of takes an -ing complement, and the dispute receives the action: being resolved.','This active construction would make the dispute resolve something else.','A to-infinitive cannot directly follow of.','A finite present-perfect clause cannot directly follow of this way.'],
['The consultant recommended ___ the launch until the security review was complete.','postponing','to postpone','postpone','to postponing','Recommend commonly takes an -ing complement when no object or that-clause follows.','Recommend does not take a simple to-infinitive in this pattern.','A bare infinitive cannot directly complement recommended here.','No preposition to is licensed before the -ing complement in this sentence.'],
['Every one of the proposals ___ a detailed cost estimate.','includes','include','have included','are including','Every one is singular even though the following of-phrase contains a plural noun.','Include does not agree with singular every one.','Have does not agree with singular every one.','Are does not agree with the singular head of the subject.'],
['The building ___ roof was damaged has been temporarily closed.','whose','which','that','whom','Whose expresses possession and can refer to things as well as people.','Which alone cannot express the possessive relationship with roof.','That cannot function as a possessive determiner before roof.','Whom refers to people as objects and does not express possession.'],
['We will approve the request provided that the supporting documents ___ complete.','are','will be','would be','had been','In this future condition, the present simple follows provided that.','Will is generally not used for a neutral future condition after provided that.','Would would introduce hypothetical modality absent from this real condition.','Past perfect conflicts with the prospective approval and present/future requirement.'],
['Scarcely ___ the office when the emergency call came through.','had she left','she had left','did she left','has she leave','Fronted scarcely requires inversion; the past perfect marks the action just completed.','The subject and auxiliary must invert after fronted scarcely.','Did must be followed by leave, not left; the intended sequence also uses past perfect.','Has requires left, and the present perfect does not fit this past sequence.'],
['The evidence was not strong enough ___ a definitive conclusion.','to support','supporting','for support','that supported','Enough + to-infinitive expresses the threshold required for an action.','An -ing form does not complete strong enough in this meaning.','For support does not link the evidence to the object “a definitive conclusion.”','This relative clause cannot complete the enough construction.'],
['He objected to ___ expected to work every weekend.','being','be','have been','is','To is a preposition in object to, so it takes being rather than an infinitive.','The bare form be cannot follow this prepositional to.','Have been would need having been after a preposition.','A finite verb is cannot directly follow objected to.'],
['If I ___ you, I would ask for the terms in writing.','were','am','had been','would be','If I were you is the conventional unreal conditional used for advice.','Am presents a real condition, whereas this identity is hypothetical.','Had been shifts the hypothetical situation into the past.','Would normally belongs in the result clause, not this if-clause.'],
['The survey, ___ was conducted anonymously, attracted unusually frank responses.','which','that','what','whose','A non-defining relative clause referring to a thing uses which.','That does not introduce non-defining relative clauses in standard English.','What cannot follow an explicit antecedent in this way.','Whose needs a following noun to show possession.'],
['By last December, she ___ on the project for nearly three years.','had been working','has been working','is working','will have worked','The past perfect continuous describes duration leading up to a past reference point.','Present perfect links duration to now, not last December.','Present continuous conflicts with the past reference point.','Future perfect conflicts with the explicitly past deadline.'],
['The board is considering whether ___ the contract.','to renew','renewing','renew','that renews','Whether + to-infinitive expresses a decision between alternatives.','Whether cannot take a lone -ing phrase as its complement here.','The bare infinitive requires to in this construction.','Whether that renews does not form a meaningful decision complement.'],
['Not only ___ the deadline, but she also reduced costs.','did she meet','she met','she did meet','had she meet','Fronted not only triggers auxiliary–subject inversion; did takes meet.','Normal word order is not used after this fronted negative expression.','Emphatic did without inversion is still incorrect here.','Had requires the participle met, not meet.'],
['The new procedure allows applications ___ more efficiently.','to be processed','being processed','to process themselves','be processing','Allow + object + passive infinitive expresses what may be done to the applications.','Allow does not take object + being in this construction.','Applications do not process themselves; the intended relationship is passive.','This lacks to and incorrectly makes applications the agents of processing.'],
['___ completed the training, all recruits must pass a practical assessment.','Having','Have','Had','To have','Having completed is a participle clause showing an action completed before the main action.','Have cannot head this detached participle clause.','Had would need a subject and a different clause structure.','To have completed expresses an infinitival idea and does not establish this completed sequence.'],
['The instructions were so ambiguous ___ several users interpreted them differently.','that','as','than','what','So + adjective + that introduces a result clause.','So ... as does not introduce this finite result clause.','Than belongs in comparative structures, not so ... result clauses.','What cannot introduce the intended result clause.'],
['It is high time the organization ___ its outdated policies.','revised','revises','will revise','has revised','It is high time + subject takes the past form to express an overdue present action.','Present simple does not fit this idiomatic construction.','Will is not used after it is high time in this pattern.','Present perfect suggests completed action rather than an overdue change.'],
['Neither the supervisor nor the technicians ___ available at the moment.','are','is','has been','was','With neither ... nor, agreement commonly follows the nearer subject, technicians, which is plural.','Is does not agree with the nearer plural subject.','Has likewise fails to agree with technicians.','Was is singular and also clashes with at the moment.'],
['The memo explains ___ employees should report suspected fraud.','how','that how','what to','which','How introduces an embedded question about the reporting procedure.','That and how cannot jointly introduce this embedded question.','What to cannot precede the finite clause employees should report.','Which requires a choice or noun relationship that this sentence does not provide.'],
['The proposal is worth ___ in greater detail.','examining','to examine','be examined','examine','Worth takes an -ing complement, often with passive meaning.','Worth does not take a to-infinitive in this construction.','A bare passive infinitive cannot follow worth.','A bare infinitive cannot complement worth here.'],
['She asked me where ___ the previous day.','I had worked','had I worked','did I work','I have worked','An indirect question uses statement word order; past perfect locates the work before her question.','Indirect questions do not invert subject and auxiliary.','This is direct-question order and does not express the earlier past clearly.','Present perfect is incompatible with the finished time the previous day.'],
['The contract cannot be amended without both parties ___ their consent.','giving','to give','give','have given','Without is a preposition, so the following non-finite clause uses an -ing verb.','A to-infinitive cannot follow without in this structure.','A bare infinitive cannot follow without.','A finite present-perfect clause cannot follow without directly.'],
['I wish I ___ more attention during yesterday’s briefing.','had paid','paid','would pay','have paid','Wish + past perfect expresses regret about a completed past event.','Past simple after wish usually refers to an unreal present situation.','Would pay concerns desired future behavior, not regret about yesterday.','Present perfect is not used for this counterfactual past regret.'],
['The CEO is believed ___ the resignation before the news became public.','to have accepted','to accept tomorrow','accepting','having accepted','A reporting passive uses a perfect infinitive for an action earlier than the reporting point.','Tomorrow contradicts before the news became public and does not express prior acceptance.','Is believed requires an infinitive in this personal reporting construction.','A perfect participle cannot replace the required perfect infinitive.'],
['Much as I ___ your concern, we cannot waive the requirement.','understand','understanding','to understand','understood it','Much as + subject + finite verb introduces a concession: although I understand.','An -ing form cannot serve as the finite verb after I.','A to-infinitive cannot serve as the finite verb here.','It would duplicate the object your concern and make the clause ungrammatical.'],
['The deadline has been extended, ___ gives us time to check the figures.','which','what','that','it','Which can introduce a non-defining relative clause commenting on the entire preceding clause.','What cannot refer back to a complete preceding clause in this construction.','That cannot introduce this non-defining relative clause.','It would create two independent clauses joined only by a comma.'],

['The temporary shade structures primarily addressed:','the delay before trees could provide substantial shade','the inability of any trees to survive in cities','the absence of reliable temperature measurements','the need to reduce all maintenance expenditure','Mature canopy takes years, so temporary structures provide nearer-term protection.','The passage does not claim urban trees cannot survive.','Measurement absence is not identified as the reason for structures.','Maintenance funding was redirected, not universally eliminated.'],
['What does “sufficient” mean in the final sentence?','adequate on its own','easy to calculate','widely publicized','entirely inaccurate','Counts alone were not adequate for assessing heat exposure.','Ease of calculation is distinct from adequacy as evidence.','Publicity is not discussed.','The counts remained useful, so they were not dismissed as wholly inaccurate.'],
['Which outcome would best demonstrate the revised program’s success?','Heat exposure falls in the districts previously receiving the least cooling.','The city buys the same number of saplings every year.','Officials publish planting totals more frequently.','All districts receive identical maintenance budgets.','The revision aims to improve actual protection in high-need districts.','A purchase count does not show whether cooling benefits reach residents.','More frequent activity reporting does not establish better outcomes.','Identical budgets could ignore the unequal needs that prompted the revision.']
]},
{title:'3 · The cost of “free” delivery',text:`An online retailer removed delivery charges for orders above a minimum value. Average order value increased, which the marketing team cited as evidence of success. The finance team was less certain. Some customers added low-margin items solely to qualify for free delivery, while others combined purchases they would previously have made in separate orders. Packaging costs per order rose, although the total number of deliveries fell. Returns also increased slightly. After accounting for these changes, profit per customer was almost unchanged. The retailer retained the policy, arguing that predictable checkout costs might encourage loyalty. It commissioned a six-month study to test that possibility rather than assuming that a larger shopping basket necessarily represented a more profitable customer relationship.`,qs:[
['Why was the finance team cautious?','Higher order values did not necessarily translate into higher profit.','The retailer had stopped charging for every product.','The total number of deliveries had increased sharply.','Customers had refused to add items to their baskets.','Costs, margins, combined orders, and returns complicate the relation between revenue and profit.','Products were still sold; only certain delivery charges were removed.','The passage says total deliveries fell.','Some customers added low-margin items, so the opposite occurred.'],
['What can be inferred about combining purchases?','It can raise average order value without increasing total customer spending.','It necessarily doubles packaging costs.','It eliminates the possibility of product returns.','It proves customers are more loyal.','Moving the same purchases into fewer orders makes each order larger without requiring additional spending.','Packaging costs rose, but neither doubling nor necessity is stated.','Returns actually increased slightly.','Loyalty remains an untested possibility.'],
['What does “that possibility” refer to?','Predictable checkout costs could encourage loyalty.','Returns could be prohibited for small purchases.','All delivery charges could be reinstated.','Profit per customer had already increased substantially.','The immediately preceding possibility is that predictable checkout costs encourage loyalty.','A returns prohibition is not proposed.','Reinstating charges is not the possibility being studied.','Profit was almost unchanged, not substantially higher.'],
['Which description best fits the author’s treatment of the policy?','Analytical, separating short-term measures from untested longer-term benefits','Dismissive, presenting it as an obvious failure','Promotional, urging every retailer to adopt it','Indifferent, treating financial effects as irrelevant','The passage weighs financial outcomes and identifies loyalty as a hypothesis for further study.','The policy was retained, and possible future benefits remain open.','No universal recommendation is made.','Financial effects receive detailed attention.'],
['Which additional measure would be most useful in the commissioned study?','Repeat purchasing and profit per customer over the following six months','The color preferences of first-time visitors','The number of items pictured on the home page','The average weight of packaging before the policy existed','Repeat purchases address loyalty, and customer profit addresses the economic value of that loyalty.','Color preferences do not directly test loyalty arising from checkout predictability.','Displayed item counts do not measure customer retention.','Historical packaging weight alone cannot test the future loyalty hypothesis.']
]},
{title:'4 · Publishing the missing experiments',text:`Studies reporting striking positive results are more likely to be published than studies finding little or no effect. Consequently, a literature review can overestimate an intervention’s effectiveness even when every published paper reports its own results accurately. A research consortium attempted to reduce this problem by requiring participating laboratories to register their hypotheses and methods before collecting data. Completed studies were then made available regardless of outcome. Registration did not prevent researchers from noticing unexpected patterns, but it required them to distinguish exploratory findings from tests planned in advance. Critics worried that this distinction might discourage discovery. The consortium replied that exploration remained valuable; the issue was whether a newly noticed pattern was being presented as though it had successfully passed an independent, preplanned test.`,qs:[
['How can an accurate set of published papers still give a misleading impression?','The published set may omit many studies with less favorable results.','Accuracy in individual papers makes comparison impossible.','All positive results must have been generated by chance.','Literature reviews necessarily ignore study methods.','Selection of what gets published can bias the overall picture even without false reporting.','Accurate reporting supports comparison; selective availability is the problem.','The passage does not say every positive result is accidental.','Reviews can examine methods but still lack unpublished evidence.'],
['What was the primary purpose of advance registration?','To make planned tests distinguishable and reduce selective availability of findings','To prevent researchers from collecting unexpected observations','To guarantee that every hypothesis would be confirmed','To replace data collection with theoretical argument','Advance records clarify planned methods and hypotheses; availability regardless of outcome addresses selective publication.','Exploration remains permitted and valuable.','Registration cannot guarantee confirmation.','Data collection continues after registration.'],
['Which inference is supported?','An exploratory finding may deserve follow-up without yet counting as a successful preplanned test.','Exploratory research is always less useful than confirmatory research.','A registered study cannot contain errors.','Negative findings establish that an intervention never works.','The passage values discovery while distinguishing its evidential status from advance prediction.','Value is acknowledged; a universal ranking is not given.','Registration addresses selected problems, not every possible error.','A null result does not support such an absolute conclusion here.'],
['In context, “striking” most nearly means:','notably impressive','physically forceful','intentionally deceptive','financially rewarding','Striking results are conspicuous or impressive enough to attract attention.','The word is figurative here, not a physical action.','The passage allows accurate results, so deception is not implied.','Financial reward is not part of the stated meaning.'],
['Which practice would conflict with the consortium’s principle?','Describing a pattern noticed after analysis as a hypothesis specified beforehand','Publishing a study that finds no detectable effect','Labeling an unexpected observation as exploratory','Conducting a new study to test an unexpected pattern','This disguises exploration as an independent preplanned test, the exact problem identified.','Publishing null findings supports the consortium’s approach.','Clear labeling follows its requested distinction.','Follow-up testing can provide independent evidence and is compatible with the principle.']
]},
{title:'5 · Museum access',text:`A municipal museum abolished admission fees to broaden access. Attendance increased substantially during the first year, but surveys showed that most additional visits came from people who had already visited before. Residents of outlying neighborhoods remained underrepresented. Interviews suggested that transport costs, unfamiliar opening hours, and uncertainty about whether children were welcome mattered as much as the ticket price. The museum then worked with community organizations to arrange weekend transport and advertise family activities. Its director cautioned that free entry was not a mistake: it removed one barrier, but the initial attendance figure had concealed the persistence of others. Future evaluations would track who visited, not merely how many visits occurred.`,qs:[
['What distinction is central to the passage?','Increasing total visits is not the same as broadening the visitor population.','Free admission always reduces the cultural value of museums.','Repeat visitors spend more money than first-time visitors.','Transport costs are the only meaningful barrier to museum attendance.','The rise mostly involved existing visitors, so larger numbers did not establish broader access.','The passage does not assess cultural value and does not reject free entry.','Visitor spending is not discussed.','Several barriers are named, including hours and perceptions of family welcome.'],
['Why were community organizations involved?','To address barriers that removing ticket charges had not resolved','To persuade the museum to restore its admission fees','To reduce the number of repeat visitors','To replace the museum’s permanent exhibits','Transport and family communication address remaining obstacles in underserved neighborhoods.','Restoring fees is not proposed.','The goal is inclusion, not excluding repeat visitors.','Exhibit replacement is not mentioned.'],
['The director’s statement implies that free entry was:','helpful but insufficient by itself','ineffective in every respect','responsible for creating transport costs','introduced only as a temporary advertisement','It removed one barrier, while other barriers persisted.','Removing a barrier and increasing visits are meaningful effects.','Transport costs already existed; free entry did not create them.','No such temporary intent is stated.'],
['What does “concealed” mean in this context?','made less apparent','deliberately falsified','permanently eliminated','precisely quantified','The aggregate attendance figure obscured remaining access problems.','The passage does not allege deliberate falsification.','The barriers persisted rather than disappeared.','A total count failed to identify the distribution of visitors precisely.'],
['Which data would best support the museum’s new evaluation approach?','Changes in first-time attendance by neighborhood','The total number of tickets printed before fees were removed','The age of the museum’s oldest exhibit','The number of website photographs viewed by existing members','This measures whether new populations are gaining access, rather than just aggregate visits.','Old ticket-printing totals do not reveal new visitor diversity.','Exhibit age does not measure access.','Existing members’ browsing does not show who newly attends.']
]},
{title:'6 · Training and transfer',text:`A manufacturer introduced online safety modules and reported a ninety-eight percent completion rate. Supervisors nevertheless continued to observe errors on the factory floor. An external reviewer found that most assessment questions required workers to recognize definitions, while actual tasks demanded judgments under time pressure. The company added short, supervised simulations using common workplace scenarios. Errors subsequently declined, although a simultaneous equipment upgrade meant that the effect of the simulations could not be isolated. The reviewer recommended keeping completion records for administrative purposes while adding direct observation of performance. In her view, finishing a course showed exposure to material; it did not by itself demonstrate that learning transferred to the situations in which it was needed.`,qs:[
['What was the main limitation of the original assessments?','They tested recognition rather than the judgments required on the job.','They required more time than real factory tasks.','They included scenarios drawn from actual work.','They were completed by too few workers to be useful.','Definitions do not adequately test applying knowledge under workplace pressure.','No comparison of assessment duration and task duration is provided.','Realistic scenarios were added later in simulations.','Completion was ninety-eight percent, so low participation was not the issue.'],
['Why can the decline in errors not be attributed confidently to simulations alone?','Equipment was upgraded at the same time.','The simulations were never completed.','All performance observations were discontinued.','The modules contained no safety material.','The concurrent upgrade is a competing explanation for improved safety performance.','The passage does not say simulations were left incomplete.','Direct observation was recommended, not discontinued.','The modules were explicitly safety modules.'],
['What does “transferred” mean in the final sentence?','was applied successfully in another context','was copied into a different document','was assigned to another employee','was replaced with newer information','Learning transfer is applying acquired knowledge or skills in relevant real situations.','The passage concerns behavior, not copying documents.','The learner remains the worker; responsibility is not reassigned.','Transfer is application rather than replacement of knowledge.'],
['Which statement would the reviewer most likely endorse?','Completion and competence should be measured separately.','Course completion records have no administrative value.','Definitions should never appear in safety training.','Equipment improvements make all training unnecessary.','She retains completion records while adding performance evidence, distinguishing exposure from competence.','She explicitly preserves their administrative use.','She criticizes relying on recognition alone, not all teaching of definitions.','No claim is made that equipment removes the need for training.'],
['Which assessment best addresses the identified weakness?','A worker demonstrates the correct response to a simulated equipment fault.','A worker clicks a button confirming that the module was opened.','A worker matches safety terms with dictionary definitions.','A worker rates the visual quality of the training slides.','A realistic demonstration tests applied judgment, the gap in the original approach.','Opening content measures exposure rather than competence.','This repeats the original recognition-based limitation.','Design preferences do not show safe task performance.']
]},
{title:'7 · Storing renewable power',text:`A regional grid operator compared battery storage with pumped-water storage. Batteries could be installed quickly near areas of demand and respond rapidly to fluctuations. Pumped storage required suitable geography and lengthy construction, but its reservoirs could supply energy over longer periods. A consultant warned against ranking the technologies by a single cost-per-unit figure. The value of storage depended on the service required: smoothing brief variations was different from covering several days of low wind. Environmental effects and transmission constraints also varied by location. The operator ultimately commissioned a portfolio study, asking which combination of resources could meet reliability targets at acceptable cost. The aim was not to identify a universally superior technology but to match different capabilities to different system needs.`,qs:[
['What is the passage’s main conclusion?','Storage choices should reflect the services and constraints of a particular grid.','Battery storage is always cheaper than pumped storage.','Pumped storage can be built anywhere if demand is high enough.','Reliability can be assessed without considering cost.','The passage repeatedly connects technology value to specific tasks and local constraints.','No universal cost ranking is established.','Suitable geography is explicitly required.','The portfolio study combines reliability with acceptable cost.'],
['Why might a single cost-per-unit figure be misleading?','It may ignore differences in the type and duration of service delivered.','Storage technologies do not have measurable costs.','All locations face identical transmission constraints.','Construction time determines every aspect of value.','Short fluctuations and multi-day shortages require different capabilities, which one price figure may hide.','The issue is interpretation of cost, not inability to measure it.','Constraints vary by location according to the passage.','Construction time is one factor among several.'],
['Which need is most directly associated with the described advantage of pumped storage?','Providing energy over an extended period','Installing capacity quickly beside city demand','Avoiding all geographical restrictions','Responding without any environmental effects','The reservoirs’ stated advantage is longer-duration supply.','Quick installation near demand is attributed to batteries.','Pumped storage requires suitable geography.','Environmental effects are relevant to the comparison and are not absent.'],
['In context, a “portfolio” study examines:','a combination of resources','a history of electricity prices','a list of investors’ personal assets','a single technology in isolation','The following sentence specifies a combination of resources serving system needs.','Price history could inform a study, but it is not the meaning of portfolio here.','The context is grid planning rather than personal investments.','A portfolio combines resources rather than isolates one.'],
['Which inference is most justified?','Two technologies may complement each other despite competing in some applications.','Using multiple technologies guarantees the lowest possible cost.','A slow construction process always makes a technology unsuitable.','Every grid should adopt the same mixture of storage types.','Different strengths can address different needs within a combined system.','The study seeks a suitable combination; no guarantee of minimum cost is made.','Long-duration benefits may justify lengthy construction.','Local variation argues against a universal mixture.']
]},
{title:'8 · Language in job advertisements',text:`A recruitment team replaced broad personality labels in its advertisements with descriptions of observable work. Instead of seeking a “natural leader,” it asked for evidence of coordinating colleagues and resolving disagreements. Applications increased, and reviewers found it easier to compare candidates. However, the team could not tell whether the new wording attracted different applicants or simply helped existing applicants describe relevant experience more clearly. It also discovered that some tasks listed as essential were rarely performed. Hiring managers therefore reviewed requirements before changing further advertisements. The exercise suggested that clearer language could improve recruitment, but only when the language accurately represented the job rather than polishing assumptions that had never been examined.`,qs:[
['What advantage did the revised advertisements have?','They made relevant experience easier to describe and compare.','They removed the need to evaluate candidates.','They guaranteed that every applicant had leadership experience.','They eliminated disagreements among employees.','Observable tasks provided a clearer basis for applications and comparison.','Reviewers still evaluated candidates, but comparison became easier.','No universal guarantee about experience is given.','Resolving disagreements is a job skill in the ad, not a reported outcome.'],
['What remained uncertain after applications increased?','Whether the wording changed the applicant pool or applicants’ descriptions','Whether any advertisements had actually been revised','Whether reviewers had access to applications','Whether the organization needed any employees','Both explanations for the improvement are explicitly left open.','The replacements are directly described.','Reviewers compared the candidates, implying access.','The organization’s overall staffing need is not questioned.'],
['Why did managers review job requirements?','Some supposedly essential tasks were seldom performed.','Applicants refused to provide examples of experience.','The old personality labels had been legally prohibited.','The number of applications had fallen below expectations.','The discovery of rarely performed essential tasks prompted examination of the underlying requirements.','No refusal is mentioned.','No legal prohibition is reported.','Applications increased, not decreased.'],
['What does “polishing assumptions” suggest?','Improving the presentation of ideas without checking their validity','Removing all requirements from a job description','Rewriting advertisements in more technical language','Testing every candidate’s assumptions in an interview','The phrase contrasts clearer wording with scrutiny of whether the underlying job requirements are accurate.','The aim is accurate requirements, not their elimination.','Polishing need not mean adding technical language.','The assumptions belong to the job description, not specifically to candidates.'],
['Which title best fits the passage?','Clearer Recruitment Starts with Understanding the Work','Why Leadership Skills No Longer Matter','How More Applications Guarantee Better Hires','The Case for Removing All Essential Criteria','The passage links clearer task descriptions with validating the work actually required.','Leadership is reframed in observable terms, not dismissed.','Application growth is reported without proving better hires.','It recommends reviewing criteria, not abolishing them.']
]},

{title:'9 · Repairing rather than replacing',text:`A local authority offered vouchers for repairing household appliances, hoping to reduce waste. Participating repair shops reported strong demand, but the program’s environmental effect was harder to establish. Some repaired devices remained in use for years; others were replaced shortly afterward. A few households used the savings to buy additional appliances. Analysts also noted that keeping an exceptionally inefficient refrigerator running could consume more energy than replacing it with a modern model. They recommended evaluating the program over the full life of products, including manufacturing, transport, and use. This did not imply that repair was generally undesirable. It meant that the avoided purchase, the extra service life, and the efficiency of the retained device all mattered when estimating environmental benefits.`,qs:[
['Why does strong demand for vouchers not establish environmental success?','Participation does not reveal how repairs change lifetime resource use.','Repair shops cannot accurately count their customers.','Every repaired device consumes more energy than a new one.','Households invariably discard appliances immediately after repair.','Environmental outcomes depend on replacement avoided, duration, efficiency, and additional purchases.','No counting problem is alleged.','The concern applies to exceptionally inefficient devices, not all devices.','Some repaired devices remained in use for years.'],
['What is the role of the refrigerator example?','It shows a circumstance in which extending product life may have an environmental cost.','It establishes that repairing any appliance is pointless.','It explains why all voucher users bought extra appliances.','It demonstrates that manufacturing uses no energy.','An inefficient refrigerator may consume enough extra energy to complicate the case for keeping it.','The passage explicitly rejects a general condemnation of repair.','Only a few households bought additional devices, and their reasons differ.','Manufacturing is explicitly included in the recommended evaluation.'],
['Which inference is supported by the passage?','A repair that delays replacement substantially may have different benefits from a brief repair.','Transport always outweighs manufacturing in environmental impact.','The authority intended to increase appliance sales.','Repair demand declined throughout the program.','Extra service life is identified as a key factor in estimating benefits.','No ranking of transport and manufacturing impacts is given.','The stated intention was waste reduction.','Repair shops reported strong demand, with no decline described.'],
['“Retained” most nearly means:','kept rather than replaced','returned to the manufacturer','temporarily rented','modified beyond recognition','The retained device is the repaired appliance that remains in service.','Returning a device would not mean retaining it in the household.','Renting is not part of the described scheme.','Retention does not imply extensive modification.'],
['Which evaluation would best follow the analysts’ recommendation?','Compare lifetime impacts with and without repair, including likely replacement timing.','Count vouchers issued and assume each one prevents a new purchase permanently.','Measure only the electricity used by repair shops.','Exclude manufacturing because it occurs before household use.','This captures the full lifecycle and the realistic alternative to repair.','Issuance does not show permanent avoidance, and some devices were replaced soon afterward.','Repair-shop electricity is only a small part of the relevant lifecycle.','The analysts explicitly include manufacturing.']
]},
{title:'10 · When a forecast becomes a target',text:`A hospital began predicting daily demand for beds to improve staffing. Initially, forecasts were treated as uncertain estimates and updated when new information arrived. Later, senior managers began evaluating departments on how closely actual occupancy matched the forecast. Staff responded by delaying some admissions and adjusting discharge timing. The reported forecasting error fell, but this no longer necessarily indicated better prediction: operational decisions were being shaped to make reality resemble the target. Clinicians warned that a useful planning tool had acquired a second, conflicting purpose. The hospital retained forecasting but stopped rewarding close numerical matches, instead reviewing the quality of decisions made using the information available at the time.`,qs:[
['What problem arose when forecast accuracy became a performance target?','Staff changed operations to match predictions, making accuracy harder to interpret.','The forecasting system stopped producing numerical estimates.','Demand for beds disappeared entirely.','Managers abandoned all attempts to assess departments.','A smaller gap could reflect altered admissions and discharges rather than improved forecasting.','Forecasts continued to exist and guide targets.','There is no suggestion that bed demand vanished.','Managers changed the assessment approach rather than abandoning evaluation.'],
['Why is the lower forecasting error potentially misleading?','The outcome being predicted was influenced by efforts to meet the prediction.','A lower error always indicates a worse statistical method.','The hospital had failed to record any actual occupancy.','The forecasts were no longer used by any staff.','The prediction and operational outcome became interdependent.','A lower error can reflect improvement, but in this case an alternative mechanism exists.','Actual occupancy had to be recorded to compute matches.','Staff actively used the forecasts as targets.'],
['Which statement best describes the revised evaluation?','It considered whether decisions were reasonable given contemporaneous information.','It rewarded departments only when no forecasts were revised.','It assumed every mismatch reflected staff incompetence.','It judged decisions solely by whether outcomes matched perfectly.','The final sentence focuses on decision quality using information available at the time.','Updating forecasts when information changes was originally useful; banning revision is not proposed.','The passage moves away from equating mismatch with poor performance.','Perfect matches were precisely the reward criterion that was removed.'],
['The phrase “a second, conflicting purpose” refers to using forecasts for:','departmental performance evaluation','estimating likely bed demand','updating staffing plans','communicating new clinical information','Planning was the original purpose; rewarding numerical conformity became the conflicting second purpose.','Demand estimation was the original task rather than the newly added one.','Staffing plans were the initial reason for forecasts.','Communication of clinical information is not identified as the second purpose.'],
['Which general principle is illustrated?','A measure can change meaning when people are rewarded for achieving it.','Forecasting should be avoided whenever uncertainty exists.','Operational choices never affect measured outcomes.','Numerical goals are always more reliable than professional judgment.','Incentives changed behavior, so forecast error no longer had its original interpretation.','Forecasting was retained despite uncertainty.','The entire example shows operational choices affecting outcomes.','The revision gives greater weight to decision quality rather than automatic numerical rewards.']
]},
{title:'11 · Retrieving what we learn',text:`Students often prefer rereading notes because familiar sentences become easier to process. That ease can create an impression of mastery even when the material cannot later be recalled unaided. In a classroom experiment, one group reread a chapter while another closed the book and answered questions from memory. The rereading group expressed greater confidence immediately afterward, but the retrieval group remembered more a week later. Both groups had equal study time. The researchers cautioned that retrieval should be followed by feedback so that errors are corrected. They did not claim that reading was unnecessary: students first needed material to retrieve. Rather, they argued that an activity which feels demanding during study can be more effective than one which feels fluent.`,qs:[
['What contrast does the experiment illustrate?','Immediate confidence can diverge from later retention.','Students who read initially cannot benefit from testing.','Longer study always produces lower confidence.','Feedback is more useful before any attempt at recall.','Rereading produced greater confidence, but retrieval produced better delayed memory.','Initial reading supplies the material for later retrieval.','Study time was equal; no such general relation is proposed.','The recommendation is feedback after retrieval to correct errors.'],
['Why is equal study time mentioned?','It reduces the possibility that extra time explains the retrieval group’s advantage.','It proves that all students had identical prior knowledge.','It establishes that confidence was measured after one week.','It shows that neither group was allowed to read the chapter.','Equal time helps separate the effect of study method from duration.','Equal time does not guarantee equal prior knowledge.','Confidence was measured immediately afterward.','One group reread, and retrieval requires initial exposure.'],
['According to the passage, feedback after retrieval helps:','correct mistaken recall','remove the need for any initial reading','make every question effortless','guarantee permanent memory','Feedback is recommended specifically so errors can be corrected.','Initial learning remains necessary.','Retrieval can remain demanding despite feedback.','No permanent guarantee is claimed.'],
['In context, “fluent” most nearly means:','easy and smooth to process','spoken in a foreign language','supported by formal citations','organized in chronological order','The word describes subjective ease during rereading.','The discussion is about processing ease, not speaking ability.','Citations are unrelated to this meaning.','Chronological organization is not discussed.'],
['Which study routine best reflects the researchers’ argument?','Read a section, recall its ideas without looking, then check and correct the recall.','Reread until every sentence looks familiar and stop without checking recall.','Attempt questions on completely unfamiliar material without feedback.','Use confidence alone to decide whether the topic has been mastered.','This combines initial learning, retrieval, and corrective feedback.','Familiarity can create the misleading impression of mastery described.','The passage stresses initial material and corrective feedback.','The experiment shows confidence can be poorly aligned with retention.']
]},
{title:'12 · Water savings and expanding farms',text:`A farming region subsidized efficient irrigation equipment. Water applied per hectare fell, and officials initially reported the savings as a reduction in pressure on the river. Yet some farmers expanded the area they irrigated, while others switched to thirstier but more profitable crops. Total water extraction therefore fell much less than expected. Hydrologists also distinguished water withdrawn from water consumed: some runoff from older systems had previously returned to the river, while water absorbed by crops did not. They argued that equipment efficiency remained useful but could not substitute for measuring basin-wide consumption. The region later combined technology subsidies with extraction limits and monitoring, treating efficient equipment as one component of water policy rather than a complete solution.`,qs:[
['Why did lower water use per hectare not produce the expected total savings?','Farmers changed the area irrigated and the crops grown.','The equipment increased water application on every hectare.','Officials prohibited farmers from expanding.','All runoff had previously been permanently lost.','Expansion and thirstier crops partly offset the per-hectare efficiency gains.','Water applied per hectare fell according to the passage.','Some farmers did expand, so no effective prohibition is described at that stage.','Some runoff returned to the river.'],
['Why distinguish withdrawn water from consumed water?','Some withdrawn water can return to the river rather than be permanently used by crops.','Consumed water is always cheaper than withdrawn water.','Only withdrawn water can be measured.','Consumption refers exclusively to household drinking water.','Return flows mean gross withdrawals do not equal net consumption.','The distinction is hydrological, not a claim about price.','The recommendation includes measuring consumption.','Crop absorption is explicitly an example of consumption.'],
['What does “substitute for” mean here?','take the place of','provide financial support for','introduce uncertainty into','create an incentive for','Equipment efficiency cannot replace basin-wide consumption measurement.','Subsidizing is financial support; substituting is replacement.','The phrase does not itself mean increasing uncertainty.','An incentive encourages an action rather than replaces it.'],
['What is the author’s view of efficient irrigation equipment?','It can help, but its overall effect depends on behavior and wider policy.','It is environmentally harmful under all circumstances.','It makes monitoring unnecessary once installed.','It should be evaluated only by crop profitability.','The passage recognizes usefulness while describing offsets and a need for broader controls.','A universal negative judgment is explicitly avoided.','Monitoring becomes part of the revised policy.','The policy concern is river pressure and water use, not profit alone.'],
['Which finding would most directly demonstrate reduced pressure on the river?','A sustained reduction in basin-wide net water consumption under comparable conditions','A rise in the number of efficient irrigation units sold','A reduction in the purchase price of thirstier crop seeds','An increase in average crop revenue per hectare','Net consumption at the basin scale addresses the actual resource pressure.','Sales measure adoption rather than final water impacts.','Seed prices do not establish river withdrawals or consumption.','Higher revenue may coexist with higher water consumption.']
]},
{title:'13 · Judging automated decisions',text:`A lender tested an automated application-screening system against decisions made by experienced staff. The system reproduced historical decisions with high accuracy. Its developers treated this as evidence of fairness, but an independent reviewer objected that agreement with past decisions demonstrated consistency with the past, not necessarily equitable treatment. Historical judgments might themselves contain bias. The reviewer recommended comparing error rates across applicant groups and checking whether relevant circumstances were represented in the training data. She also proposed a process through which applicants could challenge incorrect information. The lender kept the system in a limited trial, recognizing that technical accuracy against an existing record and the legitimacy of the decisions were related but distinct questions.`,qs:[
['What assumption did the reviewer challenge?','That reproducing historical decisions accurately establishes fairness','That computers can process application information','That historical staff decisions had ever been recorded','That applicants sometimes submit correct information','Historical agreement does not establish whether the historical benchmark was equitable.','The reviewer questions fairness evaluation, not computational capability.','Recorded decisions are the benchmark used in testing.','The passage does not question the existence of correct submissions.'],
['Why compare error rates across groups?','High overall accuracy may conceal uneven mistakes affecting different applicants.','Every applicant group must contain the same number of people.','Group comparison guarantees that all individual decisions are correct.','Historical records are always free from group differences.','Group-level errors can reveal issues hidden by one aggregate accuracy figure.','Equal group sizes are not required or claimed.','An analysis can detect problems without guaranteeing perfection.','Possible historical bias is one reason for the comparison.'],
['What is the purpose of the proposed challenge process?','To let applicants seek correction of faulty information affecting decisions','To let developers discard every rejected application','To replace all statistical assessment with customer satisfaction','To ensure that every challenged application is approved','The passage explicitly links challenges to incorrect information.','Discarding records would not necessarily correct errors or improve accountability.','Challenges supplement rather than replace evaluation.','A successful correction does not automatically mean approval is deserved.'],
['In context, “legitimacy” concerns whether decisions are:','justifiable and acceptable','computed rapidly','identical to previous judgments','stored in a searchable database','Legitimacy addresses the defensibility of decisions beyond technical match accuracy.','Speed is a performance property, not legitimacy.','The passage distinguishes legitimacy from agreement with history.','Storage accessibility is not the meaning of legitimacy.'],
['Which conclusion is best supported?','A system can match a benchmark well while inheriting weaknesses in that benchmark.','Experienced staff are invariably less fair than automated systems.','The lender permanently abandoned automated screening.','A fairness review is unnecessary when overall accuracy is high.','If historical decisions contain bias, faithfully reproducing them can preserve it.','No blanket comparison of human and machine fairness is established.','The lender retained a limited trial.','High overall accuracy is precisely what the reviewer says is insufficient.']
]},
{title:'14 · A changing archaeological record',text:`For decades, archaeologists found few traces of a coastal community’s early settlements and concluded that its population had been small. Later surveys located submerged foundations offshore. Sea levels had risen since the settlements were occupied, placing some of the oldest sites beyond the areas routinely excavated. The new discoveries did not provide a complete population count, but they weakened the argument based on the scarcity of known sites. Researchers began combining underwater surveys with evidence from inland deposits and historical shorelines. The episode illustrated a recurring difficulty: the surviving and accessible record is not a neutral sample of everything that once existed. Absence from an archaeological database can reflect where researchers are able to look, as well as what people actually built.`,qs:[
['Why was the earlier population estimate reconsidered?','Previously inaccessible settlement evidence was found offshore.','Researchers discovered that all inland deposits were artificial.','The sea level had remained unchanged for centuries.','A complete census of the ancient community was recovered.','Submerged foundations show that the known site count had missed part of the settlement record.','No such discovery is described.','Rising sea levels explain the submerged sites.','The passage explicitly says no complete population count was provided.'],
['What is the function of the statement about a “neutral sample”?','It warns that preservation and accessibility can bias the evidence available.','It establishes that all archaeological databases are fabricated.','It argues that surviving objects have no historical value.','It suggests that researchers should only study underwater sites.','The accessible record reflects survival and search conditions rather than every past settlement equally.','Biased coverage is different from fabrication.','Evidence remains useful but needs cautious interpretation.','Researchers combined underwater and inland evidence.'],
['Which inference is warranted?','Few known sites do not necessarily mean few sites originally existed.','The community must have been the largest in its region.','All coastal settlements eventually become submerged.','Underwater surveying gives an exact population count.','Missing sites may reflect limited search access rather than a small original population.','The new evidence weakens one inference but does not establish a regional ranking.','The passage describes a particular history, not a universal outcome.','The discoveries did not yield a complete count.'],
['“Scarcity” most nearly means:','small number','poor condition','uncertain ownership','recent discovery','Scarcity of known sites means that few were known.','Condition is distinct from quantity.','Ownership is not discussed.','Scarcity does not indicate when sites were found.'],
['Which research strategy best follows the lesson of the passage?','Examine how changes in landscape affect which sites can be detected.','Treat every empty search area as proof that nobody lived there.','Exclude submerged evidence from settlement estimates.','Assume accessible sites represent all historical activity equally.','Landscape change can hide sites and distort the accessible sample.','An absence may reflect detection limits rather than genuine non-occupation.','Submerged evidence is exactly what corrected the earlier view.','The passage explicitly challenges the assumption of neutral representation.']
]},
{title:'15 · Standardizing professional work',text:`A consultancy introduced templates to make client reports more consistent. Junior staff spent less time deciding how to structure documents, and reviewers could locate key information quickly. Yet some teams began filling every section even when a project did not justify it, producing repetitive reports with an appearance of completeness. Others omitted unusual findings because no heading seemed suitable. The firm revised the templates to distinguish mandatory evidence from optional presentation elements and added a section for exceptions. Senior reviewers were asked to assess whether the structure served the analysis. The revised approach preserved the efficiency of standardization while recognizing that a well-organized document could still be incomplete in substance.`,qs:[

{title:'16 · Reporting uncertainty',text:`A coastal agency published a range of possible flood levels rather than a single prediction. Some residents initially regarded the range as a sign that the agency knew little. Officials responded by explaining which uncertainties arose from weather variability and which reflected limited local measurements. They also connected the range to practical decisions: an inexpensive temporary barrier might be sensible across many scenarios, whereas an irreversible construction project required closer examination of extreme outcomes. A communication study found that these explanations improved understanding more than merely narrowing the published range. The agency concluded that useful precision did not mean presenting unwarranted certainty. Its task was to show how available evidence could guide action while making the limits of that evidence visible.`,qs:[

function start(ids=null){let mins=Number(document.getElementById('time-limit')?.value||0);const begin=()=>{const now=Date.now();state={version:1,ids:ids||bank.map(q=>q.id),index:0,answers:{},checked:{},flags:{},mode:ids?'study':homeMode,started:now,deadline:!ids&&mins?now+mins*60000:null,finished:false,practice:!!ids};navFilter='all';save();view='exam';renderExam();startClock()};if(state&&!ids)confirmAction('Start a new attempt?','This replaces the saved attempt in this browser. Download your existing results first if you want to keep them.',begin);else begin()}

="row"><button data-action="section" data-section="Grammar">Grammar</button><button data-action="section" data-section="Vocabulary">Vocabulary</button><button data-action="section" data-section="Reading">Reading</button></div></details></aside><section class="panel"><div class="row spread"><div class="row"><span class="badge">${q.section}</span><span class="fine">Question ${q.id+1} of 200${state.practice?' · retry '+(state.index+1)+' / '+state.ids.length:''}</span></div><button data-action="flag" aria-pressed="${!!state.flags[q.id]}">${state.flags[q.id]?'★ Flagged':'☆ Flag for review'}</button></div>${q.passage?`<details class="passage" open><summary>Reading passage ${esc(q.passage.title)}</summary><p>${esc(q.passage.text)}</p></details>`:''}<h2 class="question" id="question-heading" tabindex="-1">${esc(q.prompt)}</h2><div role="group" aria-labelledby="question-heading">${q.options.map((o,i)=>`<button class="option ${selected===i?'selected ':''}${reveal?(i===q.correct?'correct':selected===i?'wrong':''):''}" data-action="answer" data-option="${i}" aria-pressed="${selected===i}" ${reveal?'disabled':''}><span class="letter">${letters[i]}</span><span class="opt-text">${esc(o)}</span>${reveal&&i===q.correct?'<span class="status good-text">✓ Correct</span>':reveal&&selected===i?'<span class="status bad-text">✕ Your answer</span>':selected===i?'<span class="status">Selected</span>':''}</button>`).join('')}</div>${!reveal&&state.mode==='study'?`<div class="row"><button class="primary" data-action="check" ${selected===undefined?'disabled':''}>Check answer</button><span class="fine">Check to lock your choice and see the explanations.</span></div>`:''}${reveal?`<div class="feedback" role="region" aria-label="Answer explanations"><h3 class="${correct(q.id)?'good-text':'bad-text'}">${selected===undefined?'Not answered':correct(q.id)?'✓ Correct':'Not quite'} · Answer ${letters[q.correct]}</h3><p class="fine">Skill: ${esc(q.topic)}</p>${q.options.map((o,i)=>`<div class="explanatio function submit(){const missing=state.ids.filter(id=>!Number.isInteger(state.answers[id])).length;const unchecked=state.mode==='study'?state.ids.filter(id=>Number.isInteger(state.answers[id])&&!state.checked[id]).length:0;confirmAction('Submit this attempt?',`${missing?missing+' unanswered question(s) will count as incorrect. ':''}${unchecked?unchecked+' selected but unchecked answer(s) will be submitted. ':''}Your answers will be locked, and you will see your results and explanations.`,()=>finish(false));}

'Tenses & time':'Draw a timeline before choosing a tense. Contrast past perfect, present perfect, future perfect, and duration; then write five original examples.',

'Inversion & emphasis':'Rewrite ordinary sentences using only after, not until, scarcely, and not only. Check auxiliary–subject order and the following verb form.',
'Subjunctive & reporting':'Contrast demands and recommendations with evidence reporting: “insist that she be” versus “results suggest that it is.” Practice reporting passives.',
'Linking & clause structure':'Sort connectors by what follows them: noun phrase, finite clause, or complete sentence. Practice despite/although, so/that, and otherwise.',

'Verb patterns':'Learn verbs with their complements, not as isolated words: deny doing, be required to do, object to doing, and stop to do versus stop doing.',
'Passive & participles':'Identify who performs and who receives the action. Practice being + past participle, have something done, and introductory participle clauses.',
