'Details & logical connections':'Locate the exact supporting sentence, then check what each pronoun, contrast, and cause refers to. Reject plausible statements not supported by the text.'};
function results(){view='results';clearInterval(clockInterval);const s=stats();const level=cefr(s);const weak=s.topics.filter(t=>t.right<t.total).slice(0,5);app.innerHTML=`<div class="result-hero"><div><div class="score">${s.pct}%</div><p>${s.right} / ${s.total} correct</p></div><div><div class="eyebrow" style="color:#b8d6ca">${state.practice?'Mistake retry results':'Your learning snapshot'}</div><h1>${level.title}</h1><p class="muted">${s.attempted} answered · ${s.total-s.attempted} unanswered · ${state.mode==='exam'?'Exam':'Study'} mode · ${timeText(Math.floor((state.ended-state.started)/1000))} elapsed${state.expired?' · Time expired':''}</p></div></div><div class="row actions"><button class="primary" data-action="review">Review all answers</button><button data-action="review-wrong">Review mistakes (${s.total-s.right})</button><button data-action="retry" ${s.right===s.total?'disabled':''}>Retry mistakes</button><button data-action="download">Download results</button><button data-action="home">New exam / home</button></div><div class="result-grid"><section class="panel"><h2>Your CEFR indication</h2><div class="scale">${['A1','A2','B1','B2','C1','C2'].map(l=>`<div class="${level.range.includes(l)?'active':''}"><strong>${l}</strong><br>${{A1:'Beginner',A2:'Elementary',B1:'Intermediate',B2:'Upper-inter.',C1:'Advanced',C2:'Proficient'}[l]}</div>`).join('')}</div><p>${level.text}</p><div class="notice">An informal indication of <strong>reading and language knowledge only</strong>. The score bands are study guides chosen for this practice set, not validated CEFR or TOEFL conversions. Speaking, listening, and writing are not tested.${state.mode==='study'?' Immediate feedback may help with later questions, so study-mode scores are less independent.':''}</div><details style="margin-top:18px"><summary>How the score bands work</summary><p class="fine">Only a complete first attempt at all 200 questions receives an indication. Below 40%: below the B2 target, with A1–B1 unresolved. 40–under 60%: B1–B2 study-planning range. 60–under 80%: B2–C1 study-planning range. 80–100%: strong advanced, C1-compatible performance; C2 remains unconfirmed. These boundaries have not been empirically calibrated. Correct guesses, prior exposure, and outside help can inflate the score.</p></details></section><section class="panel"><h2>Section performance</h2><div class="bars">${s.sections.map(t=>`<div class="bar"><div class="bar-head"><strong>${t.name}</strong><span>${t.right}/${t.total} · ${Math.round(t.right/t.total*100)}%</span></div><div class="track"><i style="width:${t.right/t.total*100}%"></i></div></div>`).join('')}</div><p class="fine">Each question earns one point; no negative marking. Unanswered questions count as incorrect. Reading has 80 questions, so it contributes 40% of the total; grammar and vocabulary contribute 30% each.</p><h3>What you did well</h3><p>${s.topics.filter(t=>t.right/t.total>=.8&&t.attempted>=3).sort((a,b)=>b.total-a.total).slice(0,3).map(t=>`${esc(t.name)} (${t.right}/${t.total})`).join(' · ')||'No topic has enough strong results to highlight yet. Use the priorities below to build a foundation.'}</p><p class="fine">Topic results describe this attempt. Categories with only a few questions are small samples, not firm diagnoses.</p></section></div><section class="panel"><h2>Weaknesses & next steps</h2><p class="muted">${weak.length?'Start with the lowest-scoring topics. If you left questions blank, those may reflect time pressure rather than lack of knowledge.':'You answered every question correctly. Try an unseen assessment and practice writing, speaking, and listening to examine skills this exam cannot measure.'}</p><ol class="plan">${weak.map(t=>`<li><strong>${esc(t.name)} — ${t.right}/${t.total} correct${t.total<5?' · small sample':''}</strong><br>${advice[t.name]} ${t.attempted<t.total?`<span class="fine">${t.total-t.attempted} unanswered.</span>`:''}</li>`).join('')}</ol>${weak.length?'<div class="notice"><strong>A practical 7-day plan:</strong> Days 1–2: review the explanations for your two weakest topics and write your own examples. Days 3–4: practice the next two topics and explain why each distractor is wrong. Day 5: read two unfamiliar articles and summarize their claims and evidence. Day 6: retry your mistakes here. Day 7: use an unseen assessment to check transfer. A better score on repeated questions shows learning of this material, not a new level measurement.</div>':''}</section><section class="panel" style="margin-top:22px"><h2>Full skill breakdown</h2><div class="table-wrap"><table><thead><tr><th>Skill</th><th>Section</th><th>Correct</th><th>Answered</th><th>Score</th></tr></thead><tbody>${s.topics.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.section}</td><td>${t.right}/${t.total}</td><td>${t.attempted}/${t.total}</td><td>${Math.round(t.right/t.total*100)}%${t.total<5?' *':''}</td></tr>`).join('')}</tbody></table></div><p class="fine">* Fewer than five questions: interpret cautiously. Reading questions sharing a passage are not fully independent measurements.</p></section>${footer()}`;window.scrollTo(0,0);}
function download(){const s=stats(),l=cefr(s);const lines=['ENGLISH RANGE — RESULTS',new Date(state.ended).toLocaleString(),`Score: ${s.right}/${s.total} (${s.pct}%)`,`Answered: ${s.attempted}/${s.total}`,`Mode: ${state.mode}${state.practice?' — repeated-question practice':''}`,`Elapsed: ${timeText(Math.floor((state.ended-state.started)/1000))}`,'',l.title,l.text,'Informal, unvalidated study guide for reading and language knowledge only. Not an official CEFR or TOEFL score. Speaking, listening, and writing were not assessed.','', 'SECTIONS',...s.sections.map(t=>`${t.name}: ${t.right}/${t.total}`),'','SKILLS',...s.topics.map(t=>`${t.name}: ${t.right}/${t.total} correct; ${t.attempted}/${t.total} answered${t.total<5?' (small sample)':''}`),'','PRIORITY STUDY PLAN',...s.topics.filter(t=>t.right<t.total).slice(0,5).map(t=>`${t.name}: ${advice[t.name]}`),'','ANSWER REVIEW',...state.ids.map(id=>{const q=bank[id],a=state.answers[id];return`Q${id+1}: ${q.prompt}\nYour answer: ${a===undefined?'Unanswered':letters[a]+'. '+q.options[a]}\nCorrect: ${letters[q.correct]}. ${q.options[q.correct]}\n${q.options.map((o,i)=>letters[i]+'. '+o+' — '+q.explanations[i]).join('\n')}`})];const blob=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='english-range-results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
app.addEventListener('change',e=>{if(e.target.id==='nav-filter'){if(state.finished)reviewFilter=e.target.value;else navFilter=e.target.value;renderExam()}});
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;switch(action){case'mode':{const time=document.getElementById('time-limit').value;homeMode=b.dataset.mode;home();document.getElementById('time-limit').value=time;break}case'start':start();break;case'resume':resume();break;case'home':home();break;case'answer':{const q=currentQ();if(state.finished||state.checked[q.id])break;state.answers[q.id]=Number(b.dataset.option);save();renderExam();document.querySelector(`[data-action="answer"][data-option="${b.dataset.option}"]`)?.focus();announce('Choice '+letters[Number(b.dataset.option)]+' selected.');break}case'check':{const q=currentQ();if(state.answers[q.id]===undefined)break;state.checked[q.id]=true;save();renderExam();announce(correct(q.id)?'Correct. Explanations are below.':'Incorrect. The correct answer and explanations are below.');break}case'flag':state.flags[currentQ().id]=!state.flags[currentQ().id];save();renderExam();document.querySelector('[data-action="flag"]')?.focus();break;case'next':case'prev':state.index=Math.max(0,Math.min(state.ids.length-1,state.index+(action==='next'?1:-1)));save();renderExam(true);window.scrollTo(0,0);break;case'jump':state.index=state.ids.indexOf(Number(b.dataset.id));save();renderExam(true);break;case'section':{let ix=state.ids.findIndex(id=>bank[id].section===b.dataset.section);if(ix>=0){state.index=ix;save();renderExam(true)}else announce('This retry has no questions from that section.');break}case'submit':submit();break;case'results':results();break;case'review':reviewFilter='all';state.index=0;renderExam(true);break;case'review-wrong':reviewFilter='wrong';state.index=Math.max(0,state.ids.findIndex(id=>!correct(id)));renderExam(true);break;case'retry':{const ids=state.ids.filter(id=>!correct(id));if(ids.length)confirmAction('Start a focused retry?','This replaces the saved attempt with a study-mode retry of your incorrect and unanswered questions. Download your results first if you want to keep the full report. Retry scores do not receive a CEFR indication.',()=>start(ids));break}case'download':download();break;}});
home();

</script></body></html>
